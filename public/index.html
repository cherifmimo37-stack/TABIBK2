<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>طبيبك | TABIBK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   TABIBK PREMIUM ENTRY
   PURPLE + SILVER GLASS + GOLD
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:"Cairo",sans-serif;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(232,199,107,.18),
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 25%,
            rgba(155,98,198,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(255,255,255,.08),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #16091f 0%,
            #2b103f 42%,
            #43205b 68%,
            #17101f 100%
        );

    color:#fff;

    min-height:100vh;

    overflow-x:hidden;
}

/* =========================================================
   MEDICAL BACKGROUND
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

    pointer-events:none;

    z-index:0;
}

body::after{

    content:"";

    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    border:
        1px solid rgba(232,199,107,.12);

    right:-210px;
    bottom:-210px;

    box-shadow:
        0 0 80px rgba(201,151,50,.06);

    pointer-events:none;

    z-index:0;
}

/* =========================================================
   MAIN
========================================================= */

.page{

    width:100%;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    position:relative;

    z-index:1;

    padding:
        20px
        16px
        18px;
}

/* =========================================================
   ADMIN BUTTON
========================================================= */

.admin-area{

    width:100%;

    max-width:920px;

    display:flex;

    justify-content:flex-start;

    margin-bottom:8px;
}

.admin-btn{

    border:1px solid rgba(232,199,107,.48);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    color:#f7e4a6;

    border-radius:14px;

    padding:
        9px
        15px;

    font-family:inherit;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 8px 24px rgba(0,0,0,.18),
        inset 0 1px rgba(255,255,255,.12);

    transition:.25s;
}

.admin-btn:hover{

    transform:translateY(-2px);

    border-color:#e8c76b;

    box-shadow:
        0 12px 30px rgba(0,0,0,.25),
        0 0 20px rgba(232,199,107,.08);
}

/* =========================================================
   BRAND
========================================================= */

.brand{

    text-align:center;

    margin-top:4px;

    margin-bottom:18px;

    position:relative;
}

.heart-logo{

    width:82px;

    height:82px;

    margin:0 auto 7px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    color:#e8c76b;

    font-size:57px;

    line-height:1;

    text-shadow:
        0 0 15px rgba(232,199,107,.28),
        0 8px 30px rgba(0,0,0,.35);

    animation:
        heartPulse 1.7s ease-in-out infinite;
}

.heart-logo::after{

    content:"";

    position:absolute;

    width:65px;
    height:20px;

    left:50%;
    top:53%;

    transform:
        translate(-50%,-50%);

    border-bottom:
        2px solid rgba(255,255,255,.75);

    clip-path:
        polygon(
            0 55%,
            25% 55%,
            35% 20%,
            45% 90%,
            55% 10%,
            65% 55%,
            100% 55%
        );

    opacity:.8;
}

@keyframes heartPulse{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.045);
    }
}

.brand h1{

    font-size:
        clamp(29px,7vw,43px);

    font-weight:900;

    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #e9d58e,
            #fff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 7px 25px rgba(0,0,0,.25);
}

.brand p{

    color:
        rgba(255,255,255,.72);

    font-size:
        clamp(11px,3vw,14px);

    margin-top:3px;

    font-weight:600;
}

/* =========================================================
   MEDICAL GLASS PANEL
========================================================= */

.panel{

    width:100%;

    max-width:920px;

    padding:
        21px;

    border-radius:30px;

    border:
        1px solid rgba(255,255,255,.16);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.13);

    position:relative;

    overflow:hidden;
}

.panel::before{

    content:"";

    position:absolute;

    width:300px;
    height:300px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(232,199,107,.08),
            transparent 70%
        );

    top:-160px;
    right:-100px;

    pointer-events:none;
}

.panel::after{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(155,98,198,.10),
            transparent 70%
        );

    bottom:-160px;
    left:-90px;

    pointer-events:none;
}

/* =========================================================
   CARDS
========================================================= */

.cards{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:18px;

    position:relative;

    z-index:2;
}

.entry-card{

    min-height:315px;

    border-radius:25px;

    padding:
        20px 18px 18px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    cursor:pointer;

    position:relative;

    overflow:hidden;

    border:
        1px solid rgba(232,199,107,.38);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.045)
        );

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 45px rgba(0,0,0,.22),
        inset 0 1px rgba(255,255,255,.14);

    transition:
        transform .28s ease,
        box-shadow .28s ease,
        border-color .28s ease;
}

.entry-card::before{

    content:"";

    position:absolute;

    inset:7px;

    border-radius:19px;

    border:
        1px solid rgba(255,255,255,.06);

    pointer-events:none;
}

.entry-card::after{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.08),
            transparent 70%
        );

    top:-80px;
    left:-65px;

    pointer-events:none;
}

.entry-card:hover{

    transform:
        translateY(-7px)
        scale(1.012);

    border-color:
        rgba(232,199,107,.72);

    box-shadow:
        0 28px 55px rgba(0,0,0,.32),
        0 0 28px rgba(232,199,107,.06),
        inset 0 1px rgba(255,255,255,.18);
}

/* =========================================================
   AVATAR
========================================================= */

.avatar-wrap{

    width:142px;
    height:142px;

    border-radius:50%;

    padding:4px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    margin-bottom:13px;

    background:
        linear-gradient(
            145deg,
            #f4dc83,
            #b98b27,
            #f8e8ad
        );

    box-shadow:
        0 15px 35px rgba(0,0,0,.28),
        0 0 25px rgba(232,199,107,.09);
}

.avatar-wrap::before{

    content:"";

    position:absolute;

    inset:-5px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.22);

    pointer-events:none;
}

.avatar-wrap img{

    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;

    object-position:center top;

    display:block;

    background:
        linear-gradient(
            145deg,
            #eee,
            #cfcfcf
        );
}

/* =========================================================
   CARD TEXT
========================================================= */

.card-title{

    font-size:
        clamp(18px,4vw,23px);

    font-weight:900;

    color:#fff;

    margin-bottom:3px;

    text-shadow:
        0 5px 15px rgba(0,0,0,.3);
}

.card-subtitle{

    font-size:11px;

    color:
        rgba(255,255,255,.65);

    margin-bottom:15px;
}

/* =========================================================
   ACTION BUTTON
========================================================= */

.entry-btn{

    width:100%;

    max-width:260px;

    min-height:49px;

    border:none;

    border-radius:15px;

    font-family:inherit;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    transition:.25s;

    position:relative;

    overflow:hidden;
}

.entry-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.28),
            transparent
        );

    transform:skewX(-20deg);

    transition:.55s;
}

.entry-btn:hover::before{

    left:140%;
}

.entry-btn:hover{

    transform:
        translateY(-3px);

}

.doctor-btn{

    background:
        linear-gradient(
            135deg,
            #8a3bb0,
            #542075
        );

    color:#fff;

    border:
        1px solid rgba(232,199,107,.38);

    box-shadow:
        0 10px 25px rgba(74,27,101,.38);
}

.patient-btn{

    background:
        linear-gradient(
            135deg,
            #f0d77e,
            #b98a27
        );

    color:#241035;

    box-shadow:
        0 10px 25px rgba(201,151,50,.24);

    border:
        1px solid rgba(255,255,255,.45);
}

/* =========================================================
   FOOTER
========================================================= */

.footer{

    width:100%;

    max-width:920px;

    text-align:center;

    padding-top:14px;

    color:
        rgba(255,255,255,.48);

    font-size:10px;

    position:relative;

    z-index:2;
}

.footer strong{

    color:#e4c76c;

    font-weight:800;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:680px){

    .page{

        padding:
            13px
            10px
            12px;
    }

    .admin-area{

        margin-bottom:3px;
    }

    .admin-btn{

        font-size:11px;

        padding:
            8px 12px;
    }

    .brand{

        margin-bottom:13px;
    }

    .heart-logo{

        width:70px;
        height:70px;

        font-size:49px;
    }

    .brand h1{

        font-size:30px;
    }

    .brand p{

        font-size:10px;
    }

    .panel{

        padding:12px;

        border-radius:24px;
    }

    .cards{

        gap:10px;
    }

    .entry-card{

        min-height:260px;

        padding:
            15px 8px 13px;

        border-radius:20px;
    }

    .avatar-wrap{

        width:105px;
        height:105px;

        margin-bottom:10px;
    }

    .card-title{

        font-size:15px;
    }

    .card-subtitle{

        font-size:9px;

        margin-bottom:11px;
    }

    .entry-btn{

        min-height:43px;

        font-size:11px;

        border-radius:12px;
    }

}

@media(max-width:390px){

    .entry-card{

        min-height:240px;
    }

    .avatar-wrap{

        width:91px;
        height:91px;
    }

    .entry-btn{

        font-size:10px;
    }

}

/* =========================================================
   TOUCH
========================================================= */

button,
.entry-card{

    -webkit-tap-highlight-color:
        transparent;

    user-select:none;
}

</style>

</head>


<body>

<div class="page">

    <!-- الإدارة -->
    <div class="admin-area">

        <button
            class="admin-btn"
            type="button"
            onclick="adminLogin()"
        >
            ⚙️ الإدارة
        </button>

    </div>


    <!-- الشعار -->
    <div class="brand">

        <div class="heart-logo">
            ♥
        </div>

        <h1>
            طبيبك
        </h1>

        <p>
            رعاية صحية أقرب إليك
        </p>

    </div>


    <!-- الواجهة الزجاجية -->
    <main class="panel">

        <div class="cards">


            <!-- بطاقة الطبيب -->
            <section
                class="entry-card"
                onclick="doctorLogin()"
            >

                <div class="avatar-wrap">

                    <img
                        src="/images/doctor-ai.png"
                        alt="Doctor"
                    >

                </div>

                <div class="card-title">
                    👨‍⚕️
                </div>

                <div class="card-subtitle">
                    الدخول إلى مساحة الطبيب
                </div>

                <button
                    class="entry-btn doctor-btn"
                    type="button"
                    onclick="event.stopPropagation(); doctorLogin();"
                >
                    <span>دخول الطبيب</span>
                    <span>➜</span>
                </button>

            </section>


            <!-- بطاقة المريض -->
            <section
                class="entry-card"
                onclick="patientLogin()"
            >

                <div class="avatar-wrap">

                    <img
                        src="/images/patient-ai.png"
                        alt="Patient"
                    >

                </div>

                <div class="card-title">
                    💜
                </div>

                <div class="card-subtitle">
                    الدخول إلى مساحة المريض
                </div>

                <button
                    class="entry-btn patient-btn"
                    type="button"
                    onclick="event.stopPropagation(); patientLogin();"
                >
                    <span>دخول المريض</span>
                    <span>➜</span>
                </button>

            </section>


        </div>

    </main>


    <footer class="footer">

        <strong>TABIBK</strong>
        —
        منصة طبيبك للحجز والمتابعة الطبية

    </footer>

</div>


<script>

/* =========================================================
   الدخول — بدون نوافذ إضافية
========================================================= */

function doctorLogin(){

    window.location.href =
        "/doctor.html";

}


function patientLogin(){

    window.location.href =
        "/patient.html";

}


function adminLogin(){

    /*
       الإدارة عندها صفحة دخول خاصة بها.
       لا نفتح أي نافذة هنا حتى لا يطلب
       مفتاح الإدارة مرتين.
    */

    window.location.href =
        "/admin.html";

}

</script>

</body>
</html>
