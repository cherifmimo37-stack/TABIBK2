<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#160522">

    <title>طبيبك | TABIBK</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            font-family: "Cairo", sans-serif;

            color: #fff;

            overflow-x: hidden;

            background:

                radial-gradient(
                    ellipse at 50% 12%,
                    rgba(151, 72, 192, .42),
                    transparent 31%
                ),

                radial-gradient(
                    ellipse at 0% 50%,
                    rgba(100, 36, 145, .42),
                    transparent 35%
                ),

                radial-gradient(
                    ellipse at 100% 70%,
                    rgba(114, 44, 158, .36),
                    transparent 34%
                ),

                linear-gradient(
                    180deg,
                    #21072f 0%,
                    #2b0b3d 38%,
                    #190622 72%,
                    #0e0217 100%
                );

            min-height: 100vh;
        }


        /* =====================================================
           MEDICAL BACKGROUND
           ===================================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    115deg,
                    rgba(255,255,255,.05),
                    transparent 25%,
                    transparent 70%,
                    rgba(255,255,255,.04)
                );

            opacity: .8;
        }


        .medical-bg {

            position: fixed;

            inset: 0;

            z-index: 0;

            overflow: hidden;

            pointer-events: none;
        }


        .medical-bg::before {

            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            left: -180px;
            top: 120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(173, 80, 218, .35),
                    transparent 70%
                );

            filter: blur(12px);
        }


        .medical-bg::after {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            right: -230px;
            top: 210px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(132, 61, 185, .36),
                    transparent 70%
                );

            filter: blur(15px);
        }


        /* medical ECG decoration */

        .ecg-background {

            position: absolute;

            width: 700px;

            opacity: .08;

            left: -130px;

            top: 220px;

            transform: rotate(-7deg);
        }

        .ecg-background path {

            fill: none;

            stroke: #f0d57c;

            stroke-width: 4;

        }


        /* =====================================================
           MAIN
           ===================================================== */

        .page {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1080px;

            margin: auto;

            padding:

                24px 24px
                42px;
        }


        /* =====================================================
           ADMIN
           ===================================================== */

        .admin-area {

            display: flex;

            justify-content: center;

            margin-bottom: 30px;
        }


        .admin-button {

            width: 420px;

            min-height: 82px;

            padding: 11px 17px;

            display: flex;

            align-items: center;

            gap: 15px;

            color: #fff;

            text-decoration: none;

            border-radius: 48px;

            border: 1.5px solid #efd477;

            background:

                linear-gradient(
                    135deg,
                    rgba(47, 14, 64, .97),
                    rgba(25, 6, 35, .97)
                );

            box-shadow:

                0 10px 35px rgba(0,0,0,.34),

                0 0 28px rgba(239,212,119,.12);
        }


        .admin-icon {

            width: 56px;
            height: 56px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffe68d;

            font-size: 24px;

            background:
                linear-gradient(
                    145deg,
                    #4d2361,
                    #24102f
                );

            border:
                1px solid
                rgba(239,212,119,.35);
        }


        .admin-content {

            flex: 1;

            text-align: right;
        }


        .admin-title {

            font-size: 20px;

            line-height: 1.25;

            font-weight: 900;
        }


        .admin-description {

            margin-top: 3px;

            font-size: 11px;

            color: #d7c8dc;
        }


        .admin-arrow {

            width: 43px;
            height: 43px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(117,64,147,.34);

            border:
                1px solid
                rgba(255,255,255,.15);

            font-size: 17px;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .brand {

            text-align: center;

            margin-bottom: 36px;
        }


        .logo-area {

            position: relative;

            width: 190px;
            height: 190px;

            margin: auto;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .logo-ring {

            position: absolute;

            inset: 11px;

            border-radius: 50%;

            border:
                2px solid
                rgba(239,212,119,.55);

            box-shadow:

                0 0 24px
                rgba(239,212,119,.17);
        }


        .heart {

            position: relative;

            width: 96px;
            height: 96px;

            margin-top: 10px;

            transform: rotate(-45deg);

            border-radius: 18px;

            background:

                linear-gradient(
                    145deg,
                    #ffe795,
                    #d2a33a 60%,
                    #a87820
                );

            box-shadow:

                0 0 34px
                rgba(239,212,119,.34),

                inset 4px 5px 10px
                rgba(255,255,255,.38);
        }


        .heart::before,
        .heart::after {

            content: "";

            position: absolute;

            width: 96px;
            height: 96px;

            border-radius: 50%;

            background:

                linear-gradient(
                    145deg,
                    #ffe795,
                    #d2a33a 60%,
                    #a87820
                );
        }


        .heart::before {

            top: -48px;

            left: 0;
        }


        .heart::after {

            top: 0;

            left: 48px;
        }


        .heart-ecg {

            position: absolute;

            z-index: 5;

            width: 135px;

            height: 58px;

            left: 28px;

            top: 68px;
        }


        .heart-ecg path {

            fill: none;

            stroke: #fff;

            stroke-width: 4;

            stroke-linecap: round;

            stroke-linejoin: round;

            filter:
                drop-shadow(
                    0 0 5px
                    rgba(255,255,255,.9)
                );
        }


        .brand-ar {

            font-size: clamp(
                48px,
                7vw,
                72px
            );

            line-height: .95;

            font-weight: 900;

            color: white;

            text-shadow:

                0 5px 22px
                rgba(0,0,0,.35);
        }


        .brand-en {

            margin-top: 12px;

            color: #efd477;

            font-size: 22px;

            font-weight: 700;

            letter-spacing: 10px;

            padding-left: 10px;
        }


        .tagline {

            margin-top: 15px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 17px;

            color: #f0e8f3;

            font-size: 16px;

            font-weight: 600;
        }


        .tagline::before,
        .tagline::after {

            content: "";

            width: 78px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #efd477
                );
        }


        .tagline::after {

            background:
                linear-gradient(
                    90deg,
                    #efd477,
                    transparent
                );
        }


        /* =====================================================
           LOGIN CARDS
           IMPORTANT:
           ALWAYS SIDE BY SIDE
           ===================================================== */

        .login-grid {

            width: 100%;

            max-width: 790px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 26px;
        }


        .login-card {

            position: relative;

            height: 470px;

            min-width: 0;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding: 24px;

            color: white;

            text-decoration: none;

            border-radius: 26px;

            border:
                1px solid
                rgba(225,186,248,.52);

            background:

                linear-gradient(
                    180deg,
                    rgba(151,86,187,.34) 0%,
                    rgba(78,31,99,.56) 38%,
                    rgba(27,7,37,.97) 100%
                );

            box-shadow:

                0 22px 55px
                rgba(0,0,0,.38),

                inset 0 1px 0
                rgba(255,255,255,.10);

            transition: .3s ease;
        }


        .login-card:hover {

            transform: translateY(-7px);

            border-color: #efd477;

            box-shadow:

                0 28px 65px
                rgba(0,0,0,.46),

                0 0 32px
                rgba(169,91,215,.18);
        }


        .login-card::before {

            content: "";

            position: absolute;

            top: -80px;

            left: 50%;

            transform: translateX(-50%);

            width: 280px;
            height: 280px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(202,133,240,.34),
                    transparent 70%
                );
        }


        .login-card::after {

            content: "";

            position: absolute;

            bottom: 0;

            left: 0;
            right: 0;

            height: 4px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #efd477,
                    transparent
                );
        }


        /* =====================================================
           PERSON
           ===================================================== */

        .person-area {

            position: absolute;

            top: 18px;

            left: 0;
            right: 0;

            height: 285px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .person-glow {

            position: absolute;

            width: 245px;
            height: 245px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(189,112,231,.34),
                    transparent 69%
                );
        }


        .person-circle {

            position: relative;

            z-index: 2;

            width: 185px;
            height: 185px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:

                linear-gradient(
                    145deg,
                    rgba(168,98,215,.85),
                    rgba(63,22,83,.96)
                );

            border:
                1px solid
                rgba(255,255,255,.24);

            box-shadow:

                0 22px 40px
                rgba(0,0,0,.34),

                inset 0 3px 14px
                rgba(255,255,255,.12);
        }


        .person-circle i {

            font-size: 108px;

            color: white;

            filter:
                drop-shadow(
                    0 6px 12px
                    rgba(0,0,0,.25)
                );
        }


        .doctor-circle {

            background:

                linear-gradient(
                    145deg,
                    rgba(133,85,201,.90),
                    rgba(51,19,73,.97)
                );
        }


        .doctor-circle i {

            font-size: 98px;
        }


        .role-icon {

            position: absolute;

            z-index: 5;

            bottom: 3px;

            width: 58px;
            height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: white;

            font-size: 22px;

            background:

                linear-gradient(
                    145deg,
                    #a456dc,
                    #57228b
                );

            border:
                2px solid
                rgba(255,255,255,.3);

            box-shadow:
                0 8px 22px
                rgba(0,0,0,.3);
        }


        /* =====================================================
           CARD TEXT
           ===================================================== */

        .card-content {

            position: relative;

            z-index: 6;

            text-align: center;
        }


        .card-title {

            font-size: 30px;

            font-weight: 900;

            margin-bottom: 7px;
        }


        .card-text {

            min-height: 54px;

            color: #eee2f1;

            font-size: 14px;

            line-height: 1.85;

            margin-bottom: 19px;
        }


        .card-button {

            width: 100%;

            height: 54px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 16px;

            border-radius: 32px;

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            background:

                linear-gradient(
                    100deg,
                    #672b92,
                    #934ac1
                );

            border:
                1px solid
                rgba(239,212,255,.46);

            box-shadow:

                0 9px 25px
                rgba(0,0,0,.28),

                inset 0 1px 0
                rgba(255,255,255,.18);
        }


        /* =====================================================
           FEATURES
           ===================================================== */

        .features {

            display: flex;

            justify-content: center;

            align-items: center;

            max-width: 720px;

            margin:
                43px auto
                0;
        }


        .feature {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            color: #eee5f1;

            font-size: 13px;

            white-space: nowrap;
        }


        .feature + .feature {

            border-right:
                1px solid
                rgba(239,212,119,.38);
        }


        .feature i {

            color: #efd477;

            font-size: 21px;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {

            text-align: center;

            margin-top: 48px;
        }


        .footer-title {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 20px;

            color: #efd477;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 6px;
        }


        .footer-title::before,
        .footer-title::after {

            content: "";

            width: 90px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #c79a32
                );
        }


        .footer-title::after {

            background:
                linear-gradient(
                    90deg,
                    #c79a32,
                    transparent
                );
        }


        .footer-text {

            margin-top: 9px;

            color: #bbaac2;

            font-size: 11px;
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 800px) {

            .page {

                padding:
                    18px 15px
                    35px;
            }

            .admin-button {

                width: 380px;
            }

            .login-grid {

                gap: 14px;

                max-width: 700px;
            }

            .login-card {

                height: 425px;

                padding:
                    18px 16px
                    19px;
            }

            .person-area {

                height: 255px;
            }

            .person-circle {

                width: 155px;
                height: 155px;
            }

            .person-circle i {

                font-size: 88px;
            }

            .doctor-circle i {

                font-size: 80px;
            }

            .card-title {

                font-size: 26px;
            }

            .card-text {

                font-size: 12px;
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .page {

                padding:
                    12px 9px
                    28px;
            }


            /* ADMIN */

            .admin-area {

                margin-bottom: 15px;
            }


            .admin-button {

                width: 94%;

                min-height: 62px;

                padding:
                    8px 10px;

                gap: 9px;
            }


            .admin-icon {

                width: 43px;
                height: 43px;

                font-size: 18px;
            }


            .admin-title {

                font-size: 15px;
            }


            .admin-description {

                font-size: 8px;
            }


            .admin-arrow {

                width: 35px;
                height: 35px;

                font-size: 13px;
            }


            /* LOGO */

            .brand {

                margin-bottom: 19px;
            }


            .logo-area {

                width: 132px;
                height: 132px;
            }


            .logo-ring {

                inset: 5px;
            }


            .heart {

                width: 68px;
                height: 68px;

                border-radius: 13px;

                margin-top: 7px;
            }


            .heart::before,
            .heart::after {

                width: 68px;
                height: 68px;
            }


            .heart::before {

                top: -34px;
            }


            .heart::after {

                left: 34px;
            }


            .heart-ecg {

                width: 95px;

                height: 45px;

                left: 19px;

                top: 48px;
            }


            .brand-ar {

                font-size: 45px;
            }


            .brand-en {

                margin-top: 7px;

                font-size: 15px;

                letter-spacing: 7px;

                padding-left: 7px;
            }


            .tagline {

                margin-top: 9px;

                font-size: 10px;

                gap: 7px;
            }


            .tagline::before,
            .tagline::after {

                width: 27px;
            }


            /* =================================================
               VERY IMPORTANT:
               TWO CARDS STAY SIDE BY SIDE
               ================================================= */

            .login-grid {

                width: 100%;

                grid-template-columns:
                    minmax(0, 1fr)
                    minmax(0, 1fr);

                gap: 8px;

                margin-top: 0;
            }


            .login-card {

                width: 100%;

                height: 340px;

                min-width: 0;

                padding:
                    13px 9px
                    12px;

                border-radius: 17px;
            }


            .person-area {

                top: 2px;

                height: 200px;
            }


            .person-glow {

                width: 170px;
                height: 170px;
            }


            .person-circle {

                width: 120px;
                height: 120px;
            }


            .person-circle i {

                font-size: 67px;
            }


            .doctor-circle i {

                font-size: 61px;
            }


            .role-icon {

                width: 38px;
                height: 38px;

                bottom: 0;

                font-size: 14px;
            }


            .card-title {

                font-size: 20px;

                margin-bottom: 4px;
            }


            .card-text {

                min-height: 48px;

                font-size: 9px;

                line-height: 1.7;

                margin-bottom: 10px;
            }


            .card-button {

                height: 40px;

                gap: 7px;

                font-size: 9px;

                border-radius: 22px;
            }


            .card-button i {

                font-size: 9px;
            }


            /* FEATURES */

            .features {

                margin-top: 23px;

                gap: 0;
            }


            .feature {

                font-size: 8px;

                gap: 5px;

                padding: 0 4px;
            }


            .feature i {

                font-size: 14px;
            }


            /* FOOTER */

            .footer {

                margin-top: 27px;
            }


            .footer-title {

                font-size: 9px;

                letter-spacing: 4px;

                gap: 9px;
            }


            .footer-title::before,
            .footer-title::after {

                width: 38px;
            }


            .footer-text {

                font-size: 8px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 360px) {

            .page {

                padding-left: 6px;

                padding-right: 6px;
            }


            .login-grid {

                gap: 6px;
            }


            .login-card {

                height: 320px;

                padding:
                    10px 7px
                    10px;
            }


            .person-area {

                height: 187px;
            }


            .person-circle {

                width: 108px;
                height: 108px;
            }


            .person-circle i {

                font-size: 60px;
            }


            .doctor-circle i {

                font-size: 54px;
            }


            .role-icon {

                width: 34px;
                height: 34px;

                font-size: 12px;
            }


            .card-title {

                font-size: 18px;
            }


            .card-text {

                font-size: 8px;
            }


            .card-button {

                height: 37px;

                font-size: 8px;
            }


            .brand-ar {

                font-size: 40px;
            }


            .brand-en {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
         ===================================================== -->

    <div class="medical-bg">

        <svg
            class="ecg-background"
            viewBox="0 0 900 180"
            preserveAspectRatio="none"
        >

            <path
                d="
                    M0 95
                    H120
                    L145 95
                    L170 40
                    L198 145
                    L225 95
                    H370
                    L400 95
                    L425 58
                    L450 120
                    L478 95
                    H900
                "
            />

        </svg>

    </div>


    <!-- =====================================================
         PAGE
         ===================================================== -->

    <main class="page">


        <!-- =================================================
             ADMIN
             ================================================= -->

        <div class="admin-area">

            <a
                href="/admin.html"
                class="admin-button"
            >

                <div class="admin-icon">

                    <i class="fa-solid fa-shield-halved"></i>

                </div>


                <div class="admin-content">

                    <div class="admin-title">
                        دخول الإدارة
                    </div>

                    <div class="admin-description">
                        إدارة المنصة والأطباء والمواعيد
                    </div>

                </div>


                <div class="admin-arrow">

                    <i class="fa-solid fa-arrow-left"></i>

                </div>

            </a>

        </div>



        <!-- =================================================
             BRAND
             ================================================= -->

        <section class="brand">


            <div class="logo-area">

                <div class="logo-ring"></div>

                <div class="heart"></div>


                <svg
                    class="heart-ecg"
                    viewBox="0 0 150 60"
                >

                    <path
                        d="
                            M2 31
                            H32
                            L46 31
                            L57 8
                            L70 51
                            L82 31
                            H105
                            L115 31
                            L125 20
                            L134 41
                            L143 31
                            H148
                        "
                    />

                </svg>

            </div>


            <div class="brand-ar">
                طبيبك
            </div>


            <div class="brand-en">
                TABIBK
            </div>


            <div class="tagline">
                رعايتك الصحية .. أولويتنا
            </div>

        </section>



        <!-- =================================================
             PATIENT + DOCTOR
             ================================================= -->

        <section class="login-grid">


            <!-- =============================================
                 PATIENT
                 ============================================= -->

            <a
                href="/patient.html"
                class="login-card"
            >

                <div class="person-area">

                    <div class="person-glow"></div>


                    <div class="person-circle">

                        <i class="fa-solid fa-user"></i>

                    </div>


                    <div class="role-icon">

                        <i class="fa-solid fa-user"></i>
