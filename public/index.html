<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#0b132b">

    <title>TABIBK | طبيبك</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: #f5f7fb;
            color: #101828;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            background:
                linear-gradient(135deg, #0b132b, #172554);

            color: white;
            padding: 18px 16px 28px;

            border-radius: 0 0 30px 30px;

            box-shadow:
                0 8px 25px rgba(11, 19, 43, 0.18);
        }

        .header-content {
            max-width: 600px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;

            background: #d4af37;

            color: #0b132b;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;

            box-shadow:
                0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .brand-text strong {
            display: block;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-text span {
            font-size: 11px;
            color: #e5e7eb;
        }

        .notification-btn {
            width: 44px;
            height: 44px;

            border: 1px solid rgba(255,255,255,.15);

            background: rgba(255,255,255,.08);

            color: white;

            border-radius: 14px;

            font-size: 18px;

            cursor: pointer;
        }

        /* ================= HERO ================= */

        .hero {
            max-width: 600px;
            margin: -5px auto 0;

            padding: 20px 16px 5px;
        }

        .hero h1 {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .hero p {
            color: #667085;
            font-size: 13px;
        }

        /* ================= CONTAINER ================= */

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px 16px 40px;
        }

        /* ================= CARD ================= */

        .card {
            background: white;

            border-radius: 22px;

            padding: 20px;

            margin-bottom: 16px;

            box-shadow:
                0 6px 25px rgba(16, 24, 40, 0.06);

            border: 1px solid #eef0f4;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 18px;
        }

        .card-title-icon {
            width: 38px;
            height: 38px;

            border-radius: 12px;

            background: #fff8df;

            color: #b18a16;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title h2 {
            font-size: 17px;
            font-weight: 800;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color: #344054;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #98a2b3;

            pointer-events: none;
        }

        input,
        select,
        textarea {
            width: 100%;

            border: 1px solid #dfe3ea;

            background: #fafbfc;

            border-radius: 14px;

            padding: 14px 42px 14px 14px;

            font-family: "Cairo", sans-serif;

            font-size: 14px;

            color: #101828;

            outline: none;

            transition: .2s;
        }

        select {
            cursor: pointer;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d4af37;

            background: white;

            box-shadow:
                0 0 0 3px rgba(212,175,55,.12);
        }

        .row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        /* ================= DOCTORS ================= */

        .doctors-list {
            display: grid;
            gap: 12px;
        }

        .doctor-card {
            border: 1px solid #edf0f4;

            border-radius: 17px;

            padding: 15px;

            background: #fcfcfd;

            cursor: pointer;

            transition: .2s;
        }

        .doctor-card:hover {
            border-color: #d4af37;
            transform: translateY(-1px);
        }

        .doctor-card.selected {
            border-color: #d4af37;

            background: #fffdf5;

            box-shadow:
                0 5px 18px rgba(212,175,55,.12);
        }

        .doctor-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .doctor-avatar {
            width: 48px;
            height: 48px;

            border-radius: 15px;

            background:
                linear-gradient(135deg,#0b132b,#263b73);

            color: #d4af37;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .doctor-info {
            flex: 1;
        }

        .doctor-info strong {
            display: block;

            font-size: 14px;

            margin-bottom: 3px;
        }

        .doctor-info span {
            color: #667085;

            font-size: 12px;
        }

        .doctor-location {
            margin-top: 10px;

            display: flex;
            gap: 5px;

            color: #667085;

            font-size: 11px;
        }

        .doctor-location i {
            color: #d4af37;
        }

        .doctor-radio {
            width: 20px;
            height: 20px;

            border-radius: 50%;

            border: 2px solid #d0d5dd;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .doctor-card.selected .doctor-radio {
            border-color: #d4af37;
        }

        .doctor-card.selected .doctor-radio::after {
            content: "";

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #d4af37;
        }

        /* ================= BUTTON ================= */

        .main-btn {
            width: 100%;

            border: none;

            border-radius: 16px;

            padding: 16px;

            background:
                linear-gradient(135deg,#d4af37,#b89220);

            color: #101828;

            font-family: "Cairo", sans-serif;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(212,175,55,.22);

            transition: .2s;
        }

        .main-btn:hover {
            transform: translateY(-2px);
        }

        .main-btn:active {
            transform: scale(.98);
        }

        .main-btn i {
            margin-left: 7px;
        }

        /* ================= STATUS ================= */

        .status-box {
            display: none;

            padding: 20px;

            border-radius: 20px;

            background: #f8fafc;

            border: 1px solid #e4e7ec;

            margin-top: 16px;
        }

        .status-box.show {
            display: block;
        }

        .success-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 12px;

            border-radius: 50%;

            background: #ecfdf3;

            color: #12b76a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .status-box h3 {
            text-align: center;

            font-size: 18px;

            margin-bottom: 5px;
        }

        .status-box p {
            text-align: center;

            color: #667085;

            font-size: 12px;
        }

        .booking-number {
            margin-top: 15px;

            padding: 13px;

            background: #0b132b;

            color: #d4af37;

            border-radius: 14px;

            text-align: center;

            font-size: 20px;

            font-weight: 800;

            letter-spacing: 1px;
        }

        .hidden {
            display: none !important;
        }

        .empty {
            text-align: center;

            padding: 25px 10px;

            color: #98a2b3;

            font-size: 13px;
        }

        .empty i {
            display: block;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .loading {
            text-align: center;

            padding: 20px;

            color: #667085;

            font-size: 13px;
        }

        .loading i {
            margin-left: 6px;
        }

        /* ================= TRACK ================= */

        .track-btn {
            width: 100%;

            margin-top: 10px;

            padding: 12px;

            border: 1px solid #d4af37;

            background: white;

            color: #8a6a0d;

            border-radius: 14px;

            font-family: "Cairo", sans-serif;

            font-weight: 700;

            cursor: pointer;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            padding: 10px 20px 25px;

            color: #98a2b3;

            font-size: 11px;
        }

        footer strong {
            color: #8a6a0d;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 450px) {

            .row {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 22px;
            }

            .card {
                padding: 17px;
            }

        }

    </style>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="header-content">

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-user-doctor"></i>
            </div>

            <div class="brand-text">

                <strong>TABIBK</strong>

                <span>
                    طبيبك... موعدك أسهل
                </span>

            </div>

        </div>

        <button
            class="notification-btn"
            onclick="showNotifications()">

            <i class="fa-regular fa-bell"></i>

        </button>

    </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <h1>
        احجز موعدك الطبي 🩺
    </h1>

    <p>
        اختر الطبيب المناسب واحجز موعدك بكل سهولة
    </p>

</section>


<main class="container">

    <!-- ================= PATIENT ================= -->

    <section class="card">

        <div class="card-title">

            <div class="card-title-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <h2>
                معلومات المريض
            </h2>

        </div>


        <div class="form-group">

            <label>
                الاسم الكامل
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="patientName"
                    placeholder="أدخل اسمك الكامل">

            </div>

        </div>


        <div class="form-group">

            <label>
                رقم الهاتف
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-phone"></i>

                <input
                    type="tel"
                    id="patientPhone"
                    placeholder="مثال: 0550000000">

            </div>

        </div>

    </section>


    <!-- ================= SEARCH ================= -->

    <section class="card">

        <div class="card-title">

            <div class="card-title-icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>

            <h2>
                البحث عن طبيب
            </h2>

        </div>


        <div class="row">

            <div class="form-group">

                <label>
                    الولاية
                </label>

                <select id="wilayaSelect"
                        onchange="loadMunicipalities()">

                    <option value="">
                        اختر الولاية
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    البلدية
                </label>

                <select id="municipalitySelect"
                        onchange="loadDoctors()"
                        disabled>

                    <option value="">
                        اختر البلدية
                    </option>

                </select>

            </div>

        </div>


        <div class="form-group">

            <label>
                التخصص
            </label>

            <select id="specialtySelect"
                    onchange="loadDoctors()">

                <option value="">
                    جميع التخصصات
                </option>

                <option value="طب عام">
                    طب عام
                </option>

                <option value="طب الأطفال">
                    طب الأطفال
                </option>

                <option value="أمراض القلب">
                    أمراض القلب
                </option>

                <option value="طب النساء">
                    طب النساء
                </option>

                <option value="طب الأسنان">
                    طب الأسنان
                </option>

            </select>

        </div>

    </section>


    <!-- ================= DOCTORS ================= -->

    <section class="card">

        <div class="card-title">

            <div class="card-title-icon">
                <i class="fa-solid fa-user-doctor"></i>
            </div>

            <h2>
                الأطباء
            </h2>

        </div>


        <div id="doctorsList">

            <div class="empty">

                <i class="fa-solid fa-stethoscope"></i>

                اختر الولاية والبلدية لعرض الأطباء

            </div>

        </div>

    </section>


    <!-- ================= APPOINTMENT ================= -->

    <section class="card">

        <div class="card-title">

            <div class="card-title-icon">
                <i class="fa-solid fa-calendar-check"></i>
            </div>

            <h2>
                تفاصيل الموعد
            </h2>

        </div>


        <div class="form-group">

            <label>
                سبب الزيارة
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-comment-medical"></i>

                <textarea
                    id="reason"
                    placeholder="اكتب سبب الزيارة باختصار..."></textarea>

            </div>

        </div>


        <button
            class="main-btn"
            onclick="createAppointment()">

            <i class="fa-solid fa-calendar-plus"></i>

            إرسال طلب الحجز

        </button>


        <div
            id="statusBox"
            class="status-box">

            <div class="success-icon">

                <i class="fa-solid fa-check"></i>

            </div>

            <h3>
                تم إرسال طلب الحجز
            </h3>

            <p>
                احتفظ برقم الحجز لمتابعة حالة موعدك
            </p>

            <div
                id="bookingNumber"
                class="booking-number">
            </div>

        </div>

    </section>


    <!-- ================= TRACK ================= -->

    <section class="card">

        <div class="card-title">

            <div class="card-title-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <h2>
                متابعة الحجز
            </h2>

        </div>


        <div class="form-group">

            <label>
                رقم الحجز
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-ticket"></i>

                <input
                    type="text"
                    id="trackingNumber"
                    placeholder="مثال: TBK-2026-0001">

            </div>

        </div>


        <button
            class="track-btn"
            onclick="trackAppointment()">

            <i class="fa-solid fa-magnifying-glass"></i>

            متابعة حالة الحجز

        </button>


        <div
            id="trackingResult"
            class="status-box">

        </div>

    </section>

</main>


<footer>

    <strong>TABIBK</strong>

    <br>

    طبيبك... موعدك أسهل 🩺

</footer>


<script>

    /* =========================================
       API
    ========================================= */

    const API = "";


    let selectedDoctorId = null;


    /* =========================================
       LOAD WILAYAS
    ========================================= */

    async function loadWilayas() {

        const select =
            document.getElementById(
                "wilayaSelect"
            );

        try {

            const response =
                await fetch(
                    API + "/api/wilayas"
                );

            const data =
                await response.json();

            if (!data.success) {

                throw new Error(
                    "فشل تحميل الولايات"
                );

            }

            select.innerHTML =
                `<option value="">
                    اختر الولاية
                </option>`;

            data.wilayas.forEach(
                wilaya => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        wilaya.name;

                    option.dataset.id =
                        wilaya.id;

                    option.textContent =
                        wilaya.name;

                    select.appendChild(
                        option
                    );

                }
            );

        } catch (error) {

            console.error(error);

            alert(
                "حدث خطأ أثناء تحميل الولايات"
            );

        }

    }


    /* =========================================
       LOAD MUNICIPALITIES
    ========================================= */

    async function loadMunicipalities() {

        const wilayaSelect =
            document.getElementById(
                "wilayaSelect"
            );

        const municipalitySelect =
            document.getElementById(
                "municipalitySelect"
            );

        const selectedOption =
            wilayaSelect.options[
                wilayaSelect.selectedIndex
            ];

        if (!selectedOption.value) {

            municipalitySelect.disabled =
                true;

            municipalitySelect.innerHTML =
                `<option value="">
                    اختر البلدية
                </option>`;

            document.getElementById(
                "doctorsList"
            ).innerHTML =
                `<div class="empty">
                    <i class="fa-solid fa-stethoscope"></i>
                    اختر الولاية والبلدية لعرض الأطباء
                </div>`;

            return;

        }


        const wilayaId =
            selectedOption.dataset.id;


        municipalitySelect.disabled =
            false;


        municipalitySelect.innerHTML =
            `<option value="">
                جاري تحميل البلديات...
            </option>`;


        try {

            const response =
                await fetch(
                    API +
                    `/api/wilayas/${wilayaId}/municipalities`
                );

            const data =
                await response.json();


            municipalitySelect.innerHTML =
                `<option value="">
                    اختر البلدية
                </option>`;


            data.municipalities.forEach(
                municipality => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        municipality;

                    option.textContent =
                        municipality;

                    municipalitySelect.appendChild(
                        option
                    );

                }
            );


            loadDoctors();


        } catch (error) {

            console.error(error);

            municipalitySelect.innerHTML =
                `<option value="">
                    خطأ في تحميل البلديات
                </option>`;

        }

    }


    /* =========================================
       LOAD DOCTORS
    ========================================= */

    async function loadDoctors() {

        const wilaya =
            document.getElementById(
                "wilayaSelect"
            ).value;

        const municipality =
            document.getElementById(
                "municipalitySelect"
            ).value;

        const specialty =
            document.getElementById(
                "specialtySelect"
            ).value;


        const doctorsList =
            document.getElementById(
                "doctorsList"
            );


        if (!wilaya) {

            doctorsList.innerHTML =
                `<div class="empty">
                    <i class="fa-solid fa-user-doctor"></i>
                    اختر الولاية أولاً
                </div>`;

            return;

        }


        doctorsList.innerHTML =
            `<div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                جاري تحميل الأطباء...
            </div>`;


        try {

            let url =
                API + "/api/doctors?";


            const params =
                new URLSearchParams();


            if (wilaya) {

                params.append(
                    "wilaya",
                    wilaya
                );

            }


            if (municipality) {

                params.append(
                    "municipality",
                    municipality
                );

            }


            if (specialty) {

                params.append(
                    "specialty",
                    specialty
                );

            }


            url +=
                params.toString();


            const response =
                await fetch(url);


            const data =
                await response.json();


            if (
                !data.success ||
                data.doctors.length === 0
            ) {

                doctorsList.innerHTML =
                    `<div class="empty">
                        <i class="fa-solid fa-user-doctor"></i>
                        لا يوجد أطباء مطابقون للبحث
                    </div>`;

                return;

            }


            doctorsList.innerHTML = "";


            data.doctors.forEach(
                doctor => {

                    const card =
                        document.createElement(
                            "div"
                        );

                    card.className =
                        "doctor-card";


                    card.onclick =
                        () => selectDoctor(
                            doctor.id,
                            card
                        );


                    card.innerHTML = `

                        <div class="doctor-top">

                            <div class="doctor-avatar">
                                <i class="fa-solid fa-user-doctor"></i>
                            </div>

                            <div class="doctor-info">

                                <strong>
                                    ${doctor.name}
                                </strong>

                                <span>
                                    ${doctor.specialty}
                                </span>

                            </div>

                            <div class="doctor-radio"></div>

                        </div>

                        <div class="doctor-location">

                            <i class="fa-solid fa-location-dot"></i>

                            ${doctor.municipality}

                            <span>
                                •
                            </span>

                            مدة المعاينة:
                            ${doctor.consultationDuration}
                            دقيقة

                        </div>

                    `;


                    doctorsList.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(error);

            doctorsList.innerHTML =
                `<div class="empty">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    تعذر الاتصال بالسيرفر
                </div>`;

        }

    }


    /* =========================================
       SELECT DOCTOR
    ========================================= */

    function selectDoctor(
        doctorId,
        card
    ) {

        selectedDoctorId =
            doctorId;


        document
            .querySelectorAll(
                ".doctor-card"
            )
            .forEach(
                item =>
                    item.classList.remove(
                        "selected"
                    )
            );


        card.classList.add(
            "selected"
        );

    }


    /* =========================================
       CREATE APPOINTMENT
    ========================================= */

    async function createAppointment() {

        const patientName =
            document.getElementById(
                "patientName"
            ).value.trim();


        const patientPhone =
            document.getElementById(
                "patientPhone"
            ).value.trim();


        const reason =
            document.getElementById(
                "reason"
            ).value.trim();


        if (!patientName) {

            alert(
                "يرجى إدخال اسم المريض"
            );

            return;

        }


        if (!patientPhone) {

            alert(
                "يرجى إدخال رقم الهاتف"
            );

            return;

        }


        if (!selectedDoctorId) {

            alert(
                "يرجى اختيار الطبيب"
            );

            return;

        }


        try {

            const response =
                await fetch(
                    API +
                    "/api/appointments",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                patientName,

                                patientPhone,

                                doctorId:
                                    selectedDoctorId,

                                reason

                            })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                alert(
                    data.message ||
                    "فشل إرسال طلب الحجز"
                );

                return;

            }


            document.getElementById(
                "bookingNumber"
            ).textContent =
                data.appointment.bookingNumber;


            document.getElementById(
                "statusBox"
            ).classList.add(
                "show"
            );


            document.getElementById(
                "trackingNumber"
            ).value =
                data.appointment.bookingNumber;


            document
                .getElementById(
                    "statusBox"
                )
                .scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });


            alert(
                "تم إرسال طلب الحجز بنجاح 🎉"
            );


        } catch (error) {

            console.error(error);

            alert(
                "حدث خطأ في الاتصال بالسيرفر"
            );

        }

    }


    /* =========================================
       TRACK APPOINTMENT
    ========================================= */

    async function trackAppointment() {

        const bookingNumber =
            document.getElementById(
                "trackingNumber"
            ).value.trim();


        if (!bookingNumber) {

            alert(
                "أدخل رقم الحجز أولاً"
            );

            return;

        }


        const result =
            document.getElementById(
                "trackingResult"
            );


        result.classList.add(
            "show"
        );


        result.innerHTML =
            `<div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                جاري البحث...
            </div>`;


        try {

            const response =
                await fetch(
                    API +
                    `/api/appointments/${encodeURIComponent(
                        bookingNumber
                    )}`
                );


            const data =
                await response.json();


            if (!data.success) {

                result.innerHTML =
                    `<div class="empty">
                        <i class="fa-solid fa-circle-xmark"></i>
                        ${data.message}
                    </div>`;

                return;

            }


            let statusText =
                "قيد الانتظار ⏳";


            let statusIcon =
                "fa-clock";


            if (
                data.status ===
                "confirmed"
            ) {

                statusText =
                    "تم تأكيد الحجز ✅";

                statusIcon =
                    "fa-circle-check";

            }


            if (
                data.status ===
                "rejected"
            ) {

                statusText =
                    "تم رفض الحجز ❌";

                statusIcon =
                    "fa-circle-xmark";

            }


            if (
                data.status ===
                "in_progress"
            ) {

                statusText =
                    "قيد المعاينة 🩺";

                statusIcon =
                    "fa-user-doctor";

            }


            if (
                data.status ===
                "completed"
            ) {

                statusText =
                    "تم إنهاء الموعد ✔️";

                statusIcon =
                    "fa-check-double";

            }


            result.innerHTML = `

                <div class="success-icon">

                    <i class="fa-solid ${statusIcon}"></i>

                </div>

                <h3>
                    ${statusText}
                </h3>

                <p>
                    ${data.doctorName}
                </p>

                <div class="booking-number">
                    ${data.bookingNumber}
                </div>

                <div style="
                    margin-top:15px;
                    text-align:center;
                    font-size:13px;
                    line-height:2;
                ">

                    <div>
                        🎫 رقمك في الطابور:
                        <strong>
                            ${data.queueNumber}
                        </strong>
                    </div>

                    <div>
                        🩺 الرقم الحالي:
                        <strong>
                            ${data.currentTurn}
                        </strong>
                    </div>

                    <div>
                        👥 المرضى قبلك:
                        <strong>
                            ${data.patientsBefore}
                        </strong>
                    </div>

                </div>

            `;


        } catch (error) {

            console.error(error);

            result.innerHTML =
                `<div class="empty">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    تعذر الاتصال بالسيرفر
                </div>`;

        }

    }

</script>
