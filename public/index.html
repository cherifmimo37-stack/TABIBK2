<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>طبيبك | TABIBK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --purple-dark:#321447;
    --purple:#5a2478;
    --purple-main:#71378f;
    --purple-light:#9a5ab5;
    --gold:#c99c3e;
    --gold-light:#e8cf7d;
    --white:#ffffff;
    --text:#2e1439;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Cairo",sans-serif;
    color:var(--text);
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 12% 12%,
            rgba(222,192,238,.20),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 18%,
            rgba(225,190,241,.16),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(34,9,48,.42),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #301244 0%,
            #4b1e65 32%,
            #693482 66%,
            #432052 100%
        );
}

/* =========================================================
   MEDICAL BACKGROUND
   ========================================================= */

.medical-background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.medical-background::before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    top:-300px;
    right:-220px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(239,218,249,.20),
            transparent 68%
        );
}

.medical-background::after{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    bottom:-350px;
    left:-260px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(188,126,218,.20),
            transparent 68%
        );
}

.medical-grid{
    position:absolute;
    inset:0;
    opacity:.13;

    background-image:
        linear-gradient(
            rgba(255,255,255,.16) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.16) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 15%,
            black 85%,
            transparent
        );
}

.medical-circle{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
}

.circle-one{
    width:270px;
    height:270px;
    right:-110px;
    top:35%;
}

.circle-two{
    width:190px;
    height:190px;
    left:-75px;
    top:28%;
}

.cross{
    position:absolute;
    color:#ffffff;
    opacity:.08;
    font-size:75px;
    font-weight:300;
}

.cross-a{
    top:22%;
    left:4%;
}

.cross-b{
    bottom:22%;
    right:5%;
}

.ecg{
    position:absolute;
    width:100%;
    height:190px;
    left:0;
    top:48%;
    opacity:.16;
}

.ecg path{
    fill:none;
    stroke:#f1ddfb;
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================================================
   PAGE
   ========================================================= */

.page{
    position:relative;
    z-index:5;
    width:100%;
    max-width:980px;
    margin:auto;
    padding:18px 18px 35px;
}

/* =========================================================
   ADMIN
   ========================================================= */

.admin-wrapper{
    width:100%;
    display:flex;
    justify-content:flex-start;
    margin-top:18px;
    margin-bottom:4px;
}

.admin{
    display:flex;
    align-items:center;
    gap:7px;

    padding:8px 13px;

    border-radius:30px;

    color:#ffffff;
    text-decoration:none;

    font-size:10px;
    font-weight:800;

    background:rgba(54,19,70,.55);

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 8px 24px
        rgba(20,5,28,.22);

    backdrop-filter:blur(14px);

    transition:.25s ease;
}

.admin:hover{
    transform:translateY(-2px);

    border-color:
        rgba(232,207,125,.60);
}

.admin-icon{
    width:23px;
    height:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#432052;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            var(--gold)
        );

    font-size:11px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    text-align:center;
    margin-top:2px;
    margin-bottom:25px;
}

.logo{
    position:relative;

    width:110px;
    height:110px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-ring{
    position:absolute;
    inset:4px;

    border-radius:50%;

    border:1px solid rgba(232,207,125,.75);

    box-shadow:
        0 0 35px
        rgba(232,207,125,.14);
}

.logo-ring-two{
    position:absolute;
    inset:12px;

    border-radius:50%;

    border:1px dashed rgba(255,255,255,.30);
}

.heart{
    position:relative;

    width:52px;
    height:46px;

    transform:rotate(-45deg);

    background:
        linear-gradient(
            145deg,
            #e0bd60,
            #a97820
        );

    border-radius:
        7px 7px
        8px 7px;

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.18);

    z-index:2;
}

.heart::before,
.heart::after{
    content:"";

    position:absolute;

    width:52px;
    height:52px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #e0bd60,
            #a97820
        );
}

.heart::before{
    top:-25px;
    left:0;
}

.heart::after{
    left:25px;
    top:0;
}

.logo-ecg{
    position:absolute;

    width:82px;
    height:35px;

    z-index:10;
}

.logo-ecg path{
    fill:none;

    stroke:#ffffff;
    stroke-width:4;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.brand{
    margin-top:2px;

    font-size:clamp(42px,7vw,62px);

    line-height:1;

    font-weight:900;

    color:#ffffff;

    letter-spacing:-2px;

    text-shadow:
        0 5px 18px
        rgba(0,0,0,.20);
}

.tabibk{
    margin-top:8px;

    color:#e5c7f0;

    font-size:13px;

    font-weight:800;

    letter-spacing:7px;

    padding-left:7px;
}

.subtitle{
    margin-top:7px;

    color:#eadcf0;

    font-size:11px;

    font-weight:600;
}

/* =========================================================
   LOGIN AREA
   ========================================================= */

.login-area{
    max-width:800px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;
}

/* =========================================================
   CARDS
   ========================================================= */

.card{
    position:relative;

    min-height:385px;

    overflow:hidden;

    border-radius:28px;

    padding:16px;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    text-decoration:none;

    color:var(--text);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.99),
            rgba(247,241,250,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.70);

    box-shadow:
        0 30px 70px
        rgba(18,4,26,.28),

        inset
        0 1px 0
        rgba(255,255,255,1);

    backdrop-filter:blur(16px);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.card:hover{
    transform:translateY(-6px);

    box-shadow:
        0 35px 80px
        rgba(18,4,26,.36);
}

.card::before{
    content:"";

    position:absolute;

    top:0;
    left:16%;
    right:16%;

    height:3px;

    border-radius:
        0 0 10px 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold-light),
            transparent
        );
}

/* =========================================================
   REAL PHOTO AVATAR
   ========================================================= */

.avatar-area{
    position:absolute;

    top:0;
    left:0;
    right:0;

    height:270px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.avatar-glow{
    position:absolute;

    width:235px;
    height:235px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(117,58,147,.22) 0%,
            rgba(170,116,196,.12) 42%,
            transparent 70%
        );
}

.real-avatar{
    position:relative;

    z-index:3;

    width:220px;
    height:250px;

    object-fit:contain;

    object-position:center bottom;

    display:block;

    filter:
        drop-shadow(
            0 18px 20px
            rgba(49,20,63,.20)
        );

    transition:
        transform .35s ease,
        filter .35s ease;
}

.card:hover .real-avatar{
    transform:translateY(-5px) scale(1.025);

    filter:
        drop-shadow(
            0 22px 28px
            rgba(49,20,63,.27)
        );
}

/* =========================================================
   CARD CONTENT
   ========================================================= */

.card-content{
    position:relative;

    z-index:10;

    text-align:center;
}

.card-title{
    color:#32143e;

    font-size:26px;

    font-weight:900;
}

.card-text{
    margin:
        3px 0
        12px;

    min-height:42px;

    color:#78677e;

    font-size:10px;

    line-height:1.8;
}

/* =========================================================
   LOGIN BUTTON
   ========================================================= */

.button{
    width:100%;

    height:58px;

    border-radius:31px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    color:#ffffff;

    font-size:13px;

    font-weight:900;

    background:
        linear-gradient(
            100deg,
            #4e1e68 0%,
            #71378f 48%,
            #985ab6 100%
        );

    box-shadow:
        0 13px 30px
        rgba(78,30,105,.30),

        inset
        0 1px 0
        rgba(255,255,255,.20);
}

.button span{
    font-size:17px;
}

.card:hover .button{
    box-shadow:
        0 16px 35px
        rgba(78,30,105,.38);
}

/* =========================================================
   FEATURES
   ========================================================= */

.features{
    max-width:700px;

    margin:
        24px auto
        0;

    display:flex;
}

.feature{
    flex:1;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:6px;

    color:#f0e4f4;

    font-size:9px;
}

.feature + .feature{
    border-right:
        1px solid
        rgba(255,255,255,.20);
}

.feature b{
    color:var(--gold-light);

    font-size:14px;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer{
    text-align:center;

    margin-top:22px;
}

.footer strong{
    color:#ead3f2;

    font-size:9px;

    letter-spacing:5px;
}

.footer p{
    margin-top:3px;

    color:#d1bfd8;

    font-size:8px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    .page{
        padding:
            14px 7px
            25px;
    }

    .admin-wrapper{
        margin-top:13px;
        margin-bottom:2px;
    }

    .admin{
        padding:
            7px 11px;

        font-size:8px;
    }

    .admin-icon{
        width:21px;
        height:21px;
    }

    .header{
        margin-bottom:16px;
    }

    .logo{
        width:91px;
        height:91px;
    }

    .heart,
    .heart::before,
    .heart::after{
        width:43px;
        height:43px;
    }

    .heart::before{
        top:-21px;
    }

    .heart::after{
        left:21px;
    }

    .logo-ecg{
        width:67px;
    }

    .brand{
        font-size:38px;
    }

    .tabibk{
        font-size:10px;
        letter-spacing:6px;
    }

    .subtitle{
        font-size:8px;
    }

    .login-area{
        gap:7px;
    }

    .card{
        min-height:335px;

        padding:
            8px 6px;

        border-radius:19px;
    }

    .avatar-area{
        height:215px;
    }

    .avatar-glow{
        width:180px;
        height:180px;
    }

    .real-avatar{
        width:155px;
        height:190px;
    }

    .card-title{
        font-size:18px;
    }

    .card-text{
        font-size:7px;

        min-height:39px;

        margin-bottom:7px;
    }

    .button{
        height:48px;

        font-size:9px;

        border-radius:27px;
    }

    .button span{
        font-size:14px;
    }

    .features{
        margin-top:16px;
    }

    .feature{
        font-size:6.5px;

        gap:3px;
    }

    .feature b{
        font-size:10px;
    }

    .footer{
        margin-top:17px;
    }
}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-width:360px){

    .page{
        padding-left:4px;
        padding-right:4px;
    }

    .login-area{
        gap:5px;
    }

    .card{
        min-height:320px;
    }

    .avatar-area{
        height:200px;
    }

    .real-avatar{
        width:135px;
        height:170px;
    }

    .card-title{
        font-size:15px;
    }

    .card-text{
        font-size:6.5px;
    }

    .button{
        height:45px;

        font-size:8px;
    }
}

</style>

</head>
