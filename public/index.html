<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>طبيبك | TABIBK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:"Cairo",sans-serif;

    min-height:100vh;

    color:#fff;

    overflow-x:hidden;

    position:relative;

    background:

        radial-gradient(
            circle at 10% 15%,
            rgba(126,83,203,.30),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(214,180,69,.15),
            transparent 24%
        ),

        radial-gradient(
            circle at 50% 85%,
            rgba(190,196,208,.14),
            transparent 34%
        ),

        linear-gradient(
            135deg,
            #05040a 0%,
            #11091f 35%,
            #201233 62%,
            #08070d 100%
        );

}


/* =========================================================
   خلفية طبية فخمة
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.16;

    background:

        radial-gradient(
            circle at 25% 30%,
            rgba(255,255,255,.13) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 75% 70%,
            rgba(216,190,93,.10) 0 1px,
            transparent 2px
        );

    background-size:
        80px 80px,
        120px 120px;

}


/* خطوط طبية / ECG */

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.085;

    background:

        linear-gradient(
            90deg,
            transparent 49.7%,
            rgba(214,183,76,.32) 50%,
            transparent 50.3%
        ),

        linear-gradient(
            transparent 49.7%,
            rgba(190,195,205,.25) 50%,
            transparent 50.3%
        );

    background-size:
        105px 105px,
        105px 105px;

}


/* =========================================================
   الصفحة
========================================================= */

.page{

    position:relative;

    z-index:2;

    width:100%;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:
        13px
        14px
        30px;

}


/* =========================================================
   زر الإدارة
========================================================= */

.admin-top{

    width:100%;

    max-width:560px;

    display:flex;

    justify-content:flex-start;

    margin-bottom:1px;

}

.admin-btn{

    position:relative;

    overflow:hidden;

    border:
        1px solid
        rgba(225,196,96,.52);

    color:#e8ca69;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    border-radius:15px;

    padding:
        8px
        16px;

    font-family:inherit;

    font-size:12px;

    font-weight:800;

    cursor:pointer;

    box-shadow:

        0 10px 28px
        rgba(0,0,0,.30),

        inset 0 1px 0
        rgba(255,255,255,.18);

    transition:.25s;

}

.admin-btn:active{

    transform:scale(.96);

}


/* =========================================================
   الشعار الكبير
========================================================= */

.logo-area{

    text-align:center;

    margin:
        0
        0
        10px;

}


.logo{

    width:96px;

    height:96px;

    margin:auto;

    border-radius:31px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.19),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(231,202,105,.62);

    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);

    box-shadow:

        0 25px 65px
        rgba(0,0,0,.48),

        inset 0 1px 0
        rgba(255,255,255,.24),

        inset 0 -8px 20px
        rgba(0,0,0,.18),

        0 0 40px
        rgba(218,183,66,.16);

    animation:
        logoFloat 4s ease-in-out infinite;

}


@keyframes logoFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }

}


/* الحلقة الذهبية */

.logo::before{

    content:"";

    position:absolute;

    inset:10px;

    border-radius:25px;

    border:
        1px solid
        rgba(239,209,108,.55);

    box-shadow:

        inset 0 0 18px
        rgba(221,188,77,.10),

        0 0 18px
        rgba(221,188,77,.08);

}


/* القلب */

.logo-heart{

    position:relative;

    z-index:3;

    font-size:59px;

    line-height:1;

    color:#e5bf47;

    text-shadow:

        0 3px 0 #9c7920,

        0 0 8px
        rgba(255,221,94,.85),

        0 0 22px
        rgba(226,190,67,.48);

    animation:
        heartBeat 1.2s infinite;

}


@keyframes heartBeat{

    0%,
    100%{
        transform:scale(1);
    }

    10%{
        transform:scale(1.16);
    }

    20%{
        transform:scale(1);
    }

    35%{
        transform:scale(1.09);
    }

    48%{
        transform:scale(1);
    }

}


.logo-title{

    margin-top:8px;

    font-size:29px;

    font-weight:900;

    background:

        linear-gradient(
            90deg,
            #ffffff 5%,
            #ddd8e8 42%,
            #e6c766 90%
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    text-shadow:
        0 5px 25px rgba(0,0,0,.25);

}


.logo-subtitle{

    color:#aaa7b5;

    font-size:10px;

    margin-top:0;

}


/* =========================================================
   عنوان الواجهة
========================================================= */

.hero{

    text-align:center;

    width:100%;

    max-width:540px;

    margin:
        0
        auto
        15px;

}


.hero h1{

    font-size:22px;

    font-weight:900;

    background:

        linear-gradient(
            90deg,
            #fff,
            #d8d5df,
            #e2c35e
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}


.hero p{

    font-size:10px;

    color:#aaa5b4;

    margin-top:3px;

}


/* =========================================================
   البطاقات
========================================================= */

.cards{

    width:100%;

    max-width:560px;

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:13px;

}


/* =========================================================
   البطاقة الزجاجية
========================================================= */

.login-card{

    position:relative;

    min-height:310px;

    padding:
        15px
        10px
        14px;

    overflow:hidden;

    border-radius:28px;

    cursor:pointer;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.055) 55%,
            rgba(255,255,255,.025)
        );

    backdrop-filter:
        blur(30px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(140%);

    box-shadow:

        0 28px 75px
        rgba(0,0,0,.48),

        inset 0 1px 0
        rgba(255,255,255,.22),

        inset 0 -1px 0
        rgba(0,0,0,.45);

    transition:
        transform .3s,
        box-shadow .3s;

}


/* الحافة الذهبية + الفضية */

.login-card::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:28px;

    padding:1px;

    background:

        linear-gradient(
            135deg,
            rgba(246,246,246,.75),
            rgba(255,255,255,.10) 25%,
            rgba(221,187,70,.80) 52%,
            rgba(255,255,255,.12) 76%,
            rgba(207,174,58,.70)
        );

    -webkit-mask:
        linear-gradient(#000 0 0)
        content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    pointer-events:none;

}


/* لمعان */

.login-card::after{

    content:"";

    position:absolute;

    width:210px;

    height:210px;

    top:-125px;

    right:-85px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.16),
            transparent 68%
        );

    pointer-events:none;

}


.login-card:hover{

    transform:
        translateY(-6px)
        scale(1.01);

    box-shadow:

        0 34px 85px
        rgba(0,0,0,.58),

        0 0 38px
        rgba(207,174,61,.08),

        inset 0 1px 0
        rgba(255,255,255,.27);

}


.login-card:active{

    transform:scale(.985);

}


/* =========================================================
   الصور — واضحة وكاملة
========================================================= */

.avatar-wrap{

    width:142px;

    height:142px;

    margin:
        1px
        auto
        11px;

    position:relative;

    border-radius:50%;

    padding:5px;

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #bfc1c9 25%,
            #e0bd4e 56%,
            #8566bd 82%,
            #ffffff
        );

    box-shadow:

        0 18px 42px
        rgba(0,0,0,.52),

        inset 0 2px 4px
        rgba(255,255,255,.75),

        inset 0 -5px 10px
        rgba(0,0,0,.32),

        0 0 28px
        rgba(220,186,68,.12);

}


/* الإطار الداخلي */

.avatar-wrap::before{

    content:"";

    position:absolute;

    inset:4px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.62);

    z-index:4;

    pointer-events:none;

}


/* صورة كاملة */

.avatar-wrap img{

    width:100%;

    height:100%;

    display:block;

    border-radius:50%;

    object-fit:cover;

    object-position:center top;

    background:
        linear-gradient(
            145deg,
            #272031,
            #111018
        );

    box-shadow:
        inset 0 0 18px
        rgba(0,0,0,.38);

}


/* حالة الاتصال */

.status-dot{

    position:absolute;

    right:7px;

    bottom:8px;

    width:17px;

    height:17px;

    border-radius:50%;

    background:#43e79d;

    border:
        3px solid
        #160f22;

    z-index:6;

    box-shadow:

        0 0 10px
        rgba(67,231,157,.95),

        0 0 23px
        rgba(67,231,157,.40);

}


/* =========================================================
   النص داخل البطاقة
========================================================= */

.card-description{

    text-align:center;

    min-height:43px;

    margin:
        2px
        0
        12px;

    font-size:10px;

    line-height:1.8;

    background:

        linear-gradient(
            90deg,
            #b9b6c0,
            #f0eef3,
            #d9bd60
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}


/* =========================================================
   الأزرار
========================================================= */

.enter-btn{

    width:100%;

    height:48px;

    border:0;

    border-radius:15px;

    position:relative;

    overflow:hidden;

    font-family:inherit;

    font-size:12px;

    font-weight:900;

    color:#fff;

    cursor:pointer;

    transition:
        transform .2s,
        box-shadow .2s;

}


/* انعكاس الزر */

.enter-btn::before{

    content:"";

    position:absolute;

    top:0;

    left:-100%;

    width:55%;

    height:100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.28),
            transparent
        );

    transform:skewX(-20deg);

    transition:.55s;

}


.login-card:hover
.enter-btn::before{

    left:140%;

}


.doctor .enter-btn{

    background:

        linear-gradient(
            135deg,
            #6843bb,
            #8e62dd,
            #b18ae9
        );

    border:
        1px solid
        rgba(222,202,255,.35);

    box-shadow:

        0 12px 30px
        rgba(112,69,193,.38),

        inset 0 1px 0
        rgba(255,255,255,.32),

        inset 0 -4px 8px
        rgba(55,30,104,.22);

}


.patient .enter-btn{

    background:

        linear-gradient(
            135deg,
            #86651c,
            #bd9630,
            #e0c45d
        );

    border:
        1px solid
        rgba(255,239,166,.40);

    box-shadow:

        0 12px 30px
        rgba(166,125,27,.34),

        inset 0 1px 0
        rgba(255,255,255,.34),

        inset 0 -4px 8px
        rgba(91,64,11,.20);

}


.enter-btn:active{

    transform:
        scale(.96);

}


/* =========================================================
   الفوتر
========================================================= */

.footer{

    width:100%;

    max-width:540px;

    text-align:center;

    margin-top:15px;

    color:#74707d;

    font-size:9px;

    line-height:1.8;

}


.footer strong{

    color:#b7a7cb;

}


/* =========================================================
   هاتف صغير
========================================================= */

@media(max-width:360px){

    .page{

        padding:
            9px
            8px
            22px;

    }


    .logo{

        width:78px;

        height:78px;

    }


    .logo-heart{

        font-size:47px;

    }


    .logo-title{

        font-size:25px;

    }


    .hero{

        margin-bottom:11px;

    }


    .hero h1{

        font-size:18px;

    }


    .cards{

        gap:8px;

    }


    .login-card{

        min-height:270px;

        padding:
            12px
            7px
            11px;

        border-radius:23px;

    }


    .avatar-wrap{

        width:105px;

        height:105px;

    }


    .card-description{

        font-size:8px;

        min-height:38px;

    }


    .enter-btn{

        height:43px;

        font-size:10px;

    }

}


/* =========================================================
   شاشة كبيرة
========================================================= */

@media(min-width:700px){

    .page{

        padding-top:24px;

    }


    .avatar-wrap{

        width:155px;

        height:155px;

    }


    .login-card{

        min-height:335px;

    }

}

</style>

</head>

<body>

<div class="page">


<!-- الإدارة -->

<div class="admin-top">

    <button
        class="admin-btn"
        type="button"
        onclick="adminLogin()"
    >
        ⚙️ الإدارة
    </button>

</div>


<!-- الشعار -->

<div class="logo-area">

    <div class="logo">

        <span class="logo-heart">
            ♥
        </span>

    </div>


    <div class="logo-title">
        طبيبك
    </div>


    <div class="logo-subtitle">
        TABIBK • منصتك الطبية الذكية
    </div>

</div>


<!-- العنوان -->

<div class="hero">

    <h1>
        رعاية صحية أقرب إليك
    </h1>

    <p>
        احجز، تابع، وتواصل مع طبيبك بسهولة
    </p>

</div>


<!-- بطاقات الدخول -->

<div class="cards">


    <!-- ==========================
         بطاقة الطبيب
    =========================== -->

    <div
        class="login-card doctor"
        onclick="doctorLogin()"
    >

        <div class="avatar-wrap">

            <img
                src="/images/doctor-ai.png"
                alt="Doctor"
                onerror="
                    this.style.display='none';
                    this.parentElement.insertAdjacentHTML(
                        'beforeend',
                        '<span style=&quot;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;&quot;>👨‍⚕️</span>'
                    );
                "
            >

            <span class="status-dot"></span>

        </div>


        <div class="card-description">

            إدارة المواعيد والمرضى
            <br>
            ومتابعة الاستشارات الطبية

        </div>


        <button
            class="enter-btn"
            type="button"
        >
            دخول إلى المنصة
        </button>

    </div>


    <!-- ==========================
         بطاقة المريض
    =========================== -->

    <div
        class="login-card patient"
        onclick="patientLogin()"
    >

        <div class="avatar-wrap">

            <img
                src="/images/patient-ai.png"
                alt="Patient"
                onerror="
                    this.style.display='none';
                    this.parentElement.insertAdjacentHTML(
                        'beforeend',
                        '<span style=&quot;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;&quot;>🧑‍💼</span>'
                    );
                "
            >

            <span class="status-dot"></span>

        </div>


        <div class="card-description">

            احجز موعدك بسهولة
            <br>
            وتابع حجزك واستشارتك

        </div>


        <button
            class="enter-btn"
            type="button"
        >
            متابعة وحجز موعد
        </button>

    </div>


</div>


<!-- الفوتر -->

<div class="footer">

    <strong>TABIBK</strong>
    — طبيبك الرقمي

    <br>

    جميع الحقوق محفوظة © 2026

</div>


</div>


<script>

/* =====================================================
   الطبيب — كما هو
===================================================== */

function doctorLogin(){

    window.location.href =
        "/doctor.html";

}


/* =====================================================
   المريض — كما هو
===================================================== */

function patientLogin(){

    window.location.href =
        "/patient.html";

}


/* =====================================================
   الإدارة — التعديل الوحيد
===================================================== */

function adminLogin(){

    /*
       صفحة admin.html فيها تسجيل دخول الإدارة
       الخاص بها، لذلك لا نفتح نافذة ثانية هنا.
    */

    window.location.href =
        "/admin.html";

}

</script>

</body>

</html>
