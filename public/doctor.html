<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#32104f"
>

<meta
    name="description"
    content="TABIBK - لوحة الطبيب لإدارة المواعيد الطبية"
>

<title>TABIBK | لوحة الطبيب</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>


<style>

/* =========================================================
   TABIBK DOCTOR DASHBOARD
   PREMIUM MEDICAL UI
========================================================= */

:root{

    --purple-950:#241033;
    --purple-900:#32104f;
    --purple-850:#3b145b;
    --purple-800:#431766;
    --purple-700:#5b2180;
    --purple:#7027a0;
    --purple-light:#8d4fc0;
    --purple-soft:#f3e9fa;
    --purple-pale:#faf6fd;

    --gold-dark:#9c6b16;
    --gold:#c99732;
    --gold-light:#e8c76b;
    --gold-pale:#fff8e6;

    --white:#ffffff;
    --text:#30243a;
    --text-dark:#24152f;
    --muted:#7c7084;

    --green:#149b68;
    --green-light:#e4f8ef;

    --red:#d83d55;
    --red-light:#ffe8ed;

    --blue:#3976d4;
    --blue-light:#e9f1ff;

    --orange:#e28a2e;
    --orange-light:#fff1df;

    --silver:#eef0f5;
    --silver-dark:#cbd0da;

    --border:#eadff0;

    --background:#f7f5f9;

    --shadow:
        0 14px 40px rgba(68,24,94,.10);

    --shadow-hover:
        0 22px 55px rgba(68,24,94,.17);

    --sidebar-width:285px;

    --topbar-height:76px;

    --radius:22px;

}


/* =========================================================
   RESET
========================================================= */

*{

    box-sizing:border-box;

    margin:0;

    padding:0;

}


html{

    scroll-behavior:smooth;

}


body{

    font-family:"Cairo",sans-serif;

    direction:rtl;

    background:

        radial-gradient(
            circle at 5% 5%,
            rgba(201,151,50,.09),
            transparent 25%
        ),

        radial-gradient(
            circle at 95% 30%,
            rgba(112,39,160,.08),
            transparent 28%
        ),

        var(--background);

    color:var(--text);

    min-height:100vh;

    overflow-x:hidden;

}


body::before{

    content:"";

    position:fixed;

    width:360px;

    height:360px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(141,79,192,.07),
            transparent 68%
        );

    top:-180px;

    left:-160px;

    pointer-events:none;

    z-index:-1;

}


body::after{

    content:"";

    position:fixed;

    width:420px;

    height:420px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(201,151,50,.06),
            transparent 68%
        );

    bottom:-230px;

    right:-170px;

    pointer-events:none;

    z-index:-1;

}


button,
input,
textarea,
select{

    font-family:inherit;

}


button{

    cursor:pointer;

}


.hidden{

    display:none !important;

}


/* =========================================================
   LOGIN SCREEN
========================================================= */

#loginScreen{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px 18px;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(232,199,107,.14),
            transparent 25%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(141,79,192,.20),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #32104f,
            #54206f 48%,
            #3a1555
        );

    position:relative;

    overflow:hidden;

}


#loginScreen::before{

    content:"";

    position:absolute;

    width:500px;

    height:500px;

    border:1px solid rgba(255,255,255,.10);

    border-radius:50%;

    top:-260px;

    right:-180px;

}


#loginScreen::after{

    content:"";

    position:absolute;

    width:420px;

    height:420px;

    border:1px solid rgba(232,199,107,.13);

    border-radius:50%;

    bottom:-230px;

    left:-170px;

}


.login-wrapper{

    width:100%;

    max-width:470px;

    position:relative;

    z-index:2;

}


.brand-login{

    text-align:center;

    color:white;

    margin-bottom:22px;

}


.brand-logo{

    width:78px;

    height:78px;

    margin:0 auto 12px;

    border-radius:24px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #e8c76b,
            #b98524
        );

    color:#32104f;

    font-size:34px;

    box-shadow:
        0 14px 35px rgba(0,0,0,.25);

    border:2px solid rgba(255,255,255,.45);

}


.brand-login h1{

    font-size:32px;

    font-weight:900;

    letter-spacing:1px;

}


.brand-login p{

    font-size:13px;

    opacity:.78;

    margin-top:3px;

}


.login-card{

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(250,247,252,.96)
        );

    border:1px solid rgba(232,199,107,.65);

    border-radius:30px;

    padding:32px;

    box-shadow:
        0 30px 80px rgba(18,5,30,.30);

    overflow:hidden;

}


.login-card::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    left:0;

    height:5px;

    background:
        linear-gradient(
            90deg,
            var(--gold-dark),
            var(--gold-light),
            var(--gold)
        );

}


.login-card::after{

    content:"✦";

    position:absolute;

    top:15px;

    left:20px;

    color:var(--gold);

    font-size:18px;

    opacity:.7;

}


.login-title{

    text-align:center;

    margin-bottom:25px;

}


.login-title h2{

    color:var(--purple-900);

    font-size:22px;

    font-weight:800;

}


.login-title p{

    color:var(--muted);

    font-size:13px;

    margin-top:4px;

}


.input-group{

    margin-bottom:17px;

}


.input-group label{

    display:block;

    font-size:13px;

    font-weight:700;

    color:var(--text);

    margin-bottom:7px;

}


.input-box{

    height:54px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:0 15px;

    background:#fff;

    border:1px solid var(--border);

    border-radius:16px;

    transition:.25s ease;

}


.input-box:focus-within{

    border-color:var(--gold);

    box-shadow:
        0 0 0 4px rgba(201,151,50,.10);

}


.input-box i{

    color:var(--purple);

    width:22px;

    text-align:center;

}


.input-box input{

    width:100%;

    border:0;

    outline:0;

    background:transparent;

    color:var(--text);

    font-size:14px;

}


.password-toggle{

    border:0;

    background:transparent;

    color:var(--muted);

    font-size:15px;

}


.login-button{

    width:100%;

    height:55px;

    border:0;

    border-radius:17px;

    margin-top:7px;

    color:#fff;

    font-size:15px;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            var(--purple-700),
            var(--purple)
        );

    box-shadow:
        0 13px 28px rgba(112,39,160,.28);

    transition:.25s ease;

    position:relative;

    overflow:hidden;

}


.login-button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 18px 34px rgba(112,39,160,.34);

}


.login-button:disabled{

    opacity:.65;

    cursor:not-allowed;

    transform:none;

}


.login-message{

    min-height:22px;

    text-align:center;

    font-size:13px;

    margin-top:13px;

    font-weight:700;

}


.demo-login{

    margin-top:18px;

    padding:12px 14px;

    border-radius:15px;

    background:var(--gold-pale);

    border:1px solid rgba(201,151,50,.20);

    color:#765719;

    font-size:11px;

    text-align:center;

}


/* =========================================================
   APP
========================================================= */

#app{

    display:none;

    min-height:100vh;

}


.app-shell{

    min-height:100vh;

    display:flex;

    direction:rtl;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:var(--sidebar-width);

    position:fixed;

    top:0;

    right:0;

    bottom:0;

    z-index:1000;

    display:flex;

    flex-direction:column;

    background:

        linear-gradient(
            180deg,
            #32104f 0%,
            #3b145b 52%,
            #281033 100%
        );

    color:#fff;

    border-left:1px solid rgba(232,199,107,.24);

    box-shadow:
        -15px 0 45px rgba(40,10,55,.16);

}


.sidebar-brand{

    padding:24px 20px 18px;

    display:flex;

    align-items:center;

    gap:12px;

    border-bottom:1px solid rgba(255,255,255,.09);

}


.sidebar-brand-logo{

    width:49px;

    height:49px;

    flex:none;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            var(--gold-dark)
        );

    color:var(--purple-900);

    font-size:22px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.20);

}


.sidebar-brand-text strong{

    display:block;

    font-size:21px;

    font-weight:900;

    letter-spacing:.7px;

}


.sidebar-brand-text span{

    display:block;

    font-size:10px;

    opacity:.68;

    margin-top:1px;

}


.sidebar-doctor{

    margin:17px 15px;

    padding:14px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,255,255,.09);

    backdrop-filter:blur(12px);

}


.sidebar-doctor-top{

    display:flex;

    align-items:center;

    gap:10px;

}


.sidebar-avatar{

    width:43px;

    height:43px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #f5e1a2,
            #c99732
        );

    color:var(--purple-900);

    font-size:18px;

    flex:none;

}


.sidebar-doctor-name{

    min-width:0;

}


.sidebar-doctor-name strong{

    display:block;

    font-size:13px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.sidebar-doctor-name span{

    display:block;

    color:#d8c8df;

    font-size:10px;

    margin-top:2px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.sidebar-online{

    display:flex;

    align-items:center;

    gap:5px;

    margin-top:10px;

    font-size:10px;

    color:#baf1d9;

}


.sidebar-online-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#35d995;

    box-shadow:0 0 0 4px rgba(53,217,149,.10);

}


.sidebar-nav{

    flex:1;

    overflow-y:auto;

    padding:5px 12px 15px;

}


.sidebar-nav::-webkit-scrollbar{

    width:4px;

}


.sidebar-nav::-webkit-scrollbar-thumb{

    background:rgba(255,255,255,.12);

    border-radius:20px;

}


.nav-title{

    padding:10px 10px 8px;

    color:#a995b1;

    font-size:10px;

    font-weight:700;

}


.nav-item{

    width:100%;

    height:48px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:0 14px;

    margin-bottom:5px;

    border:0;

    border-radius:15px;

    background:transparent;

    color:#dfd3e4;

    font-size:12px;

    font-weight:700;

    text-align:right;

    transition:.22s ease;

    position:relative;

}


.nav-item i{

    width:22px;

    text-align:center;

    font-size:15px;

    color:#bda9c7;

    transition:.22s ease;

}


.nav-item:hover{

    background:rgba(255,255,255,.075);

    color:#fff;

}


.nav-item:hover i{

    color:var(--gold-light);

}


.nav-item.active{

    color:#fff;

    background:
        linear-gradient(
            90deg,
            rgba(201,151,50,.17),
            rgba(141,79,192,.36)
        );

    border:1px solid rgba(232,199,107,.18);

    box-shadow:
        inset 3px 0 0 var(--gold);

}


.nav-item.active i{

    color:var(--gold-light);

}


.nav-badge{

    margin-right:auto;

    min-width:20px;

    height:20px;

    padding:0 5px;

    display:none;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    background:var(--gold);

    color:var(--purple-950);

    font-size:9px;

    font-weight:900;

}


.nav-badge.show{

    display:flex;

}


.sidebar-footer{

    padding:14px;

    border-top:1px solid rgba(255,255,255,.09);

}


.sidebar-logout{

    width:100%;

    height:45px;

    border:1px solid rgba(216,61,85,.24);

    border-radius:14px;

    background:rgba(216,61,85,.08);

    color:#ffb8c3;

    font-size:12px;

    font-weight:800;

    transition:.2s ease;

}


.sidebar-logout:hover{

    background:rgba(216,61,85,.16);

}


/* =========================================================
   MAIN AREA
========================================================= */

.main-area{

    flex:1;

    min-width:0;

    margin-right:var(--sidebar-width);

}


.topbar{

    height:var(--topbar-height);

    position:sticky;

    top:0;

    z-index:800;

    display:flex;

    align-items:center;

    background:
        rgba(255,255,255,.90);

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(18px);

}


.topbar-inner{

    width:100%;

    max-width:1500px;

    margin:auto;

    padding:0 28px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

}


.topbar-title{

    min-width:0;

}


.topbar-title h1{

    color:var(--purple-900);

    font-size:19px;

    font-weight:900;

}


.topbar-title p{

    color:var(--muted);

    font-size:10px;

    margin-top:1px;

}


.topbar-actions{

    display:flex;

    align-items:center;

    gap:9px;

}


.icon-button{

    width:42px;

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid var(--border);

    border-radius:14px;

    background:#fff;

    color:var(--purple);

    position:relative;

    transition:.2s ease;

}


.icon-button:hover{

    border-color:var(--gold-light);

    transform:translateY(-1px);

}


.notification-count{

    position:absolute;

    top:-5px;

    left:-4px;

    min-width:18px;

    height:18px;

    padding:0 4px;

    display:none;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    background:var(--red);

    color:#fff;

    border:2px solid #fff;

    font-size:8px;

    font-weight:900;

}


.mobile-menu-button{

    display:none;

}


/* =========================================================
   CONTENT
========================================================= */

.content-area{

    width:100%;

    max-width:1500px;

    margin:auto;

    padding:27px 28px 45px;

}


.dashboard-section{

    display:none;

    animation:sectionIn .25s ease;

}


.dashboard-section.active{

    display:block;

}


@keyframes sectionIn{

    from{

        opacity:0;

        transform:translateY(7px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =========================================================
   WELCOME
========================================================= */

.welcome-card{

    position:relative;

    overflow:hidden;

    padding:28px;

    border-radius:26px;

    color:#fff;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(232,199,107,.22),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #32104f,
            #5b2180 58%,
            #431766
        );

    border:1px solid rgba(232,199,107,.35);

    box-shadow:
        0 20px 50px rgba(68,24,94,.18);

}


.welcome-card::after{

    content:"⚕";

    position:absolute;

    left:30px;

    bottom:-30px;

    font-size:130px;

    color:rgba(255,255,255,.035);

}


.welcome-content{

    position:relative;

    z-index:2;

}


.welcome-kicker{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:5px 10px;

    border-radius:30px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.10);

    color:#f4df9d;

    font-size:10px;

    font-weight:700;

}


.welcome-card h2{

    margin-top:12px;

    font-size:25px;

    font-weight:900;

}


.welcome-card p{

    margin-top:5px;

    color:#e3d5e9;

    font-size:12px;

}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin:27px 0 14px;

}


.section-heading{

    display:flex;

    align-items:center;

    gap:11px;

}


.section-icon{

    width:42px;

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:14px;

    background:var(--purple-soft);

    color:var(--purple);

    font-size:17px;

}


.section-heading h2{

    color:var(--purple-900);

    font-size:17px;

    font-weight:900;

}


.section-heading p{

    color:var(--muted);

    font-size:10px;

    margin-top:2px;

}


.section-tools{

    display:flex;

    align-items:center;

    gap:8px;

}


/* =========================================================
   COMMON CARD
========================================================= */

.card{

    position:relative;

    background:rgba(255,255,255,.96);

    border:1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    overflow:hidden;

}


.card::before{

    content:"";

    position:absolute;

    top:0;

    right:0;

    left:0;

    height:3px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--gold)
        );

}


.card-body{

    padding:22px;

}


/* =========================================================
   PROFILE
========================================================= */

.profile-card{

    display:flex;

    align-items:center;

    gap:18px;

    padding:22px;

}


.profile-avatar{

    width:75px;

    height:75px;

    flex:none;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            var(--purple-soft),
            #e6d4ef
        );

    color:var(--purple);

    font-size:30px;

    border:1px solid #ddcbe8;

}


.profile-main{

    flex:1;

    min-width:0;

}


.profile-main h2{

    color:var(--purple-900);

    font-size:18px;

    font-weight:900;

}


.profile-specialty{

    color:var(--purple);

    font-size:12px;

    font-weight:700;

    margin-top:2px;

}


.profile-tags{

    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:9px;

}


.profile-tag{

    padding:5px 9px;

    border-radius:9px;

    background:#f8f5fa;

    border:1px solid var(--border);

    color:var(--muted);

    font-size:9px;

}


.profile-status{

    align-self:flex-start;

    display:flex;

    align-items:center;

    gap:6px;

    padding:7px 11px;

    border-radius:30px;

    background:var(--green-light);

    color:var(--green);

    font-size:10px;

    font-weight:800;

}


.profile-status-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:var(--green);

}


/* =========================================================
   STATS
========================================================= */

.stats-grid{

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:14px;

}


.stat-card{

    padding:19px;

    display:flex;

    align-items:center;

    gap:13px;

    transition:.22s ease;

}


.stat-card:hover{

    transform:translateY(-3px);

    box-shadow:var(--shadow-hover);

}


.stat-icon{

    width:49px;

    height:49px;

    flex:none;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:16px;

    font-size:18px;

}


.stat-icon.gold{

    background:var(--gold-pale);

    color:var(--gold-dark);

}


.stat-icon.orange{

    background:var(--orange-light);

    color:var(--orange);

}


.stat-icon.green{

    background:var(--green-light);

    color:var(--green);

}


.stat-icon.blue{

    background:var(--blue-light);

    color:var(--blue);

}


.stat-info{

    min-width:0;

}


.stat-info span{

    display:block;

    color:var(--muted);

    font-size:10px;

}


.stat-info strong{

    display:block;

    color:var(--purple-900);

    font-size:24px;

    font-weight:900;

    line-height:1.2;

    margin-top:2px;

}


/* =========================================================
   BUTTONS
========================================================= */

.action-button{

    min-height:38px;

    border:0;

    border-radius:11px;

    padding:0 13px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    font-size:10px;

    font-weight:800;

    transition:.2s ease;

}


.action-button:hover{

    transform:translateY(-1px);

}


.btn-purple{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--purple-700),
            var(--purple)
        );

}


.btn-gold{

    color:#4e3911;

    background:
        linear-gradient(
            135deg,
            var(--gold-light),
            var(--gold)
        );

}


.btn-soft{

    color:var(--purple);

    background:var(--purple-soft);

    border:1px solid #e3d2ec;

}


.btn-danger{

    color:#fff;

    background:var(--red);

}


.btn-success{

    color:#fff;

    background:var(--green);

}


.btn-blue{

    color:#fff;

    background:var(--blue);

}


.btn-gray{

    color:#777;

    background:#eef0f3;

}


.refresh-button{

    min-height:38px;

    padding:0 13px;

    border:1px solid var(--border);

    border-radius:12px;

    background:#fff;

    color:var(--purple);

    font-size:10px;

    font-weight:800;

}


.refresh-button:hover{

    border-color:var(--gold-light);

}


/* =========================================================
   TURN
========================================================= */

.turn-grid{

    display:grid;

    grid-template-columns:
        1.2fr 1fr 1fr;

    gap:14px;

}


.turn-box{

    min-height:145px;

    padding:20px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

}


.turn-box.current{

    color:#fff;

    background:
        radial-gradient(
            circle at 85% 10%,
            rgba(232,199,107,.22),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #32104f,
            #5b2180
        );

    border-color:rgba(232,199,107,.35);

}


.turn-label{

    font-size:10px;

    opacity:.75;

}


.turn-box:not(.current) .turn-label{

    color:var(--muted);

    opacity:1;

}


.turn-number{

    margin-top:5px;

    font-size:42px;

    line-height:1;

    font-weight:900;

}


.turn-box.current .turn-number{

    color:var(--gold-light);

}


.turn-description{

    margin-top:8px;

    font-size:10px;

    color:var(--muted);

}


.turn-box.current .turn-description{

    color:#dccce4;

}


/* =========================================================
   APPOINTMENTS
========================================================= */

.appointments-list{

    display:flex;

    flex-direction:column;

    gap:12px;

}


.appointment{

    position:relative;

    padding:18px;

    background:#fff;

    border:1px solid var(--border);

    border-radius:18px;

    box-shadow:
        0 7px 24px rgba(68,24,94,.055);

    overflow:hidden;

}


.appointment::before{

    content:"";

    position:absolute;

    top:0;

    bottom:0;

    right:0;

    width:4px;

    background:var(--purple);

}


.appointment.pending::before{

    background:var(--orange);

}


.appointment.confirmed::before,
.appointment.accepted::before{

    background:var(--green);

}


.appointment.started::before,
.appointment.in_progress::before{

    background:var(--purple);

}


.appointment.completed::before{

    background:var(--blue);

}


.appointment.rejected::before{

    background:var(--red);

}


.appointment-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

}


.patient-info{

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;

}


.patient-avatar{

    width:45px;

    height:45px;

    flex:none;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:14px;

    background:var(--purple-soft);

    color:var(--purple);

    font-size:17px;

    font-weight:900;

}


.patient-name{

    min-width:0;

}


.patient-name strong{

    display:block;

    color:var(--purple-900);

    font-size:13px;

    font-weight:900;

}


.patient-name span{

    display:block;

    color:var(--muted);

    font-size:9px;

    margin-top:2px;

}


.status-badge{

    padding:6px 10px;

    border-radius:30px;

    font-size:9px;

    font-weight:800;

    white-space:nowrap;

}


.status-pending{

    color:#a86112;

    background:var(--orange-light);

}


.status-confirmed,
.status-accepted{

    color:#08744c;

    background:var(--green-light);

}


.status-started,
.status-in_progress{

    color:var(--purple);

    background:var(--purple-soft);

}


.status-completed{

    color:#245eac;

    background:var(--blue-light);

}


.status-rejected{

    color:#a3263d;

    background:var(--red-light);

}


.appointment-details{

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:8px;

    margin-top:14px;

}


.detail{

    padding:9px 10px;

    border-radius:11px;

    background:#faf8fb;

    border:1px solid #eee6f2;

}


.detail span{

    display:block;

    color:var(--muted);

    font-size:8px;

}


.detail strong{

    display:block;

    color:var(--text);

    font-size:10px;

    margin-top:2px;

}


.reason{

    margin-top:9px;

    padding:10px 12px;

    border-radius:11px;

    background:var(--gold-pale);

    border:1px solid rgba(201,151,50,.13);

    color:#735817;

    font-size:9px;

}


.appointment-actions{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:13px;

}


.delete-appointment{

    width:36px;

    height:36px;

    margin-right:auto;

    border:1px solid #f1dce1;

    border-radius:10px;

    background:#fff6f8;

    color:var(--red);

}


.empty-state{

    padding:45px 20px;

    text-align:center;

    color:var(--muted);

}


.empty-state i{

    display:block;

    font-size:38px;

    color:#d7c9dc;

    margin-bottom:10px;

}


.empty-state strong{

    display:block;

    color:var(--purple-900);

    font-size:14px;

}


.empty-state p{

    font-size:10px;

    margin-top:4px;

}


/* =========================================================
   WORKING HOURS
========================================================= */

.settings-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:16px;

}


.setting-card{

    padding:22px;

}


.setting-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-bottom:18px;

}


.setting-title h3{

    color:var(--purple-900);

    font-size:14px;

    font-weight:900;

}


.setting-title p{

    color:var(--muted);

    font-size:9px;

    margin-top:2px;

}


.toggle-wrap{

    display:flex;

    align-items:center;

    gap:8px;

}


.toggle-text{

    font-size:9px;

    color:var(--muted);

}


.work-switch{

    position:relative;

    width:48px;

    height:26px;

    display:inline-block;

}


.work-switch input{

    display:none;

}


.work-slider{

    position:absolute;

    inset:0;

    background:#d8d4dc;

    border-radius:30px;

    transition:.2s;

}


.work-slider::before{

    content:"";

    position:absolute;

    width:20px;

    height:20px;

    top:3px;

    right:4px;

    border-radius:50%;

    background:#fff;

    box-shadow:0 2px 5px rgba(0,0,0,.15);

    transition:.2s;

}


.work-switch input:checked + .work-slider{

    background:var(--purple);

}


.work-switch input:checked + .work-slider::before{

    transform:translateX(-20px);

}


.days-grid{

    display:grid;

    grid-template-columns:
        repeat(7,minmax(0,1fr));

    gap:6px;

}


.day-button input{

    display:none;

}


.day-button label{

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid var(--border);

    border-radius:11px;

    background:#fff;

    color:var(--muted);

    font-size:9px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;

}


.day-button input:checked + label{

    background:
        linear-gradient(
            135deg,
            var(--purple-700),
            var(--purple)
        );

    border-color:var(--purple);

    color:#fff;

}


.time-fields,
.vacation-dates{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;

    margin-top:14px;

}


.field label{

    display:block;

    color:var(--muted);

    font-size:9px;

    margin-bottom:5px;

}


.field input{

    width:100%;

    height:46px;

    padding:0 11px;

    border:1px solid var(--border);

    border-radius:12px;

    outline:0;

    background:#fff;

    color:var(--text);

    font-size:11px;

}


.field input:focus{

    border-color:var(--gold);

    box-shadow:
        0 0 0 3px rgba(201,151,50,.08);

}


.save-setting{

    width:100%;

    height:44px;

    margin-top:14px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--purple-700),
            var(--purple)
        );

    color:#fff;

    font-size:10px;

    font-weight:800;

}


.setting-message{

    min-height:18px;

    text-align:center;

    margin-top:8px;

    font-size:9px;

    font-weight:700;

}


/* =========================================================
   PATIENTS
========================================================= */

.patients-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:13px;

}


.patient-card{

    padding:17px;

    display:flex;

    align-items:center;

    gap:11px;

}


.patient-card-avatar{

    width:45px;

    height:45px;

    flex:none;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:14px;

    background:var(--purple-soft);

    color:var(--purple);

    font-weight:900;

}


.patient-card-info{

    min-width:0;

    flex:1;

}


.patient-card-info strong{

    display:block;

    color:var(--purple-900);

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.patient-card-info span{

    display:block;

    color:var(--muted);

    font-size:9px;

    margin-top:2px;

}


.patient-card-count{

    min-width:30px;

    height:30px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:10px;

    background:var(--gold-pale);

    color:var(--gold-dark);

    font-size:10px;

    font-weight:900;

}


/* =========================================================
   CONSULTATION
========================================================= */

.consultation-card{

    padding:24px;

}


.consultation-empty{

    text-align:center;

    padding:50px 20px;

}


.consultation-empty i{

    font-size:42px;

    color:#d9c9df;

    margin-bottom:12px;

}


.consultation-empty h3{

    color:var(--purple-900);

    font-size:16px;

}


.consultation-empty p{

    color:var(--muted);

    font-size:10px;

    margin-top:5px;

}


.consultation-content{

    display:none;

}


.consultation-patient{

    display:flex;

    align-items:center;

    gap:14px;

    padding-bottom:18px;

    border-bottom:1px solid var(--border);

}


.consultation-avatar{

    width:65px;

    height:65px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    background:var(--purple-soft);

    color:var(--purple);

    font-size:25px;

}


.consultation-patient h3{

    color:var(--purple-900);

    font-size:18px;

    font-weight:900;

}


.consultation-patient p{

    color:var(--muted);

    font-size:10px;

    margin-top:3px;

}


.consultation-info{

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:10px;

    margin-top:17px;

}


.consultation-actions{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-top:18px;

}


/* =========================================================
   NOTIFICATIONS SECTION
========================================================= */

.notifications-list{

    display:flex;

    flex-direction:column;

    gap:9px;

}


.notification-item{

    padding:15px;

    border-radius:15px;

    border:1px solid var(--border);

    background:#fff;

    cursor:pointer;

    transition:.2s;

}


.notification-item:hover{

    border-color:var(--gold-light);

    transform:translateY(-1px);

}


.notification-item.unread{

    background:
        linear-gradient(
            135deg,
            #fff,
            var(--purple-pale)
        );

    border-right:3px solid var(--gold);

}


.notification-item strong{

    color:var(--purple-900);

    font-size:11px;

}


.notification-item p{

    color:var(--muted);

    font-size:10px;

    margin-top:4px;

}


.notification-date{

    display:block;

    color:#a69aa9;

    font-size:8px;

    margin-top:7px;

}


/* =========================================================
   RATINGS
========================================================= */

.ratings-card{

    padding:30px;

    text-align:center;

}


.rating-big{

    width:105px;

    height:105px;

    margin:5px auto 15px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            var(--gold-pale),
            #fff
        );

    border:2px solid rgba(201,151,50,.28);

}


.rating-big strong{

    color:var(--gold-dark);

    font-size:28px;

    font-weight:900;

}


.rating-big span{

    color:var(--muted);

    font-size:8px;

}


.stars{

    color:var(--gold);

    letter-spacing:3px;

    font-size:18px;

}


.ratings-card h3{

    color:var(--purple-900);

    font-size:17px;

    margin-top:12px;

}


.ratings-card p{

    color:var(--muted);

    font-size:10px;

    max-width:500px;

    margin:5px auto 0;

    line-height:1.8;

}


.coming-badge{

    display:inline-flex;

    margin-top:15px;

    padding:7px 13px;

    border-radius:30px;

    background:var(--purple-soft);

    color:var(--purple);

    font-size:9px;

    font-weight:800;

}


/* =========================================================
   SETTINGS
========================================================= */

.account-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;

}


.account-info{

    padding:18px;

}


.account-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:12px 0;

    border-bottom:1px solid #f0eaf2;

}


.account-row:last-child{

    border-bottom:0;

}


.account-row span{

    color:var(--muted);

    font-size:10px;

}


.account-row strong{

    color:var(--purple-900);

    font-size:11px;

}

/* =========================================================
   TABIBK — SIDEBAR POLISH
========================================================= */

.sidebar{
    background:
        linear-gradient(
            180deg,
            var(--purple-950) 0%,
            var(--purple-900) 55%,
            var(--purple-850) 100%
        );

    box-shadow:
        -12px 0 35px rgba(36,16,51,.10);

    border-left:1px solid rgba(232,199,107,.12);
}


/* LOGO */

.sidebar-brand{
    position:relative;
    padding:22px 18px;
}


.sidebar-brand-logo{
    box-shadow:
        0 8px 22px rgba(201,151,50,.22);
}


.sidebar-brand-text strong{
    letter-spacing:.4px;
}


.sidebar-brand-text span{
    opacity:.78;
}


/* DOCTOR CARD */

.sidebar-doctor{
    margin:0 14px 14px;
    padding:15px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.035)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05);
}


/* NAVIGATION */

.nav-title{
    color:rgba(255,255,255,.45);
    font-size:9px;
    font-weight:800;
    letter-spacing:.3px;
}


.nav-item{
    margin:4px 10px;
    width:calc(100% - 20px);
    border:1px solid transparent;
    border-radius:13px;

    transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease,
        border-color .18s ease;
}


.nav-item:hover{
    background:rgba(255,255,255,.07);
    border-color:rgba(232,199,107,.12);
    transform:translateX(-2px);
}


.nav-item.active{
    background:
        linear-gradient(
            135deg,
            rgba(201,151,50,.20),
            rgba(141,79,192,.24)
        );

    border-color:
        rgba(232,199,107,.28);

    box-shadow:
        0 8px 22px rgba(0,0,0,.12);
}


.nav-item.active::before{
    background:var(--gold-light);
    box-shadow:
        0 0 12px rgba(232,199,107,.55);
}


/* BADGES */

.nav-badge{
    box-shadow:
        0 3px 10px rgba(0,0,0,.20);
}


/* LOGOUT */

.sidebar-footer{
    padding:14px;
}


.sidebar-logout{
    border:1px solid rgba(216,61,85,.20);
    border-radius:13px;

    background:rgba(216,61,85,.08);

    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
}


.sidebar-logout:hover{
    background:rgba(216,61,85,.16);
    border-color:rgba(216,61,85,.32);
    transform:translateY(-1px);
}

    /* =========================================================
   TABIBK — TOPBAR POLISH
========================================================= */

.topbar{
    background:rgba(255,255,255,.94);
    border-bottom:1px solid var(--border);

    box-shadow:
        0 8px 28px rgba(68,24,94,.06);

    backdrop-filter:blur(14px);
}


.topbar-inner{
    min-height:var(--topbar-height);
}


/* TITLE */

.topbar-title h1{
    color:var(--purple-950);
    font-weight:900;
    letter-spacing:-.2px;
}


.topbar-title p{
    color:var(--muted);
}


/* ACTION BUTTONS */

.topbar-actions{
    gap:9px;
}


.icon-button{
    position:relative;

    width:42px;
    height:42px;

    border:1px solid var(--border);
    border-radius:13px;

    background:#fff;
    color:var(--purple-800);

    box-shadow:
        0 5px 16px rgba(68,24,94,.07);

    transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}


.icon-button:hover{
    background:var(--purple-pale);
    border-color:rgba(112,39,160,.22);

    transform:translateY(-1px);

    box-shadow:
        0 8px 20px rgba(68,24,94,.11);
}


.icon-button:active{
    transform:translateY(0);
}


/* NOTIFICATION COUNT */

.notification-count{
    box-shadow:
        0 3px 9px rgba(216,61,85,.30);
}


/* MOBILE MENU */

.mobile-menu-button{
    background:
        linear-gradient(
            135deg,
            var(--purple-800),
            var(--purple)
        );

    color:#fff;

    border-color:
        rgba(112,39,160,.30);
}


.mobile-menu-button:hover{
    background:
        linear-gradient(
            135deg,
            var(--purple-700),
            var(--purple)
        );

    color:#fff;
}

    /* =========================================================
   TABIBK — DASHBOARD CARDS POLISH
========================================================= */

.card{
    position:relative;
    overflow:hidden;

    border:1px solid var(--border);

    box-shadow:
        0 10px 30px rgba(68,24,94,.07);

    transition:
        transform .20s ease,
        box-shadow .20s ease,
        border-color .20s ease;
}


.card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(112,39,160,.16);

    box-shadow:
        0 16px 40px rgba(68,24,94,.11);
}


/* WELCOME */

.welcome-card{
    position:relative;
    overflow:hidden;

    border:
        1px solid rgba(201,151,50,.20);

    box-shadow:
        0 16px 40px rgba(68,24,94,.10);
}


.welcome-card::after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    left:-70px;
    bottom:-90px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(232,199,107,.18),
            transparent 68%
        );

    pointer-events:none;
}


.welcome-kicker{
    color:var(--gold-dark);
    font-weight:900;
}


/* SECTION HEADINGS */

.section-heading h2{
    color:var(--purple-950);
    font-weight:900;
}


.section-heading p{
    color:var(--muted);
}


/* SECTION ICON */

.section-icon{
    box-shadow:
        0 6px 18px rgba(112,39,160,.12);
}


/* PROFILE */

}


/* GOLD */

.btn-gold{

}


.btn-gold:hover{
    box-shadow:
        0 10px 24px rgba(201,151,50,.25);
}


/* SUCCESS */

.btn-success{
    box-shadow:
        0 7px 18px rgba(20,155,104,.15);
}


.btn-success:hover{
    box-shadow:

/* DANGER */

.btn-danger{

.btn-danger:hover{

/* BLUE */

.btn-blue{

.btn-blue:hover{

.appointment{

}


.patient-avatar{

.patient-name{

}


.status-badge{

.appointment-details{

.delete-appointment{

}


.delete-appointment:hover{

}


/* EMPTY STATES */

.empty-state{

}


.empty-state i{

}


/* PATIENT CARDS */

.patient-card{
    border:1px solid var(--border);

    box-shadow:
        0 9px 25px rgba(68,24,94,.06);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}


.patient-card:hover{
    transform:translateY(-3px);

    border-color:
        rgba(112,39,160,.16);

    box-shadow:
        0 16px 34px rgba(68,24,94,.10);
}


.patient-card-avatar{
    box-shadow:
        0 7px 18px rgba(112,39,160,.12);
}


.patient-card-info strong{
    color:var(--purple-950);
}


.patient-card-count{
    background:var(--gold-pale);

}


/* CONSULTATION */

.consultation-card{

}


.consultation-patient{

}


.consultation-avatar{
    box-shadow:
        0 8px 20px rgba(112,39,160,.14);
}


.consultation-info{
    gap:10px;
}


.consultation-actions{
    gap:9px;
}

    /* =========================================================
   TABIBK — NOTIFICATIONS & SETTINGS POLISH
========================================================= */

/* NOTIFICATIONS */

.notification-item{
    border:1px solid var(--border);

    border-radius:14px;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}


.notification-item:hover{
    transform:translateY(-1px);

    border-color:
        rgba(112,39,160,.15);

    box-shadow:
        0 9px 24px rgba(68,24,94,.07);
}


.notification-item.unread{
    border-right:
        3px solid var(--gold);

    background:
        linear-gradient(
            90deg,
            #fff,
            var(--gold-pale)
        );
}


.notification-date{
    color:var(--muted);
}


/* RATINGS */

.ratings-card{
    border-color:
        rgba(201,151,50,.18);

    background:
        linear-gradient(
            145deg,
            #fff,
            var(--gold-pale)
        );

    box-shadow:
        0 14px 35px rgba(156,107,22,.08);
}


.rating-big strong{
    color:var(--purple-950);
    font-weight:900;
}


.stars{
    color:var(--gold);
    text-shadow:
        0 3px 10px rgba(201,151,50,.20);
}


.coming-badge{
    border:1px solid rgba(201,151,50,.18);

    background:
        rgba(255,248,230,.90);

    color:var(--gold-dark);
}


/* SETTINGS */

.setting-card{
    border-color:
        rgba(112,39,160,.10);

    box-shadow:
        0 10px 30px rgba(68,24,94,.06);
}


.setting-card:hover{
    border-color:
        rgba(112,39,160,.16);
}


.setting-title h3{
    color:var(--purple-950);
    font-weight:900;
}


.setting-title p{
    color:var(--muted);
}


.field input{
    transition:
        border-color .18s ease,
        box-shadow .18s ease;
}


.field input:focus{
    border-color:var(--purple);

    box-shadow:
        0 0 0 3px rgba(112,39,160,.08);
}


/* DAYS */

.day-button{
    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}


.day-button:hover{
    transform:translateY(-1px);
}


.day-button:has(input:checked){
    border-color:
        rgba(112,39,160,.28);

    background:
        var(--purple-soft);

    box-shadow:
        0 5px 15px rgba(112,39,160,.08);
}


/* ACCOUNT */

.account-info{
    border-color:
        rgba(112,39,160,.10);
}


.account-row{
    transition:
        background .16s ease;
}


.account-row:hover{
    background:
        var(--purple-pale);
}

    /* =========================================================
   TABIBK — POPUPS & FEEDBACK POLISH
========================================================= */

/* NOTIFICATION POPUP */

#notificationPanel{
    border-color:
        rgba(201,151,50,.35);

    box-shadow:
        0 25px 70px rgba(40,10,55,.20);
}


.notification-panel-head{
    background:
        linear-gradient(
            135deg,
            var(--purple-950),
            var(--purple-700)
        );

    border-bottom:
        2px solid var(--gold);
}


.notification-panel-head strong{
    font-weight:900;
    letter-spacing:.2px;
}


.notification-panel-actions button{
    transition:
        background .18s ease,
        transform .18s ease;
}


.notification-panel-actions button:hover{
    background:
        rgba(255,255,255,.18);

    transform:translateY(-1px);
}


.notification-panel-list{
    scrollbar-width:thin;
}


/* MODAL */

.modal-overlay{
    backdrop-filter:blur(5px);

    background:
        rgba(36,16,51,.42);
}


.modal{
    border:
        1px solid rgba(201,151,50,.20);

    border-radius:
        22px;

    box-shadow:
        0 30px 80px rgba(36,16,51,.28);

    overflow:hidden;
}


.modal h3{
    color:
        var(--purple-950);

    font-weight:900;
}


.modal p{
    color:
        var(--muted);
}


.modal textarea,
.modal input{
    border:
        1px solid var(--border);

    border-radius:
        12px;

    transition:
        border-color .18s ease,
        box-shadow .18s ease;
}


.modal textarea:focus,
.modal input:focus{
    border-color:
        var(--purple);

    box-shadow:
        0 0 0 3px rgba(112,39,160,.08);
}


/* TOAST */

.toast{
    border:
        1px solid rgba(255,255,255,.18);

    border-radius:
        14px;

    box-shadow:
        0 14px 35px rgba(36,16,51,.18);

    backdrop-filter:
        blur(10px);
}


.toast:hover{
    transform:
        translateY(-2px);
}


/* LOADING */

.loading-overlay{
    backdrop-filter:
        blur(6px);

    background:
        rgba(247,245,249,.82);
}


.loading-spinner{
    filter:
        drop-shadow(
            0 5px 12px
            rgba(112,39,160,.20)
        );
}

    /* =========================================================
   TABIBK — FOOTER & GLOBAL POLISH
========================================================= */

.footer{
    border-top:
        1px solid var(--border);

    background:
        rgba(255,255,255,.72);

    color:
        var(--muted);

    transition:
        background .18s ease;
}


.footer strong{
    color:
        var(--purple-800);

    font-weight:900;
}


/* SIDEBAR OVERLAY */

.sidebar-overlay{
    background:
        rgba(36,16,51,.42);

    backdrop-filter:
        blur(2px);
}


/* SCROLLBAR */

*{
    scrollbar-width:
        thin;

    scrollbar-color:
        rgba(112,39,160,.30)
        transparent;
}


*::-webkit-scrollbar{
    width:7px;
    height:7px;
}


*::-webkit-scrollbar-track{
    background:
        transparent;
}


*::-webkit-scrollbar-thumb{
    background:
        rgba(112,39,160,.28);

    border-radius:
        20px;
}


*::-webkit-scrollbar-thumb:hover{
    background:
        rgba(112,39,160,.45);
}


/* TEXT SELECTION */

::selection{
    background:
        rgba(112,39,160,.18);

    color:
        var(--purple-950);
}


/* FOCUS ACCESSIBILITY */

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
    outline:
        3px solid rgba(201,151,50,.28);

    outline-offset:
        2px;
}


/* DISABLED ELEMENTS */

button:disabled{
    cursor:not-allowed;

    opacity:.58;

    transform:none !important;

    box-shadow:none !important;
}


/* SMOOTH INTERACTION */

button,
a,
input,
textarea,
select{
    -webkit-tap-highlight-color:
        transparent;
}

    /* =========================================================
   TABIBK — MICRO INTERACTIONS
========================================================= */

.nav-item,
.icon-button,
.action-button,
.refresh-button,
.save-setting,
.day-button,
.patient-card,
.appointment,
.stat-card,
.card{
    -webkit-tap-highlight-color:transparent;
}


/* BUTTON FEEDBACK */

.action-button:not(:disabled):active,
.refresh-button:not(:disabled):active,
.save-setting:not(:disabled):active,
.icon-button:not(:disabled):active{
    transform:
        scale(.97);
}


/* NAV FEEDBACK */

.nav-item:active{
    transform:
        translateX(-1px)
        scale(.99);
}


/* CARD ICONS */

.section-icon,
.stat-icon,
.patient-card-avatar,
.consultation-avatar{
    transition:
        transform .20s ease,
        box-shadow .20s ease;
}


.card:hover .section-icon,
.stat-card:hover .stat-icon,
.patient-card:hover .patient-card-avatar,
.consultation-card:hover .consultation-avatar{
    transform:
        translateY(-2px)
        scale(1.03);
}


/* PROFILE */

.profile-avatar{
    transition:
        transform .22s ease,
        box-shadow .22s ease;
}


.profile-card:hover .profile-avatar{
    transform:
        scale(1.03);

    box-shadow:
        0 13px 30px
        rgba(112,39,160,.20);
}


/* TURN BOX */

.turn-box{
    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}


.turn-box:hover{
    transform:
        translateY(-2px);

    box-shadow:
        0 12px 28px
        rgba(68,24,94,.08);
}


/* STATUS BADGES */

.status-badge{
    transition:
        transform .16s ease;
}


.status-badge:hover{
    transform:
        translateY(-1px);
}


/* EMPTY STATES */

.empty-state{
    transition:
        border-color .18s ease,
        background .18s ease;
}


.empty-state:hover{
    border-color:
        rgba(112,39,160,.18);

    background:
        linear-gradient(
            180deg,
            #fff,
            var(--purple-soft)
        );
}


/* LOGIN BUTTON */

.login-button{
    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}


.login-button:hover{
    transform:
        translateY(-1px);

    filter:
        brightness(1.03);

    box-shadow:
        0 12px 28px
        rgba(112,39,160,.20);
}


.login-button:active{
    transform:
        scale(.98);
}

/* =========================================================
   TABIBK — FINAL PROFESSIONAL RESPONSIVE SYSTEM
   SIDEBAR + TOPBAR + MOBILE + BUTTONS
========================================================= */

/* ---------------------------------------------------------
   GLOBAL UI VARIABLES
--------------------------------------------------------- */

:root{

    --tabibk-purple:#6f42c1;
    --tabibk-purple-dark:#512b91;
    --tabibk-purple-soft:#f2ecff;

    --tabibk-gold:#d6b44d;
    --tabibk-gold-dark:#b8942f;
    --tabibk-gold-soft:#fff8df;

    --tabibk-bg:#f7f5fb;
    --tabibk-card:#ffffff;

    --tabibk-text:#292331;
    --tabibk-muted:#81788f;

    --tabibk-border:#e9e3f2;

    --tabibk-success:#159957;
    --tabibk-danger:#d6455d;
    --tabibk-warning:#d99100;

    --tabibk-radius:18px;

    --tabibk-shadow:
        0 10px 30px rgba(45,25,75,.08);

    --tabibk-shadow-hover:
        0 16px 40px rgba(45,25,75,.14);

}


/* ---------------------------------------------------------
   GLOBAL BUTTON SYSTEM
--------------------------------------------------------- */

button,
.btn,
.icon-button{

    font-family:"Cairo",sans-serif;

    -webkit-tap-highlight-color:transparent;

}


button{

    cursor:pointer;

}


button:disabled{

    cursor:not-allowed;

    opacity:.55;

}


/* ---------------------------------------------------------
   STANDARD BUTTONS
--------------------------------------------------------- */

.btn{

    min-height:44px;

    padding:
        10px
        18px;

    border-radius:13px;

    border:1px solid transparent;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    font-size:14px;

    font-weight:800;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease,
        border-color .18s ease,
        color .18s ease;

}


.btn:hover{

    transform:translateY(-1px);

}


.btn:active{

    transform:translateY(0);

}


.btn.primary{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--tabibk-purple),
            var(--tabibk-purple-dark)
        );

    box-shadow:
        0 7px 18px
        rgba(111,66,193,.22);

}


.btn.primary:hover{

    box-shadow:
        0 10px 25px
        rgba(111,66,193,.30);

}


.btn.success{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #19a463,
            #117b49
        );

}


.btn.danger{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #e34e68,
            #bd3049
        );

}


.btn.warning{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #e0a72e,
            #bd7f00
        );

}


.btn.secondary{

    color:var(--tabibk-purple);

    background:#fff;

    border-color:
        rgba(111,66,193,.22);

}


.btn.secondary:hover{

    background:
        var(--tabibk-purple-soft);

}


.btn.ghost{

    color:
        var(--tabibk-text);

    background:
        rgba(111,66,193,.06);

    border-color:
        rgba(111,66,193,.10);

}


.btn.ghost:hover{

    background:
        rgba(111,66,193,.12);

}


/* ---------------------------------------------------------
   ICON BUTTON
--------------------------------------------------------- */

.icon-button{

    width:46px;

    height:46px;

    min-width:46px;

    border-radius:14px;

    border:1px solid
        rgba(111,66,193,.14);

    background:#fff;

    color:
        var(--tabibk-purple);

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease,
        color .18s ease;

    box-shadow:
        0 5px 18px rgba(45,25,75,.08);

    z-index:20;

}


.icon-button:hover{

    transform:translateY(-1px);

    background:
        var(--tabibk-purple-soft);

    box-shadow:
        0 8px 24px rgba(45,25,75,.13);

}


.icon-button:active{

    transform:scale(.96);

}


.icon-button i{

    font-size:18px;

}


/* ---------------------------------------------------------
   NOTIFICATION BADGE
--------------------------------------------------------- */

.notification-count{

    position:absolute;

    top:-4px;

    left:-4px;

    min-width:19px;

    height:19px;

    padding:0 5px;

    border-radius:20px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ef476f,
            #c92e54
        );

    color:#fff;

    border:2px solid #fff;

    font-size:10px;

    font-weight:900;

    line-height:1;

    z-index:30;

}


/* ---------------------------------------------------------
   TOPBAR
--------------------------------------------------------- */

.topbar{

    position:relative;

    z-index:1000;

}


.topbar-inner{

    min-height:72px;

    width:100%;

    display:flex;

    align-items:center;

    gap:14px;

}


/* Title */

.topbar-title{

    min-width:0;

}


.topbar-title h1{

    font-size:21px;

    font-weight:900;

    color:
        var(--tabibk-text);

    line-height:1.35;

}


.topbar-title p{

    margin-top:2px;

    font-size:12px;

    font-weight:600;

    color:
        var(--tabibk-muted);

}


/* Actions */

.topbar-actions{

    display:flex;

    align-items:center;

    gap:9px;

    flex-shrink:0;

}


/* ---------------------------------------------------------
   SIDEBAR — DESKTOP
--------------------------------------------------------- */

.sidebar{

    z-index:1400;

    overflow-y:auto;

    overflow-x:hidden;

    scrollbar-width:thin;

    scrollbar-color:
        rgba(111,66,193,.30)
        transparent;

}


.sidebar::-webkit-scrollbar{

    width:5px;

}


.sidebar::-webkit-scrollbar-thumb{

    background:
        rgba(111,66,193,.30);

    border-radius:20px;

}


/* Sidebar navigation */

.sidebar a,
.sidebar button{

    transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;

}


.sidebar a:hover,
.sidebar button:hover{

    transform:translateX(-2px);

}


/* ---------------------------------------------------------
   SIDEBAR OVERLAY
--------------------------------------------------------- */

.sidebar-overlay{

    position:fixed;

    inset:0;

    background:
        rgba(18,10,30,.48);

    backdrop-filter:
        blur(3px);

    -webkit-backdrop-filter:
        blur(3px);

    z-index:1300;

}


/* ---------------------------------------------------------
   NOTIFICATION PANEL
--------------------------------------------------------- */

#notificationPanel{

    z-index:1600 !important;

}


/* ---------------------------------------------------------
   NOTIFICATION ITEMS
--------------------------------------------------------- */

#notificationList{

    overflow-y:auto;

@media(max-width:800px){

            12px;

    }


    /*
       HTML order:
       menu group   = order 3
       title        = order 1
       notification = order 2

       RTL visual order:
       right  = menu
       center = title
       left   = notification
    */

    .topbar-actions:first-child{

        order:1 !important;

    }


    .topbar-title{

        order:2 !important;

        flex:1 1 auto !important;

        text-align:center;

        min-width:0;

    }


    .topbar-actions:last-child{

    }

    .mobile-menu-button{

    /* ---------------------------------------------
       SIDEBAR
    --------------------------------------------- */

    .sidebar{

        position:fixed !important;

        top:0 !important;

        right:0 !important;

        bottom:0 !important;

        left:auto !important;

        height:100dvh !important;

        max-height:100dvh !important;

        padding-top:

        padding-bottom:
            max(

        transform:
            translate3d(

                0,
                0
            ) !important;

        visibility:hidden;

        opacity:0;

        transition:
            transform .28s cubic-bezier(.22,.61,.36,1),

            visibility .28s ease;

        box-shadow:
            -18px 0 50px

        z-index:1400 !important;

    }


    .sidebar.open{

        transform:
            translate3d(
                0,
                0,
                0
            ) !important;

        visibility:visible;

        opacity:1;

    }


    .sidebar-overlay{

        z-index:1300 !important;

    }


    /* ---------------------------------------------
       MAIN AREA
    --------------------------------------------- */

    .main-area{

        margin-right:0 !important;

        width:100%;

        min-width:0;

    /* ---------------------------------------------
       CARDS
    --------------------------------------------- */

    .card,

        border-radius:

    }


    /* ---------------------------------------------

    --------------------------------------------- */

    .btn{

        min-height:44px;

        font-size:13px;

        padding:

            14px;

    }


    /* ---------------------------------------------

    --------------------------------------------- */

        position:fixed !important;

        left:10px !important;

        right:10px !important;

        width:auto !important;

        max-width:none !important;

        max-height:
            calc(

        border-radius:18px !important;

        z-index:1600 !important;

    }


    #notificationList{

        max-height:

    }


    /* ---------------------------------------------
       TOUCH TARGETS
    --------------------------------------------- */

    .sidebar a,
    .sidebar button,

        min-height:44px;

    }

/* =========================================================
   FINAL — SAFE RATING REFRESH
========================================================= */

function finalRefreshDashboard() {

    try {

        renderRatings();

    } catch (error) {

        console.error(
            "Final ratings refresh:",
            error
        );
    }


    try {

        renderSettings();

    } catch (error) {

        console.error(
            "Final settings refresh:",
            error
        );
    }


    try {

        updateWorkingHoursStatusUI();

    } catch (error) {

        console.error(
            "Final hours refresh:",
            error
        );
    }


    try {

        updateVacationStatusUI();

    } catch (error) {

        console.error(
            "Final vacation refresh:",
            error
        );
    }

}


/* =========================================================
   FINAL — WINDOW RESIZE
========================================================= */

let doctorResizeTimer = null;

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            doctorResizeTimer
        );

        doctorResizeTimer =
            setTimeout(
                () => {

                    /*
                       إعادة حساب بسيطة للواجهة
                       بدون إعادة تحميل الصفحة.
                    */

                    if (
                        window.innerWidth >
                        900
                    ) {

                        const overlay =
                            $("sidebarOverlay");

                        if (overlay) {

                            overlay.classList.remove(
                                "active"
                            );
                        }
                    }

                },
                150
            );
    }
);


/* =========================================================
   FINAL — BEFORE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            stopAutoRefresh();

        } catch (error) {

            console.error(
                "stopAutoRefresh:",
                error
            );
        }

    }
);


/* =========================================================
   FINAL INITIALIZATION
========================================================= */

function initializeFinalDoctorUI() {

    try {

        finalRefreshDashboard();

    } catch (error) {

        console.error(
            "initializeFinalDoctorUI:",
            error
        );
    }

}


/* =========================================================
   START FINAL UI
========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initializeFinalDoctorUI
    );

} else {

    initializeFinalDoctorUI();

}
