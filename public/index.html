<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#18051f">

    <title>طبيبك | TABIBK</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =========================================================
           TABIBK PREMIUM LANDING PAGE
           ========================================================= */

        :root {

            --purple-dark: #12031b;
            --purple-deep: #18051f;
            --purple: #2b0b3d;
            --purple-soft: #46105f;
            --purple-light: #6d238b;
            --purple-bright: #913fba;

            --gold: #c79a32;
            --gold-light: #efd477;
            --gold-bright: #fff0a0;

            --white: #ffffff;
            --white-soft: #eee8f2;

            --patient: #9c5de7;
            --doctor: #7746c7;

        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            font-family: "Cairo", sans-serif;

            color: var(--white);

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(150, 70, 190, .32),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 10% 70%,
                    rgba(110, 30, 150, .25),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #100219 0%,
                    #1b0526 25%,
                    #2b0b3d 55%,
                    #16031f 100%
                );

            overflow-x: hidden;
        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    115deg,
                    transparent 0%,
                    rgba(255,255,255,.025) 40%,
                    transparent 60%
                );

            z-index: 0;
        }


        /* =========================================================
           MEDICAL BACKGROUND
           ========================================================= */

        .medical-bg {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }

        .medical-bg::before {

            content: "";

            position: absolute;

            width: 520px;
            height: 520px;

            left: -180px;
            top: 120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(150,80,190,.25),
                    rgba(80,20,110,.08) 45%,
                    transparent 70%
                );

            filter: blur(10px);
        }

        .medical-bg::after {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            right: -180px;
            top: 250px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(125,50,175,.28),
                    transparent 68%
                );

            filter: blur(15px);
        }

        .medical-line {

            position: absolute;

            opacity: .12;

            color: #dcb8ff;
        }

        .medical-line.one {

            width: 520px;

            left: -100px;
            top: 180px;

            transform: rotate(-8deg);
        }

        .medical-line.two {

            width: 480px;

            right: -100px;
            bottom: 190px;

            transform: rotate(8deg);
        }


        /* =========================================================
           DECORATIVE LIGHTS
           ========================================================= */

        .light {

            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(3px);
        }

        .light.one {

            width: 180px;
            height: 180px;

            top: 40px;
            left: 8%;

            background: rgba(147,67,193,.18);
        }

        .light.two {

            width: 240px;
            height: 240px;

            right: 5%;
            top: 28%;

            background: rgba(102,40,150,.18);
        }

        .light.three {

            width: 220px;
            height: 220px;

            left: 15%;
            bottom: 0;

            background: rgba(105,35,145,.16);
        }


        /* =========================================================
           PAGE
           ========================================================= */

        .page {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1120px;

            margin: auto;

            padding:
                28px 24px
                55px;
        }


        /* =========================================================
           ADMIN BUTTON
           ========================================================= */

        .admin-wrapper {

            display: flex;

            justify-content: center;

            margin-bottom: 38px;
        }

        .admin-entry {

            position: relative;

            display: flex;

            align-items: center;

            gap: 18px;

            min-width: 410px;

            padding: 14px 22px;

            text-decoration: none;

            color: white;

            border: 1.5px solid var(--gold-light);

            border-radius: 60px;

            background:
                linear-gradient(
                    135deg,
                    rgba(42,10,58,.96),
                    rgba(25,5,35,.94)
                );

            box-shadow:
                0 0 0 1px rgba(255,255,255,.04),
                0 10px 35px rgba(0,0,0,.35),
                0 0 28px rgba(239,212,119,.13);

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }

        .admin-entry:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 45px rgba(0,0,0,.45),
                0 0 35px rgba(239,212,119,.25);
        }

        .admin-icon {

            width: 55px;
            height: 55px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--gold-bright);

            font-size: 23px;

            background:
                linear-gradient(
                    145deg,
                    #43205a,
                    #25102f
                );

            border: 1px solid rgba(239,212,119,.35);

            box-shadow:
                inset 0 0 18px rgba(255,255,255,.05),
                0 0 15px rgba(239,212,119,.08);
        }

        .admin-text {

            flex: 1;

            text-align: right;
        }

        .admin-title {

            display: block;

            font-size: 20px;

            font-weight: 800;

            color: white;
        }

        .admin-subtitle {

            display: block;

            margin-top: 1px;

            font-size: 12px;

            color: #d9cde0;
        }

        .admin-arrow {

            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(119,68,150,.35);

            border: 1px solid rgba(255,255,255,.13);

            color: white;

            font-size: 18px;
        }


        /* =========================================================
           BRAND
           ========================================================= */

        .brand {

            text-align: center;

            margin-top: 15px;

            margin-bottom: 32px;
        }

        .logo {

            position: relative;

            width: 170px;
            height: 170px;

            margin: auto;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .logo::before {

            content: "";

            position: absolute;

            inset: 8px;

            border-radius: 50%;

            border: 2px solid rgba(239,212,119,.38);

            box-shadow:
                0 0 28px rgba(239,212,119,.15);

            animation: pulseRing 3s ease-in-out infinite;
        }

        .logo-heart {

            position: relative;

            width: 110px;
            height: 100px;

            transform: rotate(-45deg);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #ffe27c,
                    #c9982d 65%,
                    #a97618
                );

            box-shadow:
                0 0 30px rgba(239,212,119,.32),
                inset 4px 4px 10px rgba(255,255,255,.38);
        }

        .logo-heart::before,
        .logo-heart::after {

            content: "";

            position: absolute;

            width: 110px;
            height: 100px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffe27c,
                    #c9982d 65%,
                    #a97618
                );
        }

        .logo-heart::before {

            top: -55px;
            left: 0;
        }

        .logo-heart::after {

            top: 0;
            left: 55px;
        }

        .ecg {

            position: absolute;

            z-index: 3;

            width: 115px;

            height: 45px;

            transform: rotate(0deg);

            left: 28px;

            top: 58px;
        }

        .ecg path {

            fill: none;

            stroke: white;

            stroke-width: 4;

            stroke-linecap: round;

            stroke-linejoin: round;

            filter:
                drop-shadow(
                    0 0 5px rgba(255,255,255,.8)
                );
        }

        .brand-name {

            margin-top: 14px;

            font-size: clamp(46px, 7vw, 74px);

            line-height: 1;

            font-weight: 900;

            letter-spacing: -2px;

            color: white;

            text-shadow:
                0 4px 25px rgba(0,0,0,.35);
        }

        .brand-en {

            margin-top: 10px;

            font-size: 21px;

            font-weight: 700;

            letter-spacing: 9px;

            color: var(--gold-light);

            padding-left: 9px;
        }

        .brand-tagline {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            margin-top: 16px;

            color: #f4edf7;

            font-size: 17px;

            font-weight: 600;
        }

        .brand-tagline::before,
        .brand-tagline::after {

            content: "";

            width: 80px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold-light)
                );
        }

        .brand-tagline::after {

            background:
                linear-gradient(
                    90deg,
                    var(--gold-light),
                    transparent
                );
        }


        /* =========================================================
           LOGIN CARDS
           ========================================================= */

        .login-section {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 28px;

            max-width: 820px;

            margin: 48px auto 0;
        }

        .login-card {

            position: relative;

            min-height: 475px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-end;

            padding: 24px 28px 26px;

            overflow: hidden;

            text-decoration: none;

            color: white;

            border-radius: 27px;

            border: 1px solid rgba(232,188,255,.45);

            background:
                linear-gradient(
                    180deg,
                    rgba(139,76,174,.30) 0%,
                    rgba(49,16,65,.70) 47%,
                    rgba(23,6,31,.96) 100%
                );

            box-shadow:
                0 22px 55px rgba(0,0,0,.32),
                inset 0 1px 0 rgba(255,255,255,.08);

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                border-color .35s ease;
        }

        .login-card::before {

            content: "";

            position: absolute;

            top: -80px;

            left: 50%;

            transform: translateX(-50%);

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(207,150,255,.30),
                    transparent 68%
                );

            pointer-events: none;
        }

        .login-card::after {

            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold-light),
                    transparent
                );

            opacity: .85;
        }

        .login-card:hover {

            transform: translateY(-9px);

            border-color: rgba(239,212,119,.75);

            box-shadow:
                0 28px 70px rgba(0,0,0,.45),
                0 0 35px rgba(168,91,212,.18);
        }


        /* =========================================================
           CARD ILLUSTRATION
           ========================================================= */

        .card-visual {

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 265px;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .card-glow {

            position: absolute;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(180,100,230,.30),
                    transparent 68%
                );

            filter: blur(2px);
        }

        .person {

            position: relative;

            z-index: 2;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(157,92,207,.75),
                    rgba(69,25,91,.90)
                );

            border: 1px solid rgba(255,255,255,.20);

            box-shadow:
                0 20px 35px rgba(0,0,0,.28),
                inset 0 2px 10px rgba(255,255,255,.12);
        }

        .person i {

            font-size: 90px;

            color: rgba(255,255,255,.95);

            filter:
                drop-shadow(
                    0 5px 10px rgba(0,0,0,.25)
                );
        }

        .doctor-person {

            background:
                linear-gradient(
                    145deg,
                    rgba(129,83,198,.82),
                    rgba(53,20,75,.96)
                );
        }

        .doctor-person i {

            color: #fff;

            font-size: 82px;
        }

        .role-badge {

            position: absolute;

            z-index: 4;

            bottom: 15px;

            width: 55px;
            height: 55px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    #9c54dd,
                    #57238b
                );

            border: 2px solid rgba(255,255,255,.28);

            box-shadow:
                0 7px 20px rgba(0,0,0,.28);
        }


        /* =========================================================
           CARD CONTENT
           ========================================================= */

        .card-content {

            position: relative;

            z-index: 5;

            width: 100%;

            text-align: center;
        }

        .card-title {

            font-size: 30px;

            font-weight: 900;

            margin-bottom: 8px;

            color: white;

            text-shadow:
                0 4px 15px rgba(0,0,0,.35);
        }

        .card-description {

            min-height: 55px;

            color: #e9deed;

            font-size: 14px;

            line-height: 1.9;

            margin-bottom: 22px;
        }

        .card-button {

            width: 100%;

            height: 55px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 14px;

            border-radius: 35px;

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            background:
                linear-gradient(
                    100deg,
                    #652a92,
                    #8e46bd
                );

            border: 1px solid rgba(231,191,255,.45);

            box-shadow:
                0 8px 25px rgba(0,0,0,.25),
                inset 0 1px 0 rgba(255,255,255,.18);

            transition: .3s ease;
        }

        .login-card:hover .card-button {

            background:
                linear-gradient(
                    100deg,
                    #7b34ac,
                    #a755d0
                );

            box-shadow:
                0 10px 30px rgba(143,73,189,.30);
        }

        .card-button i {

            font-size: 15px;

            transition: transform .3s ease;
        }

        .login-card:hover .card-button i {

            transform: translateX(-5px);
        }


        /* =========================================================
           FEATURES
           ========================================================= */

        .features {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 0;

            margin: 54px auto 0;

            max-width: 760px;
        }

        .feature {

            flex: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 0 24px;

            color: #eee4f1;

            font-size: 14px;

            white-space: nowrap;
        }

        .feature:not(:last-child) {

            border-left:
                1px solid rgba(239,212,119,.38);
        }

        .feature-icon {

            color: var(--gold-light);

            font-size: 22px;

            filter:
                drop-shadow(
                    0 0 8px rgba(239,212,119,.25)
                );
        }


        /* =========================================================
           FOOTER
           ========================================================= */

        footer {

            text-align: center;

            margin-top: 58px;
        }

        .footer-brand {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 20px;

            color: var(--gold-light);

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 6px;
        }

        .footer-brand::before,
        .footer-brand::after {

            content: "";

            width: 95px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold)
                );
        }

        .footer-brand::after {

            background:
                linear-gradient(
                    90deg,
                    var(--gold),
                    transparent
                );
        }

        .footer-text {

            margin-top: 10px;

            color: #bcaec3;

            font-size: 12px;
        }


        /* =========================================================
           ANIMATIONS
           ========================================================= */

        @keyframes pulseRing {

            0%,
            100% {
                transform: scale(1);

                opacity: .65;
            }

            50% {
                transform: scale(1.06);

                opacity: 1;
            }
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 800px) {

            .page {

                padding:
                    22px 18px
                    45px;
            }

            .admin-entry {

                min-width: 370px;
            }

            .login-section {

                max-width: 700px;

                gap: 20px;
            }

            .login-card {

                min-height: 450px;
            }

            .card-visual {

                height: 245px;
            }

            .person {

                width: 135px;
                height: 135px;
            }

            .person i {

                font-size: 78px;
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            body {

                min-width: 320px;
            }

            .page {

                padding:
                    16px 13px
                    38px;
            }

            .admin-wrapper {

                margin-bottom: 28px;
            }

            .admin-entry {

                width: 100%;

                min-width: 0;

                padding: 11px 14px;

                gap: 11px;
            }

            .admin-icon {

                width: 46px;
                height: 46px;

                font-size: 19px;
            }

            .admin-title {

                font-size: 16px;
            }

            .admin-subtitle {

                font-size: 10px;
            }

            .admin-arrow {

                width: 38px;
                height: 38px;

                font-size: 15px;
            }

            .brand {

                margin-top: 0;

                margin-bottom: 18px;
            }

            .logo {

                width: 135px;
                height: 135px;
            }

            .logo-heart {

                width: 85px;
                height: 78px;
            }

            .logo-heart::before,
            .logo-heart::after {

                width: 85px;
                height: 78px;
            }

            .logo-heart::before {

                top: -43px;
            }

            .logo-heart::after {

                left: 43px;
            }

            .ecg {

                width: 90px;

                left: 22px;

                top: 49px;
            }

            .brand-name {

                font-size: 47px;

                margin-top: 8px;
            }

            .brand-en {

                font-size: 16px;

                letter-spacing: 7px;
            }

            .brand-tagline {

                font-size: 12px;

                gap: 8px;

                margin-top: 11px;
            }

            .brand-tagline::before,
            .brand-tagline::after {

                width: 35px;
            }

            .login-section {

                grid-template-columns: 1fr;

                gap: 17px;

                margin-top: 30px;

                max-width: 430px;
            }

            .login-card {

                min-height: 410px;

                border-radius: 23px;

                padding:
                    20px 20px
                    22px;
            }

            .card-visual {

                height: 230px;
            }

            .person {

                width: 125px;
                height: 125px;
            }

            .person i {

                font-size: 72px;
            }

            .doctor-person i {

                font-size: 68px;
            }

            .role-badge {

                width: 48px;
                height: 48px;

                bottom: 12px;
            }

            .card-title {

                font-size: 27px;
            }

            .card-description {

                font-size: 13px;

                line-height: 1.8;

                margin-bottom: 18px;
            }

            .card-button {

                height: 51px;

                font-size: 14px;
            }

            .features {

                margin-top: 35px;

                flex-direction: column;

                gap: 15px;
            }

            .feature {

                width: 100%;

                padding: 0;

                font-size: 12px;
            }

            .feature:not(:last-child) {

                border-left: 0;
            }

            footer {

                margin-top: 40px;
            }

            .footer-brand {

                font-size: 11px;

                letter-spacing: 4px;

                gap: 10px;
            }

            .footer-brand::before,
            .footer-brand::after {

                width: 45px;
            }

            .footer-text {

                font-size: 10px;
            }
        }


        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 380px) {

            .brand-name {

                font-size: 42px;
            }

            .brand-en {

                font-size: 14px;

                letter-spacing: 5px;
            }

            .login-card {

                min-height: 390px;
            }

            .card-visual {

                height: 215px;
            }

            .person {

                width: 112px;
                height: 112px;
            }

            .person i {

                font-size: 64px;
            }

            .card-title {

                font-size: 25px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         MEDICAL BACKGROUND
         ========================================================= -->

    <div class="medical-bg">

        <div class="light one"></div>
        <div class="light two"></div>
        <div class="light three"></div>

        <svg
            class="medical-line one"
            viewBox="0 0 700 160"
            preserveAspectRatio="none"
        >

            <path
                d="
                    M0 90
                    L120 90
                    L145 90
                    L165 35
                    L190 130
                    L220 90
                    L350 90
                    L380 90
                    L405 58
                    L430 110
                    L455 90
                    L700 90
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
            />

        </svg>


        <svg
            class="medical-line two"
            viewBox="0 0 700 160"
            preserveAspectRatio="none"
        >

            <path
                d="
                    M0 90
                    L130 90
                    L155 90
                    L180 45
                    L205 125
                    L235 90
                    L365 90
                    L390 90
                    L415 55
                    L440 112
                    L470 90
                    L700 90
                "
                fill="none"
                stroke="currentColor"
                stroke-width="4"
            />

        </svg>

    </div>



    <!-- =========================================================
         PAGE
         ========================================================= -->

    <main class="page">


        <!-- =====================================================
             ADMIN ENTRY
             ===================================================== -->

        <div class="admin-wrapper">
