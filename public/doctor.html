<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0b132b"
>

<title>TABIBK | لوحة الطبيب</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: "Cairo", sans-serif;

    background:
        linear-gradient(
            180deg,
            #f5f7fb 0%,
            #eef2f7 100%
        );

    color: #101828;

    min-height: 100vh;
}

/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}

/* =====================================================
   HEADER
===================================================== */

header {

    background:
        linear-gradient(
            135deg,
            #0b132b,
            #172554
        );

    color: white;

    padding:
        18px
        16px
        28px;

    border-radius:
        0
        0
        32px
        32px;

    box-shadow:
        0 10px 30px
        rgba(11,19,43,.20);
}

.header-content {

    max-width: 700px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.brand-icon {

    width: 50px;

    height: 50px;

    background: #d4af37;

    color: #0b132b;

    border-radius: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 23px;

    box-shadow:
        0 8px 18px
        rgba(212,175,55,.25);
}

.brand-text strong {

    display: block;

    font-size: 23px;

    font-weight: 800;
}

.brand-text span {

    font-size: 11px;

    color: #dbe2f0;
}

/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width: 700px;

    margin: auto;

    padding:
        20px
        16px
        45px;
}

/* =====================================================
   CARD
===================================================== */

.card {

    background: white;

    border-radius: 23px;

    padding: 20px;

    margin-bottom: 16px;

    border:
        1px solid #e9edf3;

    box-shadow:
        0 7px 28px
        rgba(16,24,40,.07);
}

/* =====================================================
   TITLE
===================================================== */

.card-title {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 18px;
}

.card-title-icon {

    width: 42px;

    height: 42px;

    background: #fff8df;

    color: #a27d12;

    border-radius: 13px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.card-title h2 {

    font-size: 17px;

    font-weight: 800;
}

/* =====================================================
   SELECT
===================================================== */

select {

    width: 100%;

    padding: 14px;

    border-radius: 15px;

    border:
        1px solid #dfe3ea;

    background: #fafbfc;

    font-family: "Cairo", sans-serif;

    outline: none;

    font-size: 14px;

    color: #101828;
}

select:focus {

    border-color: #d4af37;

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,.12);
}

/* =====================================================
   DOCTOR PROFILE
===================================================== */

.doctor-profile {

    display: flex;

    align-items: center;

    gap: 14px;
}

.avatar {

    width: 64px;

    height: 64px;

    border-radius: 19px;

    background:
        linear-gradient(
            135deg,
            #0b132b,
            #263b73
        );

    color: #d4af37;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    flex-shrink: 0;
}

.profile-info {

    flex: 1;
}

.profile-info strong {

    display: block;

    font-size: 17px;

    margin-bottom: 3px;
}

.profile-info span {

    display: block;

    color: #667085;

    font-size: 12px;
}

.status {

    margin-top: 7px;

    display: inline-flex;

    align-items: center;

    gap: 5px;

    font-size: 11px;

    color: #12b76a;
}

.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #12b76a;

    box-shadow:
        0 0 0 4px
        rgba(18,183,106,.10);
}

/* =====================================================
   STATS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 10px;

    margin-top: 18px;
}

.stat {

    background: #f8fafc;

    border-radius: 16px;

    padding: 14px 8px;

    text-align: center;

    border:
        1px solid #eef1f5;
}

.stat strong {

    display: block;

    font-size: 22px;

    color: #0b132b;
}

.stat span {

    font-size: 10px;

    color: #667085;
}

/* =====================================================
   TURN DASHBOARD
===================================================== */

.turn-dashboard {

    background:
        linear-gradient(
            135deg,
            #0b132b,
            #172554
        );

    color: white;

    border-radius: 24px;

    padding: 22px;

    margin-bottom: 16px;

    position: relative;

    overflow: hidden;

    box-shadow:
        0 12px 35px
        rgba(11,19,43,.22);
}

.turn-dashboard::before {

    content: "";

    position: absolute;

    width: 180px;

    height: 180px;

    border-radius: 50%;

    background:
        rgba(212,175,55,.08);

    left: -70px;

    top: -80px;
}

.turn-header {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.turn-header h2 {

    font-size: 16px;

    font-weight: 800;
}

.live-badge {

    background:
        rgba(18,183,106,.15);

    color: #5df0a7;

    border:
        1px solid
        rgba(93,240,167,.25);

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: 700;
}

.current-turn {

    position: relative;

    text-align: center;

    padding: 10px 0 20px;
}

.turn-label {

    font-size: 12px;

    color: #c7d0e4;

    display: block;

    margin-bottom: 3px;
}

.turn-number {

    font-size: 58px;

    line-height: 1.1;

    font-weight: 800;

    color: #d4af37;

    text-shadow:
        0 5px 20px
        rgba(212,175,55,.20);
}

.current-patient {

    font-size: 14px;

    font-weight: 700;

    margin-top: 4px;
}

.turn-info-grid {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 10px;

    position: relative;
}

.turn-info {

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 15px;

    padding: 13px;

    text-align: center;
}

.turn-info i {

    color: #d4af37;

    margin-bottom: 5px;

    display: block;
}

.turn-info strong {

    display: block;

    font-size: 18px;
}

.turn-info span {

    color: #c7d0e4;

    font-size: 10px;
}

.no-current {

    color: #c7d0e4;

    font-size: 13px;

    padding: 20px;
}

/* =====================================================
   APPOINTMENTS
===================================================== */

.appointments {

    display: grid;

    gap: 12px;
}

.appointment {

    border:
        1px solid #e7eaf0;

    border-radius: 19px;

    padding: 16px;

    background: #fff;

    transition: .2s;
}

.appointment.current {

    border:
        2px solid #d4af37;

    background:
        linear-gradient(
            180deg,
            #fffdf5,
            #ffffff
        );

    box-shadow:
        0 7px 22px
        rgba(212,175,55,.13);
}

.appointment.next {

    border:
        2px solid #b8c7ed;

    background:
        #fbfcff;
}

.appointment-head {

    display: flex;

    align-items: center;

    gap: 10px;
}

.patient-avatar {

    width: 46px;

    height: 46px;

    border-radius: 14px;

    background: #eef2ff;

    color: #172554;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;
}

.patient-info {

    flex: 1;

    min-width: 0;
}

.patient-info strong {

    display: block;

    font-size: 14px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.patient-info span {

    display: block;

    color: #667085;

    font-size: 11px;
}

.queue {

    min-width: 48px;

    height: 48px;

    border-radius: 14px;

    background: #fff8df;

    color: #8a6a0d;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;
}

.queue strong {

    font-size: 17px;
}

.queue span {

    font-size: 8px;
}

/* =====================================================
   CURRENT LABEL
===================================================== */

.turn-label-card {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    padding: 5px 9px;

    border-radius: 20px;

    background: #fff8df;

    color: #8a6a0d;

    font-size: 9px;

    font-weight: 800;

    margin-top: 9px;
}

.next-label-card {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    padding: 5px 9px;

    border-radius: 20px;

    background: #eff8ff;

    color: #175cd3;

    font-size: 9px;

    font-weight: 800;

    margin-top: 9px;
}

/* =====================================================
   DETAILS
===================================================== */

.details {

    margin-top: 12px;

    padding-top: 12px;

    border-top:
        1px solid #f0f1f4;

    font-size: 11px;

    color: #667085;

    line-height: 2;
}

.details i {

    width: 20px;

    color: #b18a16;
}

/* =====================================================
   BADGES
===================================================== */

.badge {

    display: inline-block;

    margin-top: 8px;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: 700;
}

.pending {

    background: #fff7e6;

    color: #b54708;
}

.confirmed {

    background: #ecfdf3;

    color: #027a48;
}

.in_progress {

    background: #eff8ff;

    color: #175cd3;
}

.completed {

    background: #f2f4f7;

    color: #475467;
}

.rejected {

    background: #fef3f2;

    color: #b42318;
}

/* =====================================================
   BUTTONS
===================================================== */

.actions {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 8px;

    margin-top: 13px;
}

.action-btn {

    border: none;

    border-radius: 13px;

    padding: 11px 8px;

    font-family:
        "Cairo",
        sans-serif;

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

    transition: .15s;
}

.action-btn:active {

    transform:
        scale(.96);
}

.accept {

    background: #ecfdf3;

    color: #027a48;
}

.reject {

    background: #fef3f2;

    color: #b42318;
}

.start {

    background: #eff8ff;

    color: #175cd3;
}

.complete {

    background: #f2f4f7;

    color: #344054;
}

/* =====================================================
   EMPTY
===================================================== */

.empty {

    text-align: center;

    padding: 30px 10px;

    color: #98a2b3;

    font-size: 13px;
}

.empty i {

    display: block;

    font-size: 34px;

    margin-bottom: 10px;
}

/* =====================================================
   LOADING
===================================================== */

.loading {

    text-align: center;

    padding: 25px;

    color: #667085;

    font-size: 13px;
}

/* =====================================================
   REFRESH
===================================================== */

.refresh-btn {

    width: 100%;

    border:
        1px solid #d4af37;

    background: white;

    color: #8a6a0d;

    padding: 13px;

    border-radius: 14px;

    font-family:
        "Cairo",
        sans-serif;

    font-weight: 700;

    cursor: pointer;

    margin-top: 14px;

    transition: .2s;
}

.refresh-btn:active {

    transform:
        scale(.98);
}

/* =====================================================
   FOOTER
===================================================== */

footer {

    text-align: center;

    color: #98a2b3;

    font-size: 11px;

    padding:
        10px
        20px
        25px;
}

footer strong {

    color: #8a6a0d;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:450px) {

    .stats {

        gap: 7px;
    }

    .stat {

        padding:
            11px
            5px;
    }

    .turn-number {

        font-size: 52px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header-content">

        <div class="brand">

            <div class="brand-icon">

                <i class="fa-solid fa-user-doctor"></i>

            </div>

            <div class="brand-text">

                <strong>
                    TABIBK
                </strong>

                <span>
                    لوحة الطبيب
                </span>

            </div>

        </div>

    </div>

</header>


<main class="container">


<!-- =====================================================
     SELECT DOCTOR
===================================================== -->

<section class="card">

    <div class="card-title">

        <div class="card-title-icon">

            <i class="fa-solid fa-stethoscope"></i>

        </div>

        <h2>
            اختيار الطبيب
        </h2>

    </div>


    <select
        id="doctorSelect"
        onchange="selectDoctor()"
    >

        <option value="">
            جاري تحميل الأطباء...
        </option>

    </select>

</section>


<!-- =====================================================
     PROFILE
===================================================== -->

<section
    id="profileCard"
    class="card hidden"
>

    <div class="doctor-profile">

        <div class="avatar">

            <i class="fa-solid fa-user-doctor"></i>

        </div>


        <div class="profile-info">

            <strong id="doctorName">
                -
            </strong>

            <span id="doctorSpecialty">
                -
            </span>

            <div class="status">

                <span class="status-dot"></span>

                متصل

            </div>

        </div>

    </div>


    <div class="stats">

        <div class="stat">

            <strong id="totalCount">
                0
            </strong>

            <span>
                كل الحجوزات
            </span>

        </div>


        <div class="stat">

            <strong id="waitingCount">
                0
            </strong>

            <span>
                قيد الانتظار
            </span>

        </div>


        <div class="stat">

            <strong id="confirmedCount">
                0
            </strong>

            <span>
                مؤكدة
            </span>

        </div>

    </div>

</section>


<!-- =====================================================
     TURN DASHBOARD
===================================================== -->

<section
    id="turnDashboard"
    class="turn-dashboard hidden"
>

    <div class="turn-header">

        <h2>
            <i class="fa-solid fa-list-ol"></i>
            نظام الدور
        </h2>

        <span class="live-badge">

            <i class="fa-solid fa-circle"></i>
            مباشر

        </span>

    </div>


    <div
        id="currentTurnBox"
        class="current-turn"
    >

        <span class="turn-label">
            المريض الحالي
        </span>

        <div
            id="currentTurnNumber"
            class="turn-number"
        >
            -
        </div>

        <div
            id="currentPatientName"
            class="current-patient"
        >
            لا يوجد مريض حالي
        </div>

    </div>


    <div class="turn-info-grid">

        <div class="turn-info">

            <i class="fa-solid fa-forward"></i>

            <strong id="nextTurn">
                -
            </strong>

            <span>
                المريض التالي
            </span>

        </div>


        <div class="turn-info">

            <i class="fa-solid fa-users"></i>

            <strong id="patientsBefore">
                0
            </strong>

            <span>
                مرضى قبل المريض
            </span>

        </div>

    </div>

</section>


<!-- =====================================================
     APPOINTMENTS
===================================================== -->

<section class="card">

    <div class="card-title">

        <div class="card-title-icon">

            <i class="fa-solid fa-calendar-check"></i>

        </div>

        <h2>
            الحجوزات
        </h2>

    </div>


    <div id="appointmentsList">

        <div class="empty">

            <i class="fa-solid fa-calendar-xmark"></i>

            اختر الطبيب لعرض الحجوزات

        </div>

    </div>


    <button
        class="refresh-btn"
        onclick="loadAppointments()"
    >

        <i class="fa-solid fa-rotate"></i>

        تحديث الحجوزات

    </button>

</section>


</main>


<footer>

    <strong>
        TABIBK
    </strong>

    <br>

    نظام حجز المواعيد الطبية

</footer>


<script>

/* =====================================================
   API
===================================================== */

const API = "";


/* =====================================================
   VARIABLES
===================================================== */

let currentDoctorId = null;

let lastCurrentTurn = null;


/* =====================================================
   LOAD DOCTORS
===================================================== */

async function loadDoctors() {

    const select =
        document.getElementById(
            "doctorSelect"
        );

    try {

        const response =
            await fetch(
                API +
                "/api/doctors"
            );

        const data =
            await response.json();

        if (
            !data.success ||
            !data.doctors.length
        ) {

            select.innerHTML =
                `
                <option value="">
                    لا يوجد أطباء
                </option>
                `;

            return;
        }

        select.innerHTML =
            `
            <option value="">
                اختر الطبيب
            </option>
            `;

        data.doctors.forEach(
            doctor => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    doctor.id;

                option.textContent =
                    `${doctor.name} — ${doctor.specialty}`;

                select.appendChild(
                    option
                );

            }
        );

    } catch (error) {

        console.error(error);

        select.innerHTML =
            `
            <option value="">
                خطأ في الاتصال بالسيرفر
            </option>
            `;

    }

}


/* =====================================================
   SELECT DOCTOR
===================================================== */

function selectDoctor() {

    const select =
        document.getElementById(
            "doctorSelect"
        );

    currentDoctorId =
        Number(select.value);

    lastCurrentTurn = null;

    if (!currentDoctorId) {

        document
            .getElementById(
                "profileCard"
            )
            .classList.add(
                "hidden"
            );

        document
            .getElementById(
                "turnDashboard"
            )
            .classList.add(
                "hidden"
            );

        return;
    }

    loadDoctorProfile();

    loadAppointments();

}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadDoctorProfile() {

    try {

        const response =
            await fetch(
                API +
                `/api/doctors/${currentDoctorId}`
            );

        const data =
            await response.json();

        if (!data.success) {

            return;
        }

        const doctor =
            data.doctor;

        document.getElementById(
            "doctorName"
        ).textContent =
            doctor.name;

        document.getElementById(
            "doctorSpecialty"
        ).textContent =
            doctor.specialty;

        document
            .getElementById(
                "profileCard"
            )
            .classList.remove(
                "hidden"
            );

    } catch (error) {

        console.error(error);

    }

}


/* =====================================================
   LOAD APPOINTMENTS
===================================================== */

async function loadAppointments() {

    if (!currentDoctorId) {

        return;
    }

    const list =
        document.getElementById(
            "appointmentsList"
        );

    list.innerHTML =
        `
        <div class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            جاري تحميل الحجوزات...

        </div>
        `;

    try {

        const response =
            await fetch(
                API +
                `/api/doctors/${currentDoctorId}/appointments`
            );

        const data =
            await response.json();

        if (!data.success) {

            list.innerHTML =
                `
                <div class="empty">

                    تعذر تحميل الحجوزات

                </div>
                `;

            return;
        }

        let appointments =
            data.appointments || [];


        /*
            ترتيب الحجوزات حسب رقم الدور
        */

        appointments.sort(
            (a, b) =>
                a.queueNumber -
                b.queueNumber
        );


        updateStats(
            appointments
        );


        updateTurnDashboard(
            appointments
        );


        if (!appointments.length) {

            list.innerHTML =
                `
                <div class="empty">

                    <i class="fa-solid fa-calendar-xmark"></i>

                    لا توجد حجوزات حالياً

                </div>
                `;

            return;
        }


        list.innerHTML = "";


        appointments.forEach(
            appointment => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "appointment";

                div.innerHTML =
                    appointmentHTML(
                        appointment,
                        appointments
                    );

                list.appendChild(
                    div
                );

            }
        );

    } catch (error) {

        console.error(error);

        list.innerHTML =
            `
            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                تعذر الاتصال بالسيرفر

            </div>
            `;

    }

}


/* =====================================================
   FIND CURRENT PATIENT
===================================================== */

function getCurrentPatient(
    appointments
) {

    /*
       المريض الذي حالته
       in_progress هو الحالي
    */

    const inProgress =
        appointments.find(
            appointment =>
                appointment.status ===
                "in_progress"
        );

    if (inProgress) {

        return inProgress;
    }


    /*
       إذا لم توجد معاينة جارية،
       نبحث عن أول حجز مؤكد
    */

    const confirmed =
        appointments.find(
            appointment =>
                appointment.status ===
                "confirmed"
        );

    return confirmed || null;

}


/* =====================================================
   FIND NEXT PATIENT
===================================================== */

function getNextPatient(
    appointments
) {

    return appointments.find(
        appointment =>
            appointment.status ===
            "confirmed"
    ) || null;

}


/* =====================================================
   TURN DASHBOARD
===================================================== */

function updateTurnDashboard(
    appointments
) {

    const dashboard =
        document.getElementById(
            "turnDashboard"
        );

    dashboard.classList.remove(
        "hidden"
    );


    const activeAppointments =
        appointments.filter(
            appointment =>
                appointment.status !==
                    "rejected" &&
                appointment.status !==
                    "completed"
        );


    const currentPatient =
        getCurrentPatient(
            activeAppointments
        );


    const nextPatient =
        getNextPatient(
            activeAppointments
        );


    const currentNumber =
        document.getElementById(
            "currentTurnNumber"
        );

    const currentName =
        document.getElementById(
            "currentPatientName"
        );

    const nextNumber =
        document.getElementById(
            "nextTurn"
        );

    const before =
        document.getElementById(
            "patientsBefore"
        );


    if (currentPatient) {

        currentNumber.textContent =
            String(
                currentPatient.queueNumber
            ).padStart(
                2,
                "0"
            );

        currentName.textContent =
            currentPatient.patientName;

    } else {

        currentNumber.textContent =
            "-";

        currentName.textContent =
            "لا توجد معاينة حالياً";
    }


    /*
       المريض التالي
    */

    if (
        nextPatient &&
        (
            !currentPatient ||
            nextPatient.id !==
                currentPatient.id
        )
    ) {

        nextNumber.textContent =
            String(
                nextPatient.queueNumber
            ).padStart(
                2,
                "0"
            );

    } else {

        /*
           إذا كان الحالي نفسه
           نبحث عن مؤكد بعده
        */

        const following =
            activeAppointments.find(
                appointment =>
                    appointment.status ===
                        "confirmed" &&
                    (
                        !currentPatient ||
                        appointment.queueNumber >
                            currentPatient.queueNumber
                    )
            );

        nextNumber.textContent =
            following
                ? String(
                    following.queueNumber
                ).padStart(
                    2,
                    "0"
                )
                : "-";
    }


    /*
       عدد المرضى قبل المريض الحالي
    */

    if (currentPatient) {

        const patientsBeforeCount =
            activeAppointments.filter(
                appointment =>
                    appointment.queueNumber <
                    currentPatient.queueNumber
            ).length;

        before.textContent =
            Math.max(
                0,
                patientsBeforeCount
            );

    } else {

        before.textContent =
            activeAppointments.length;
    }


    /*
       صوت عند انتقال الدور
    */

    if (
        currentPatient &&
        lastCurrentTurn !== null &&
        currentPatient.queueNumber !==
            lastCurrentTurn
    ) {

        playNotificationSound();
    }


    if (currentPatient) {

        lastCurrentTurn =
            currentPatient.queueNumber;

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(
    appointments
) {

    document.getElementById(
        "totalCount"
    ).textContent =
        appointments.length;


    document.getElementById(
        "waitingCount"
    ).textContent =
        appointments.filter(
            a =>
                a.status ===
                    "pending" ||
                a.status ===
                    "confirmed"
        ).length;


    document.getElementById(
        "confirmedCount"
    ).textContent =
        appointments.filter(
            a =>
                a.status ===
                "confirmed"
        ).length;

}


/* =====================================================
   APPOINTMENT HTML
===================================================== */

function appointmentHTML(
    appointment,
    appointments
) {

    let statusText =
        "قيد الانتظار";


    if (
        appointment.status ===
        "confirmed"
    ) {

        statusText =
            "تم التأكيد";
    }


    if (
        appointment.status ===
        "rejected"
    ) {

        statusText =
            "مرفوض";
    }


    if (
        appointment.status ===
        "in_progress"
    ) {

        statusText =
            "قيد المعاينة";
    }


    if (
        appointment.status ===
        "completed"
    ) {

        statusText =
            "مكتمل";
    }


    /*
       تحديد الحالي
    */

    const current =
        appointment.status ===
        "in_progress";


    /*
       تحديد التالي
    */

    const next =
        appointment.status ===
        "confirmed";


    let extraClass = "";

    if (current) {

        extraClass =
            " current";
    }

    else if (next) {

        extraClass =
            " next";
    }


    let actions = "";


    /*
       قبول / رفض
    */

    if (
        appointment.status ===
        "pending"
    ) {

        actions =

            `
            <div class="actions">

                <button
                    class="action-btn accept"
                    onclick="acceptAppointment('${appointment.bookingNumber}')"
                >

                    <i class="fa-solid fa-check"></i>

                    قبول الحجز

                </button>


                <button
                    class="action-btn reject"
                    onclick="rejectAppointment('${appointment.bookingNumber}')"
                >

                    <i class="fa-solid fa-xmark"></i>

                    رفض

                </button>

            </div>
            `;
    }


    /*
       بدء المعاينة
    */

    if (
        appointment.status ===
        "confirmed"
    ) {

        actions =

            `
            <div class="actions">

                <button
                    class="action-btn start"
                    onclick="startAppointment('${appointment.bookingNumber}')"
                >

                    <i class="fa-solid fa-play"></i>

                    بدء المعاينة

                </button>

            </div>
            `;
    }


    /*
       إنهاء الموعد
    */

    if (
        appointment.status ===
        "in_progress"
    ) {

        actions =

            `
            <div class="actions">

                <button
                    class="action-btn complete"
                    onclick="completeAppointment('${appointment.bookingNumber}')"
                >

                    <i class="fa-solid fa-check-double"></i>

                    إنهاء الموعد

                </button>

            </div>
            `;
    }


    let turnLabel = "";


    if (current) {

        turnLabel =

            `
            <div class="turn-label-card">

                <i class="fa-solid fa-bullseye"></i>

                المريض الحالي

            </div>
            `;
    }

    else if (next) {

        turnLabel =

            `
            <div class="next-label-card">

                <i class="fa-solid fa-forward"></i>

                في الانتظار

            </div>
            `;
    }


    return `

        <div class="appointment${extraClass}">

            <div class="appointment-head">


                <div class="patient-avatar">

                    <i class="fa-solid fa-user"></i>

                </div>


                <div class="patient-info">

                    <strong>
                        ${appointment.patientName}
                    </strong>

                    <span>
                        ${appointment.patientPhone}
                    </span>

                </div>


                <div class="queue">

                    <strong>
                        ${appointment.queueNumber}
                    </strong>

                    <span>
                        الطابور
                    </span>

                </div>

            </div>


            ${turnLabel}


            <div class="details">

                <div>

                    <i class="fa-solid fa-ticket"></i>

                    ${appointment.bookingNumber}

                </div>


                <div>

                    <i class="fa-solid fa-comment-medical"></i>

                    ${
                        appointment.reason ||
                        "بدون سبب محدد"
                    }

                </div>


                <span
                    class="badge ${appointment.status}"
                >

                    ${statusText}

                </span>

            </div>


            ${actions}

        </div>

    `;

}


/* =====================================================
   ACTION REQUEST
===================================================== */

async function appointmentAction(
    bookingNumber,
    action
) {

    try {

        const response =
            await fetch(
                API +
                `/api/appointments/${encodeURIComponent(bookingNumber)}/${action}`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                data.message ||
                "حدث خطأ"
            );

            return;
        }


        alert(
            data.message ||
            "تمت العملية بنجاح"
        );


        await loadAppointments();

    } catch (error) {

        console.error(error);

        alert(
            "حدث خطأ في الاتصال بالسيرفر"
        );

    }

}


/* =====================================================
   ACCEPT
===================================================== */

function acceptAppointment(
    bookingNumber
) {

    if (
        !confirm(
            "هل تريد تأكيد هذا الحجز؟"
        )
    ) {

        return;
    }


    appointmentAction(
        bookingNumber,
        "accept"
    );

}


/* =====================================================
   REJECT
===================================================== */

function rejectAppointment(
    bookingNumber
) {

    if (
        !confirm(
            "هل تريد رفض هذا الحجز؟"
        )
    ) {

        return;
    }


    appointmentAction(
        bookingNumber,
        "reject"
    );

}


/* =====================================================
   START
===================================================== */

function startAppointment(
    bookingNumber
) {

    if (
        !confirm(
            "هل تريد بدء معاينة هذا المريض؟"
        )
    ) {

        return;
    }


    appointmentAction(
        bookingNumber,
        "start"
    );

}


/* =====================================================
   COMPLETE
===================================================== */

function completeAppointment(
    bookingNumber
) {

    if (
        !confirm(
            "هل تريد إنهاء هذا الموعد؟"
        )
    ) {

        return;
    }


    appointmentAction(
        bookingNumber,
        "complete"
    );

}


/* =====================================================
   NOTIFICATION SOUND
===================================================== */

function playNotificationSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {

            return;
        }

        const context =
            new AudioContext();

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.value =
            880;

        gain.gain.value =
            0.08;


        oscillator.connect(
            gain
        );

        gain.connect(
            context.destination
        );


        oscillator.start();


        setTimeout(
            () => {

                oscillator.frequency.value =
                    1100;

            },
            150
        );


        setTimeout(
            () => {

                oscillator.stop();

                context.close();

            },
            350
        );

    } catch (error) {

        console.log(
            "Sound unavailable"
        );

    }

}
