<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#1769d2">

    <title>TABIBK | طبيبك</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =====================================================
   TABIBK — OFFICIAL MEDICAL DESIGN
   Blue + Turquoise + Purple + White
===================================================== */

:root {

    --primary: #1769d2;
    --primary-dark: #124b9b;

    --turquoise: #18b89c;
    --turquoise-dark: #0f9b84;

    --purple: #7650d8;

    --bg: #f4f9fd;
    --white: #ffffff;

    --text: #12345b;
    --muted: #71839a;

    --border: #e3edf6;

    --shadow:
        0 10px 30px rgba(23, 105, 210, 0.08);

    --radius: 18px;
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html {
    scroll-behavior: smooth;
}


body {

    font-family: "Cairo", sans-serif;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #f4f9fd 55%,
            #eef8fb 100%
        );

    color: var(--text);

    min-height: 100vh;
}


/* =====================================================
   HEADER
===================================================== */

header {

    width: 100%;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f5fbff
        );

    border-bottom: 1px solid var(--border);

    position: sticky;

    top: 0;

    z-index: 1000;

    box-shadow:
        0 5px 20px rgba(23, 105, 210, 0.06);
}


.header-content {

    width: min(1100px, 94%);

    margin: auto;

    min-height: 82px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


/* =====================================================
   BRAND
===================================================== */

.brand {

    display: flex;

    align-items: center;

    gap: 12px;

    min-width: 0;
}


.brand-icon {

    width: 52px;

    height: 52px;

    border-radius: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--turquoise)
        );

    color: white;

    font-size: 25px;

    box-shadow:
        0 8px 20px rgba(23, 105, 210, 0.20);

    flex-shrink: 0;
}


.brand-text {

    display: flex;

    flex-direction: column;

    line-height: 1.2;
}


.brand-text strong {

    color: var(--primary);

    font-size: 25px;

    font-weight: 800;

    letter-spacing: .2px;
}


.brand-text span {

    color: var(--turquoise-dark);

    font-size: 12px;

    font-weight: 600;

    margin-top: 4px;
}


/* =====================================================
   NOTIFICATION BUTTON
===================================================== */

.notification-btn {

    width: 46px;

    height: 46px;

    border: 1px solid var(--border);

    border-radius: 14px;

    background: white;

    color: var(--primary);

    font-size: 19px;

    cursor: pointer;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    transition: .2s ease;
}


.notification-btn:hover {

    transform: translateY(-2px);

    border-color: #cbdff2;

    box-shadow:
        0 8px 20px rgba(23, 105, 210, .10);
}


.notification-count {

    position: absolute;

    top: -5px;

    left: -5px;

    min-width: 20px;

    height: 20px;

    padding: 0 5px;

    border-radius: 50px;

    background: #ef4444;

    color: white;

    font-size: 10px;

    font-weight: 800;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 2px solid white;
}


/* =====================================================
   MAIN
===================================================== */

main {

    width: min(1100px, 94%);

    margin: 30px auto 50px;
}


/* =====================================================
   HERO
===================================================== */

.hero {

    background:
        linear-gradient(
            135deg,
            #1769d2 0%,
            #2188df 52%,
            #18b89c 100%
        );

    border-radius: 26px;

    padding: 38px 30px;

    color: white;

    box-shadow:
        0 18px 45px rgba(23, 105, 210, .18);

    margin-bottom: 25px;

    position: relative;

    overflow: hidden;
}


.hero::before {

    content: "";

    position: absolute;

    width: 230px;

    height: 230px;

    border-radius: 50%;

    background: rgba(255,255,255,.08);

    top: -100px;

    left: -70px;
}


.hero::after {

    content: "";

    position: absolute;

    width: 180px;

    height: 180px;

    border-radius: 50%;

    background: rgba(255,255,255,.07);

    bottom: -90px;

    right: -50px;
}


.hero-content {

    position: relative;

    z-index: 2;
}


.hero h1 {

    font-size: 31px;

    font-weight: 800;

    margin-bottom: 8px;
}


.hero p {

    font-size: 15px;

    line-height: 1.9;

    opacity: .94;

    max-width: 700px;
}


/* =====================================================
   CARDS
===================================================== */

.card {

    background: var(--white);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    padding: 25px;

    margin-bottom: 20px;

    box-shadow: var(--shadow);
}


.card-title {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 20px;

    color: var(--text);

    font-size: 19px;

    font-weight: 800;
}


.card-title i {

    width: 40px;

    height: 40px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--turquoise)
        );

    font-size: 17px;
}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 17px;
}


.form-group label {

    display: block;

    margin-bottom: 8px;

    color: var(--text);

    font-size: 13px;

    font-weight: 700;
}


.input-wrapper {

    position: relative;
}


.input-wrapper > i {

    position: absolute;

    right: 14px;

    top: 50%;

    transform: translateY(-50%);

    color: var(--primary);

    z-index: 2;
}


.input-wrapper textarea + * {
    position: relative;
}


input,
select,
textarea {

    width: 100%;

    border: 1px solid var(--border);

    background: #fbfdff;

    color: var(--text);

    border-radius: 13px;

    font-family: "Cairo", sans-serif;

    font-size: 14px;

    outline: none;

    transition: .2s ease;
}


input,
select {

    height: 48px;

    padding: 0 43px 0 13px;
}


textarea {

    min-height: 105px;

    resize: vertical;

    padding: 13px 43px 13px 13px;
}


input:focus,
select:focus,
textarea:focus {

    border-color: var(--primary);

    background: white;

    box-shadow:
        0 0 0 3px rgba(23, 105, 210, .08);
}


/* =====================================================
   ROW
===================================================== */

.row {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 15px;
}


/* =====================================================
   DOCTORS
===================================================== */

.doctors-list {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));

    gap: 15px;
}


.doctor-card {

    border: 1px solid var(--border);

    background: #fbfdff;

    border-radius: 16px;

    padding: 18px;

    cursor: pointer;

    transition: .2s ease;

    position: relative;
}


.doctor-card:hover {

    transform: translateY(-3px);

    border-color: #bcd8f0;

    box-shadow:
        0 10px 25px rgba(23, 105, 210, .08);
}


.doctor-card.selected {

    border: 2px solid var(--primary);

    background:
        linear-gradient(
            135deg,
            #f4f9ff,
            #f0fffb
        );
}


.doctor-radio {

    position: absolute;

    top: 16px;

    left: 16px;

    width: 20px;

    height: 20px;

    border: 2px solid #cbd8e5;

    border-radius: 50%;

    background: white;
}


.doctor-card.selected .doctor-radio {

    border-color: var(--primary);
}


.doctor-card.selected .doctor-radio::after {

    content: "";

    width: 10px;

    height: 10px;

    background: var(--primary);

    border-radius: 50%;

    position: absolute;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);
}


.doctor-top {

    display: flex;

    align-items: center;

    gap: 13px;

    margin-bottom: 12px;
}


.doctor-avatar {

    width: 52px;

    height: 52px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #e8f2ff,
            #e6faf6
        );

    color: var(--primary);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 23px;

    flex-shrink: 0;
}


.doctor-name {

    color: var(--text);

    font-weight: 800;

    font-size: 15px;
}


.doctor-specialty {

    color: var(--turquoise-dark);

    font-size: 12px;

    font-weight: 600;

    margin-top: 2px;
}


.doctor-info {

    display: flex;

    flex-direction: column;

    gap: 6px;

    color: var(--muted);

    font-size: 12px;
}


.doctor-info span {

    display: flex;

    align-items: center;

    gap: 7px;
}


.doctor-info i {

    color: var(--primary);
}


/* =====================================================
   MAIN BUTTON
===================================================== */

.main-btn {

    width: 100%;

    min-height: 51px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--turquoise)
        );

    color: white;

    font-family: "Cairo", sans-serif;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 9px 22px rgba(23, 105, 210, .18);

    transition: .2s ease;
}


.main-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 28px rgba(23, 105, 210, .25);
}


.main-btn:active {

    transform: translateY(0);
}


/* =====================================================
   STATUS
===================================================== */

.status-box {

    display: none;

    margin-top: 17px;

    padding: 15px;

    border-radius: 13px;

    background: #f2f8ff;

    border: 1px solid #d8e9f8;

    color: var(--text);

    font-size: 13px;

    line-height: 1.8;
}


/* =====================================================
   BOOKING NUMBER
===================================================== */

.booking-number {

    margin-top: 15px;

    padding: 18px;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #eef6ff,
            #effcf9
        );

    border: 1px solid #d5eaf1;

    text-align: center;
}


.booking-number strong {

    display: block;

    color: var(--primary);

    font-size: 30px;

    font-weight: 800;

    letter-spacing: 2px;
}


.booking-number span {

    color: var(--muted);

    font-size: 12px;
}


/* =====================================================
   TRACKING BUTTON
===================================================== */

.track-btn {

    margin-top: 12px;

    width: 100%;

    height: 48px;

    border: 1px solid var(--primary);

    border-radius: 13px;

    background: white;

    color: var(--primary);

    font-family: "Cairo", sans-serif;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s ease;
}


.track-btn:hover {

    background: #f2f8ff;

    transform: translateY(-1px);
}


/* =====================================================
   NOTIFICATIONS PANEL
===================================================== */

.patient-notifications-panel {

    display: none;

    position: fixed;

    top: 92px;

    left: 50%;

    transform: translateX(-50%);

    width: min(430px, 92%);

    max-height: 70vh;

    overflow-y: auto;

    background: white;

    border: 1px solid var(--border);

    border-radius: 18px;

    box-shadow:
        0 20px 50px rgba(18, 52, 91, .18);

    z-index: 2000;
}


.patient-notifications-panel.show {

    display: block;
}


.notifications-header {

    padding: 17px;

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-weight: 800;
}


.notifications-list {

    padding: 8px;
}


.notification-item {

    display: flex;

    gap: 12px;

    padding: 13px;

    border-radius: 12px;

    margin-bottom: 5px;

    cursor: pointer;

    transition: .2s ease;
}


.notification-item:hover {

    background: #f4f9fd;
}


.notification-item.unread {

    background: #f0f7ff;
}


.notification-icon {

    width: 38px;

    height: 38px;

    border-radius: 11px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--turquoise)
        );

    flex-shrink: 0;
}


.notification-content {

    flex: 1;
}


.notification-content strong {

    display: block;

    font-size: 13px;

    color: var(--text);

    margin-bottom: 3px;
}


.notification-content p {

    color: var(--muted);

    font-size: 12px;

    line-height: 1.7;
}


.notification-time {

    color: #9aaabd;

    font-size: 10px;

    margin-top: 4px;
}


/* =====================================================
   TOAST
===================================================== */

.patient-toast {

    position: fixed;

    bottom: 25px;

    right: 25px;

    width: min(380px, calc(100% - 30px));

    background: white;

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 15px;

    box-shadow:
        0 15px 40px rgba(18, 52, 91, .18);

    display: none;

    z-index: 3000;
}


.patient-toast.show {

    display: flex;

    align-items: center;

    gap: 12px;
}


.patient-toast-icon {

    width: 42px;

    height: 42px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--turquoise)
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    width: min(1100px, 94%);

    margin: 0 auto 30px;

    padding: 20px;

    text-align: center;

    color: var(--muted);

    font-size: 12px;
}


footer strong {

    color: var(--primary);

    font-weight: 800;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .header-content {

        min-height: 72px;
    }


    .brand-icon {

        width: 46px;

        height: 46px;

        border-radius: 14px;

        font-size: 21px;
    }


    .brand-text strong {

        font-size: 21px;
    }


    .brand-text span {

        font-size: 10px;
    }


    main {

        width: 92%;

        margin-top: 20px;
    }


    .hero {

        padding: 28px 20px;

        border-radius: 21px;
    }


    .hero h1 {

        font-size: 24px;
    }


    .hero p {

        font-size: 13px;
    }


    .card {

        padding: 19px;

        border-radius: 16px;
    }


    .card-title {

        font-size: 17px;
    }


    .row {

        grid-template-columns: 1fr;

        gap: 0;
    }


    .doctors-list {

        grid-template-columns: 1fr;
    }


    .patient-notifications-panel {

        top: 80px;
    }


    .patient-toast {

        right: 15px;

        bottom: 15px;

        width: calc(100% - 30px);
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="header-content">

        <div class="brand">

            <div class="brand-icon">

                <i class="fa-solid fa-heart-pulse"></i>

            </div>


            <div class="brand-text">

                <strong>طبيبك</strong>

                <span>TABIBK • موعدك أسهل</span>

            </div>

        </div>


        <button
            class="notification-btn"
            id="patientNotificationBell"
            onclick="togglePatientNotifications()"
            type="button"
        >

            <i class="fa-regular fa-bell"></i>

            <span
                id="patientNotificationCount"
                class="notification-count"
                style="display:none;"
            >
                0
            </span>

        </button>

    </div>

</header>


<!-- =====================================================
     PATIENT NOTIFICATIONS PANEL
===================================================== -->

<div
    id="patientNotificationsPanel"
    class="patient-notifications-panel"
>

    <div class="notifications-header">

        <span>
            <i class="fa-regular fa-bell"></i>
            الإشعارات
        </span>

        <button
            type="button"
            onclick="closePatientNotifications()"
            style="
                border:none;
                background:none;
                cursor:pointer;
                color:#71839a;
                font-size:18px;
            "
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

    </div>


    <div
        id="patientNotificationsList"
        class="notifications-list"
    ></div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <h1>
                مرحباً بك في طبيبك 🩺
            </h1>

            <p>
                احجز موعدك الطبي بسهولة،
                تابع طلبك واستقبل إشعاراتك
                في مكان واحد.
            </p>

        </div>

    </section>



    <!-- =================================================
         PATIENT INFORMATION
    ================================================= -->

    <section class="card">

        <div class="card-title">

            <div class="card-title">

                <i class="fa-solid fa-user"></i>

                معلومات المريض

            </div>

        </div>


        <div class="row">

            <div class="form-group">

                <label for="patientName">
                    الاسم الكامل
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-user"></i>

                    <input
                        id="patientName"
                        type="text"
                        placeholder="أدخل اسمك الكامل"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="patientPhone">
                    رقم الهاتف
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        id="patientPhone"
                        type="tel"
                        placeholder="أدخل رقم الهاتف"
                    >

                </div>

            </div>

        </div>

    </section>



    <!-- =================================================
         SEARCH DOCTORS
    ================================================= -->

    <section class="card">

        <div class="card-title">

            <i class="fa-solid fa-magnifying-glass"></i>

            البحث عن طبيب

        </div>


        <div class="row">

            <div class="form-group">

                <label for="wilayaSelect">
                    الولاية
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-location-dot"></i>

                    <select id="wilayaSelect">

                        <option value="">
                            اختر الولاية
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="municipalitySelect">
                    البلدية
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-city"></i>

                    <select id="municipalitySelect">

                        <option value="">
                            اختر البلدية
                        </option>

                    </select>

                </div>

            </div>

        </div>


        <div class="form-group">

            <label for="specialtySelect">
                التخصص
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-stethoscope"></i>

                <select id="specialtySelect">

                    <option value="">
                        جميع التخصصات
                    </option>

                </select>

            </div>

        </div>

    </section>



    <!-- =================================================
         DOCTORS
    ================================================= -->

    <section class="card">

        <div class="card-title">

            <i class="fa-solid fa-user-doctor"></i>

            الأطباء المتاحون

        </div>


        <div
            id="doctorsList"
            class="doctors-list"
        >

            <!-- JavaScript loads doctors here -->

        </div>

    </section>



    <!-- =================================================
         APPOINTMENT
    ================================================= -->

    <section class="card">

        <div class="card-title">

            <i class="fa-solid fa-calendar-check"></i>

            حجز موعد

        </div>


        <div class="form-group">

            <label for="reason">
                سبب الزيارة
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-comment-medical"></i>

                <textarea
                    id="reason"
                    placeholder="اكتب سبب الزيارة"
                ></textarea>

            </div>

        </div>


        <div class="row">

            <div class="form-group">

                <label for="appointmentDate">
                    تاريخ الموعد
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-calendar"></i>

                    <input
                        id="appointmentDate"
                        type="date"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="appointmentTime">
                    وقت الموعد
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-clock"></i>

                    <input
                        id="appointmentTime"
                        type="time"
                    >

                </div>

            </div>

        </div>


        <button
            id="createAppointment"
            class="main-btn"
            type="button"
        >

            <i class="fa-solid fa-calendar-plus"></i>

            تأكيد حجز الموعد

        </button>


        <div
            id="statusBox"
            class="status-box"
        ></div>


        <div
            id="bookingNumber"
            class="booking-number"
            style="display:none;"
        >

            <span>
                رقم الحجز الخاص بك
            </span>

            <strong id="bookingNumberValue">
                —
            </strong>

        </div>

    </section>



    <!-- =================================================
         TRACK APPOINTMENT
    ================================================= -->

    <section class="card">

        <div class="card-title">

<script>

/* =========================================
   PATIENT NOTIFICATIONS
========================================= */

function getPatientPhone() {

    const phone =
        document.getElementById(
            "patientPhone"
        );

    return phone
        ? phone.value.trim()
        : "";
}


function formatNotificationTime(date) {

    try {

        return new Date(date)
            .toLocaleString(
                "ar-DZ",
                {
                    dateStyle: "short",
                    timeStyle: "short"
                }
            );

    } catch {

        return "";

    }

}


function getNotificationIcon(type) {

    if (type === "success") {

        return "fa-circle-check";

    }

    if (type === "warning") {

        return "fa-triangle-exclamation";

    }

    if (type === "appointment") {

        return "fa-calendar-check";

    }

    if (type === "doctor") {

        return "fa-user-doctor";

    }

    return "fa-bell";

}


async function loadPatientNotifications() {

    const phone =
        getPatientPhone();

    if (!phone) return;

    try {

        const response =
            await fetch(
                "/api/notifications?phone=" +
                encodeURIComponent(phone)
            );

        if (!response.ok) return;

        const data =
            await response.json();

        const notifications =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.notifications)
                        ? data.notifications
                        : []
                );

        renderPatientNotifications(
            notifications
        );

        updatePatientNotificationCount(
            notifications
        );

    } catch (error) {

        console.error(
            "Notifications error:",
            error
        );

    }

}


function renderPatientNotifications(
    notifications
) {

    const list =
        document.getElementById(
            "patientNotificationsList"
        );

    if (!list) return;


    if (!notifications.length) {

        list.innerHTML = `

            <div style="
                padding:30px 15px;
                text-align:center;
                color:#71839a;
                font-size:13px;
            ">

                <i
                    class="fa-regular fa-bell-slash"
                    style="
                        font-size:28px;
                        margin-bottom:10px;
                    "
                ></i>

                <div>
                    لا توجد إشعارات حالياً
                </div>

            </div>

        `;

        return;

    }


    list.innerHTML =
        notifications
            .map(
                notification => {

                    const unread =
                        notification.read === false ||
                        notification.isRead === false;


                    return `

                        <div
                            class="
                                notification-item
                                ${unread ? "unread" : ""}
                            "
                            onclick="
                                markPatientNotificationAsRead(
                                    '${notification.id}'
                                )
                            "
                        >

                            <div class="notification-icon">

                                <i
                                    class="
                                        fa-solid
                                        ${getNotificationIcon(
                                            notification.type
                                        )}
                                    "
                                ></i>

                            </div>


                            <div class="notification-content">

                                <strong>
                                    ${escapeNotificationHTML(
                                        notification.title ||
                                        "إشعار"
                                    )}
                                </strong>


                                <p>
                                    ${escapeNotificationHTML(
                                        notification.message ||
                                        ""
                                    )}
                                </p>


                                <div class="notification-time">

                                    ${formatNotificationTime(
                                        notification.createdAt ||
                                        notification.created_at ||
                                        new Date()
                                    )}

                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


function escapeNotificationHTML(
    text
) {

    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function updatePatientNotificationCount(
    notifications
) {

    const count =
        document.getElementById(
            "patientNotificationCount"
        );

    if (!count) return;


    const unread =
        notifications.filter(
            item =>
                item.read === false ||
                item.isRead === false
        ).length;


    if (unread > 0) {

        count.textContent =
            unread > 99
                ? "99+"
                : unread;

        count.style.display =
            "flex";

    } else {

        count.style.display =
            "none";

    }

}


function togglePatientNotifications() {

    const panel =
        document.getElementById(
            "patientNotificationsPanel"
        );

    if (!panel) return;

    panel.classList.toggle("show");

    if (panel.classList.contains("show")) {

        loadPatientNotifications();

    }

}


function closePatientNotifications() {

    const panel =
        document.getElementById(
            "patientNotificationsPanel"
        );

    if (!panel) return;

    panel.classList.remove("show");

}


async function markPatientNotificationAsRead(
    id
) {

    try {

        await fetch(
            "/api/notifications/" +
            encodeURIComponent(id) +
            "/read",
            {
                method: "PATCH"
            }
        );

        loadPatientNotifications();

    } catch (error) {

        console.error(error);

    }

}


async function checkForNewPatientNotifications() {

    await loadPatientNotifications();

}


function startPatientNotificationPolling() {

    loadPatientNotifications();

    setInterval(
        checkForNewPatientNotifications,
        10000
    );

}


function showPatientNotificationToast(
    message
) {

    const toast =
        document.getElementById(
            "patientNotificationToast"
        );

    const text =
        document.getElementById(
            "patientNotificationToastText"
        );

    if (!toast || !text) return;


    text.textContent =
        message || "لديك إشعار جديد";

    toast.classList.add("show");


    setTimeout(
        hidePatientNotificationToast,
        5000
    );


    playPatientNotificationSound();

}


function hidePatientNotificationToast() {

    const toast =
        document.getElementById(
            "patientNotificationToast"
        );

    if (!toast) return;

    toast.classList.remove(
        "show"
    );

}


function playPatientNotificationSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;


        const context =
            new AudioContext();

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();


        oscillator.connect(gain);

        gain.connect(
            context.destination
        );


        oscillator.frequency.value =
            880;

        gain.gain.setValueAtTime(
            0.05,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.5
        );


        oscillator.start();

        oscillator.stop(
            context.currentTime + 0.5
        );

    } catch (error) {

        console.log(
            "Sound unavailable"
        );

    }

}



/* =========================================
   API
========================================= */

const API = "";

let selectedDoctorId = null;



/* =========================================
   LOAD WILAYAS
========================================= */

async function loadWilayas() {

    const select =
        document.getElementById(
            "wilayaSelect"
        );

    if (!select) return;


    try {

        const response =
            await fetch(
                API + "/api/wilayas"
            );

        const wilayas =
            await response.json();


        select.innerHTML =
            `<option value="">
                اختر الولاية
            </option>`;


        wilayas.forEach(
            wilaya => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    wilaya.id ??
                    wilaya.name;

                option.textContent =
                    wilaya.name;

                option.dataset.id =
                    wilaya.id ??
                    "";

                select.appendChild(
                    option
                );

            }
        );

    } catch (error) {

        console.error(
            "Wilayas error:",
            error
        );

    }

}



/* =========================================
   LOAD MUNICIPALITIES
========================================= */

async function loadMunicipalities() {

    const wilayaSelect =
        document.getElementById("wilayaSelect");

    const municipalitySelect =
        document.getElementById("municipalitySelect");

    if (!wilayaSelect || !municipalitySelect) {
        return;
    }

    // إعادة ضبط قائمة البلديات
    municipalitySelect.innerHTML =
        `<option value="">اختر البلدية</option>`;

    const selectedValue =
        String(wilayaSelect.value || "").trim();

    // إذا لم يتم اختيار ولاية
    if (!selectedValue) {
        municipalitySelect.disabled = true;
        loadDoctors();
        return;
    }

    try {

        municipalitySelect.disabled = true;

        const response =
            await fetch(API + "/api/wilayas", {
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        // السيرفر يرجع Array مباشرة
        const wilayas =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.wilayas)
                        ? data.wilayas
                        : []
                );

        console.log(
            "TABIBK - Wilayas:",
            wilayas
        );

        // البحث عن الولاية المختارة
        const selected =
            wilayas.find(wilaya => {

                const id =
                    String(
                        wilaya.id ??
                        wilaya.code ??
                        ""
                    ).trim();

                const name =
                    String(
                        wilaya.name ??
                        ""
                    ).trim();

                return (
                    id === selectedValue ||
                    name === selectedValue
                );

            });

        if (!selected) {

            console.error(
                "TABIBK: Wilaya not found:",
                selectedValue,
                wilayas
            );

            municipalitySelect.disabled = false;

            loadDoctors();

            return;
        }

        // دعم municipalities أو communes
        const municipalities =
            Array.isArray(selected.municipalities)
                ? selected.municipalities
                : (
                    Array.isArray(selected.communes)
                        ? selected.communes
                        : []
                );

        console.log(
            "TABIBK - Selected Wilaya:",
            selected
        );

        console.log(
            "TABIBK - Municipalities:",
            municipalities
        );

        // إضافة البلديات
        municipalities.forEach(
            municipality => {

                const option =
                    document.createElement("option");

                if (
                    typeof municipality === "object" &&
                    municipality !== null
                ) {

                    const value =
                        municipality.id ??
                        municipality.code ??
                        municipality.name ??
                        "";

                    const text =
                        municipality.name ??
                        municipality.label ??
                        String(value);

                    option.value =
                        String(value);

                    option.textContent =
                        String(text);

                } else {

                    option.value =
                        String(municipality);

                    option.textContent =
                        String(municipality);

                }

                municipalitySelect.appendChild(
                    option
                );

            }
        );

        municipalitySelect.disabled = false;

        // إذا توجد بلديات
        if (municipalities.length > 0) {

            municipalitySelect.value = "";

        } else {

            console.warn(
                "TABIBK: لا توجد بلديات لهذه الولاية",
                selected
            );

        }

        loadDoctors();

    } catch (error) {

        console.error(
            "TABIBK Municipalities Error:",
            error
        );

        municipalitySelect.innerHTML =
            `<option value="">
                تعذر تحميل البلديات
            </option>`;

        municipalitySelect.disabled = false;

        loadDoctors();
    }

}
/* =========================================
   LOAD DOCTORS
========================================= */

async function loadDoctors() {

    const list =
        document.getElementById(
            "doctorsList"
        );

    if (!list) return;


    const wilaya =
        document.getElementById(
            "wilayaSelect"
        )?.value || "";


    const municipality =
        document.getElementById(
            "municipalitySelect"
        )?.value || "";


    const specialty =
        document.getElementById(
            "specialtySelect"
        )?.value || "";


    list.innerHTML = `

        <div style="
            grid-column:1/-1;
            text-align:center;
            padding:25px;
            color:#71839a;
        ">

            <i
                class="fa-solid fa-spinner fa-spin"
                style="font-size:22px;"
            ></i>

            <div style="margin-top:8px;">
                جاري تحميل الأطباء...
            </div>

        </div>

    `;


    try {

        const params =
            new URLSearchParams();


        if (wilaya)
            params.set(
                "wilaya",
                wilaya
            );


        if (municipality)
            params.set(
                "municipality",
                municipality
            );


        if (specialty)
            params.set(
                "specialty",
                specialty
            );


        const response =
            await fetch(
                API +
                "/api/doctors?" +
                params.toString()
            );


        const doctors =
            await response.json();


        list.innerHTML = "";


        if (!doctors.length) {

            list.innerHTML = `

                <div style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:30px;
                    color:#71839a;
                ">

                    <i
                        class="fa-solid fa-user-doctor"
                        style="
                            font-size:30px;
                            color:#18b89c;
                            margin-bottom:10px;
                        "
                    ></i>

                    <div>
                        لا يوجد أطباء متاحون حالياً
                    </div>

                </div>

            `;

            return;

        }


        doctors.forEach(
            doctor => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "doctor-card";


                card.dataset.id =
                    doctor.id;


                card.innerHTML = `

                    <div class="doctor-radio"></div>


                    <div class="doctor-top">

                        <div class="doctor-avatar">

                            <i
                                class="fa-solid fa-user-doctor"
                            ></i>

                        </div>


                        <div>

                            <div class="doctor-name">

                                ${doctor.name || ""}

                            </div>


                            <div class="doctor-specialty">

                                ${doctor.specialty || "طبيب"}

                            </div>

                        </div>

                    </div>


                    <div class="doctor-info">

                        <span>

                            <i class="fa-solid fa-location-dot"></i>

                            ${doctor.wilaya || ""}

                            ${
                                doctor.municipality
                                    ? " - " + doctor.municipality
                                    : ""
                            }

                        </span>


                        <span>

                            <i class="fa-solid fa-clock"></i>

                            مدة الكشف:
                            ${doctor.duration || 15}
                            دقيقة

                        </span>

                    </div>

                `;


                card.onclick =
                    () => selectDoctor(
                        doctor.id,
                        card
                    );


                list.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "Doctors error:",
            error
        );


        list.innerHTML = `

            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:25px;
                color:#ef4444;
            ">

                تعذر تحميل قائمة الأطباء

            </div>

        `;

    }

}



/* =========================================
   SELECT DOCTOR
========================================= */

function selectDoctor(
    doctorId,
    card
) {

    selectedDoctorId =
        doctorId;


    document
        .querySelectorAll(
            ".doctor-card"
        )
        .forEach(
            item =>
                item.classList.remove(
                    "selected"
                )
        );


    if (card) {

        card.classList.add(
            "selected"
        );

    }

}



/* =========================================
   CREATE APPOINTMENT
========================================= */

async function createAppointment() {

    const patientName =
        document.getElementById(
            "patientName"
        )?.value.trim();


    const patientPhone =
        document.getElementById(
            "patientPhone"
        )?.value.trim();


    const reason =
        document.getElementById(
            "reason"
        )?.value.trim();


    const date =
        document.getElementById(
            "appointmentDate"
        )?.value;


    const time =
        document.getElementById(
            "appointmentTime"
        )?.value;


    const statusBox =
        document.getElementById(
            "statusBox"
        );


    if (!patientName) {

        alert(
            "أدخل اسم المريض"
        );

        return;

    }


    if (!patientPhone) {

        alert(
            "أدخل رقم الهاتف"
        );

        return;

    }


    if (!selectedDoctorId) {

        alert(
            "اختر الطبيب أولاً"
        );

        return;

    }


    if (!date || !time) {

        alert(
            "اختر تاريخ ووقت الموعد"
        );

        return;

    }


    try {

        statusBox.style.display =
            "block";

        statusBox.innerHTML =
            "جاري إرسال طلب الحجز...";


        const response =
            await fetch(
                API + "/api/appointments",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        patientName,

                        patientPhone,

                        doctorId:
                            selectedDoctorId,

                        reason,

                        date,

                        time

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "فشل إنشاء الموعد"
            );

        }


        statusBox.innerHTML = `

            <i
                class="fa-solid fa-circle-check"
                style="
                    color:#18b89c;
                    margin-left:5px;
                "
            ></i>

            تم إرسال طلب الحجز بنجاح.
            في انتظار تأكيد الطبيب.

        `;


        const bookingBox =
            document.getElementById(
                "bookingNumber"
            );


        const bookingValue =
            document.getElementById(
                "bookingNumberValue"
            );


        if (
            bookingBox &&
            bookingValue &&
            data.bookingNumber
        ) {

            bookingValue.textContent =
                data.bookingNumber;

            bookingBox.style.display =
                "block";

        }


        loadPatientNotifications();


    } catch (error) {

        console.error(
            "Create appointment error:",
            error
        );


        statusBox.style.display =
            "block";


        statusBox.innerHTML = `

            <span style="color:#ef4444;">

                <i
                    class="fa-solid fa-circle-exclamation"
                ></i>

                ${error.message}

            </span>

        `;

    }

}



/* =========================================
   TRACK APPOINTMENT
========================================= */

async function trackAppointment() {

    const bookingNumber =
        document.getElementById(
            "trackingNumber"
        ).value.trim();


    const result =
        document.getElementById(
            "trackingResult"
        );


    if (!bookingNumber) {

        alert(
            "أدخل رقم الحجز أولاً"
        );

        return;

    }


    try {

        result.style.display =
            "block";

        result.innerHTML =
            "جاري البحث عن الحجز...";


        const response =
            await fetch(
                API +
                "/api/appointments/" +
                encodeURIComponent(
                    bookingNumber
                )
            );


        const appointment =
            await response.json();


        if (!response.ok) {

            throw new Error(
                appointment.message ||
                "لم يتم العثور على الحجز"
            );

        }


        result.innerHTML = `

            <div>

                <strong>
                    حالة الحجز:
                </strong>

                ${appointment.status || "غير محددة"}

            </div>


            ${
                appointment.doctorName
                    ? `
                        <div>
                            <strong>
                                الطبيب:
                            </strong>
                            ${appointment.doctorName}
                        </div>
                    `
                    : ""
            }


            ${
                appointment.date
                    ? `
                        <div>
                            <strong>
                                التاريخ:
                            </strong>
                            ${appointment.date}
                        </div>
                    `
                    : ""
            }


            ${
                appointment.time
                    ? `
                        <div>
                            <strong>
                                الوقت:
                            </strong>
                            ${appointment.time}
                        </div>
                    `
                    : ""
            }

        `;


    } catch (error) {

        console.error(
            "Track appointment error:",
            error
        );


        result.style.display =
            "block";


        result.innerHTML = `

            <span style="color:#ef4444;">

                <i
                    class="fa-solid fa-circle-exclamation"
                ></i>

                ${error.message}

            </span>

        `;

    }

}



/* =========================================
   EVENT LISTENERS
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadWilayas();


        const wilayaSelect =
            document.getElementById(
                "wilayaSelect"
            );


        const municipalitySelect =
            document.getElementById(
                "municipalitySelect"
            );


        const specialtySelect =
            document.getElementById(
                "specialtySelect"
            );


        const createButton =
            document.getElementById(
                "createAppointment"
            );


        const trackButton =
            document.getElementById(
                "trackAppointment"
            );


        if (wilayaSelect) {

            wilayaSelect.addEventListener(
                "change",
                loadMunicipalities
            );

        }


        if (municipalitySelect) {

            municipalitySelect.addEventListener(
                "change",
                loadDoctors
            );

        }


        if (specialtySelect) {

            specialtySelect.addEventListener(
                "change",
                loadDoctors
            );

        }


        if (createButton) {

            createButton.addEventListener(
                "click",
                createAppointment
            );

        }


        if (trackButton) {

            trackButton.addEventListener(
                "click",
                trackAppointment
            );

        }


        startPatientNotificationPolling();

    }
);


</script>
