<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#180621">

    <title>طبيبك | TABIBK</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        /* =========================================================
           TABIBK PREMIUM HOME
           ========================================================= */

        :root {

            --purple-950: #100218;
            --purple-900: #180621;
            --purple-800: #24092f;
            --purple-700: #350d48;
            --purple-600: #4d1765;
            --purple-500: #6f278e;
            --purple-400: #984bb9;

            --gold: #c99b35;
            --gold-light: #f1d77b;
            --gold-bright: #fff0a5;

            --white: #ffffff;
            --text-soft: #eee7f1;

            --patient: #8f54cf;
            --doctor: #7042bd;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family: "Cairo", sans-serif;

            color: var(--white);

            overflow-x: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(17, 3, 25, .70),
                    rgba(32, 7, 45, .88)
                ),

                url("https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=2000&q=85")
                center center / cover fixed no-repeat;

            background-color: var(--purple-950);
        }


        /* =========================================================
           BACKGROUND OVERLAY
           ========================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    circle at 50% 12%,
                    rgba(155, 67, 202, .38),
                    transparent 34%
                ),

                radial-gradient(
                    circle at 5% 55%,
                    rgba(110, 38, 154, .30),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 95% 70%,
                    rgba(123, 45, 168, .28),
                    transparent 34%
                ),

                linear-gradient(
                    180deg,
                    rgba(25, 5, 34, .50),
                    rgba(14, 2, 21, .84)
                );
        }


        /* =========================================================
           BACKGROUND MEDICAL DECORATION
           ========================================================= */

        .medical-background {

            position: fixed;

            inset: 0;

            z-index: 0;

            pointer-events: none;

            overflow: hidden;
        }


        .medical-background::before {

            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            top: 12%;

            left: -210px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(176, 89, 220, .30),
                    transparent 70%
                );

            filter: blur(15px);
        }


        .medical-background::after {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            right: -250px;

            bottom: 5%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(124, 53, 174, .28),
                    transparent 70%
                );

            filter: blur(18px);
        }


        .background-ecg {

            position: absolute;

            width: 850px;

            left: 50%;

            top: 48%;

            transform:
                translate(-50%, -50%)
                rotate(-4deg);

            opacity: .055;
        }


        .background-ecg path {

            fill: none;

            stroke: #f2d87c;

            stroke-width: 4;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =========================================================
           PAGE
           ========================================================= */

        .page {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1080px;

            margin: auto;

            padding:
                22px 24px
                40px;
        }


        /* =========================================================
           ADMIN MINI BUTTON
           ========================================================= */

        .admin-area {

            display: flex;

            justify-content: flex-start;

            margin-bottom: 4px;
        }


        .admin-button {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            padding:
                8px 15px;

            color: #f8effb;

            text-decoration: none;

            border-radius: 30px;

            border:
                1px solid
                rgba(239, 212, 119, .48);

            background:
                rgba(25, 6, 35, .64);

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 8px 25px rgba(0,0,0,.20);

            transition: .25s ease;
        }


        .admin-button:hover {

            transform: translateY(-2px);

            border-color:
                rgba(239, 212, 119, .85);

            background:
                rgba(50, 13, 66, .82);
        }


        .admin-button i {

            color: var(--gold-light);

            font-size: 13px;
        }


        .admin-button span {

            font-size: 11px;

            font-weight: 700;
        }


        /* =========================================================
           BRAND
           ========================================================= */

        .brand {

            text-align: center;

            margin-top: -5px;

            margin-bottom: 34px;
        }


        /* =========================================================
           PROFESSIONAL HEART LOGO
           ========================================================= */

        .logo {

            position: relative;

            width: 150px;
            height: 150px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .logo-ring {

            position: absolute;

            inset: 7px;

            border-radius: 50%;

            border:
                1px solid
                rgba(239, 212, 119, .50);

            box-shadow:
                0 0 30px
                rgba(239, 212, 119, .13);
        }


        .logo-ring::before {

            content: "";

            position: absolute;

            inset: 8px;

            border-radius: 50%;

            border:
                1px dashed
                rgba(239, 212, 119, .20);
        }


        .heart-shape {

            position: relative;

            width: 72px;
            height: 72px;

            transform:
                rotate(-45deg);

            border-radius:
                13px 13px 18px 13px;

            background:
                linear-gradient(
                    145deg,
                    #ffe99b 0%,
                    #e3b84f 48%,
                    #a97520 100%
                );

            box-shadow:

                0 0 34px
                rgba(239, 212, 119, .32),

                inset
                4px 5px 9px
                rgba(255,255,255,.38),

                inset
                -4px -4px 8px
                rgba(115,70,10,.18);
        }


        .heart-shape::before,
        .heart-shape::after {

            content: "";

            position: absolute;

            width: 72px;
            height: 72px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffe99b 0%,
                    #e3b84f 48%,
                    #a97520 100%
                );
        }


        .heart-shape::before {

            top: -36px;

            left: 0;
        }


        .heart-shape::after {

            left: 36px;

            top: 0;
        }


        .logo-ecg {

            position: absolute;

            z-index: 5;

            width: 108px;

            height: 50px;

            top: 51px;

            left: 21px;
        }


        .logo-ecg path {

            fill: none;

            stroke: #fff;

            stroke-width: 4;

            stroke-linecap: round;

            stroke-linejoin: round;

            filter:
                drop-shadow(
                    0 0 4px
                    rgba(255,255,255,.95)
                );
        }


        .brand-name {

            margin-top: 2px;

            font-size:
                clamp(48px, 7vw, 70px);

            line-height: .95;

            font-weight: 900;

            letter-spacing: -2px;

            text-shadow:
                0 6px 24px
                rgba(0,0,0,.34);
        }


        .brand-en {

            margin-top: 10px;

            color: var(--gold-light);

            font-size: 19px;

            font-weight: 700;

            letter-spacing: 9px;

            padding-left: 9px;
        }


        .tagline {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 14px;

            margin-top: 12px;

            color: var(--text-soft);

            font-size: 14px;

            font-weight: 600;
        }


        .tagline::before,
        .tagline::after {

            content: "";

            width: 55px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold-light)
                );
        }


        .tagline::after {

            background:
                linear-gradient(
                    90deg,
                    var(--gold-light),
                    transparent
                );
        }


        /* =========================================================
           LOGIN AREA
           ========================================================= */

        .login-grid {

            width: 100%;

            max-width: 820px;

            margin: auto;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 22px;
        }


        /* =========================================================
           LOGIN CARD
           ========================================================= */

        .login-card {

            position: relative;

            height: 430px;

            min-width: 0;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            padding:
                20px;

            color: white;

            text-decoration: none;

            border-radius: 25px;

            border:
                1px solid
                rgba(232, 199, 247, .40);

            background:

                linear-gradient(
                    180deg,
                    rgba(107, 47, 137, .28),
                    rgba(27, 7, 38, .84)
                );

            backdrop-filter: blur(14px);

            -webkit-backdrop-filter: blur(14px);

            box-shadow:

                0 24px 55px
                rgba(0,0,0,.32),

                inset
                0 1px 0
                rgba(255,255,255,.10);

            transition:
                transform .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }


        .login-card:hover {

            transform: translateY(-6px);

            border-color:
                rgba(239,212,119,.72);

            box-shadow:

                0 30px 65px
                rgba(0,0,0,.43),

                0 0 35px
                rgba(148,76,190,.18);
        }


        .login-card::before {

            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            top: -145px;

            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(188, 106, 229, .30),
                    transparent 68%
                );

            pointer-events: none;
        }


        .login-card::after {

            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: 0;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold-light),
                    transparent
                );
        }


        /* =========================================================
           AVATAR
           ========================================================= */

        .avatar-area {

            position: absolute;

            top: 8px;

            left: 0;
            right: 0;

            height: 265px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .avatar-glow {

            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(177, 91, 221, .30),
                    transparent 68%
                );
        }


        .avatar-ring {

            position: relative;

            z-index: 2;

            width: 190px;
            height: 190px;

            padding: 7px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    rgba(239,212,119,.92),
                    rgba(157,104,30,.75)
                );

            box-shadow:

                0 20px 40px
                rgba(0,0,0,.34),

                0 0 28px
                rgba(239,212,119,.16);
        }


        .avatar-ring::before {

            content: "";

            position: absolute;

            inset: 3px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.45);
        }


        .avatar {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #7e4aa3,
                    #321040
                );

            border:
                4px solid
                rgba(30,7,42,.80);
        }


        .avatar-badge {

            position: absolute;

            z-index: 5;

            bottom: 1px;

            left: 50%;

            transform: translateX(-50%);

            width: 49px;
            height: 49px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    #a65bd9,
                    #57228b
                );

            border:
                2px solid
                rgba(255,255,255,.35);

            box-shadow:
                0 7px 20px
                rgba(0,0,0,.30);
        }


        .avatar-badge i {

            font-size: 18px;
        }


        /* =========================================================
           CARD CONTENT
           ========================================================= */

        .card-content {

            position: relative;

            z-index: 6;

            text-align: center;
        }


        .card-title {

            font-size: 27px;

            font-weight: 900;

            margin-bottom: 5px;
        }


        .card-description {

            min-height: 48px;

            color: #e9dfee;

            font-size: 12px;

            line-height: 1.8;

            margin-bottom: 14px;
        }


        .card-button {

            height: 50px;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            border-radius: 28px;

            color: white;

            font-family: inherit;

            font-size: 13px;

            font-weight: 800;

            background:
                linear-gradient(
                    100deg,
                    #63268d,
                    #9347bf
                );

            border:
                1px solid
                rgba(236,200,255,.40);

            box-shadow:

                0 8px 24px
                rgba(0,0,0,.25),

                inset
                0 1px 0
                rgba(255,255,255,.16);
        }


        .login-card:hover .card-button {

            background:
                linear-gradient(
                    100deg,
                    #7835a5,
                    #a656cf
                );
        }


        /* =========================================================
           SMALL FEATURES
           ========================================================= */

        .features {

            max-width: 730px;

            margin:
                30px auto
                0;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .feature {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            color: #e9dfea;

            font-size: 12px;
        }


        .feature + .feature {

            border-right:
                1px solid
                rgba(239,212,119,.30);
        }


        .feature i {

            color: var(--gold-light);

            font-size: 18px;
        }


        /* =========================================================
           FOOTER
           ========================================================= */

        .footer {

            text-align: center;

            margin-top: 34px;
        }


        .footer-brand {

            color: var(--gold-light);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 6px;
        }


        .footer-text {

            margin-top: 5px;

            color: #bba9c2;

            font-size: 9px;
        }


        /* =========================================================
           TABLET
           ========================================================= */

        @media (max-width: 800px) {

            .page {

                padding:
                    18px 15px
                    30px;
            }


            .login-grid {

                gap: 14px;

                max-width: 720px;
            }


            .login-card {

                height: 400px;

                padding:
                    17px;
            }


            .avatar-area {

                height: 245px;
            }


            .avatar-ring {

                width: 165px;
                height: 165px;
            }


            .card-title {

                font-size: 24px;
            }


            .card-description {

                font-size: 11px;
            }
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {

            .page {

                padding:
                    10px 8px
                    25px;
            }


            /* ADMIN */

            .admin-area {

                justify-content: flex-start;

                margin-bottom: 2px;
            }


            .admin-button {

                padding:
                    6px 11px;

                gap: 7px;
            }


            .admin-button i {

                font-size: 11px;
            }


            .admin-button span {

                font-size: 9px;
            }


            /* LOGO */

            .brand {

                margin-bottom: 22px;
            }


            .logo {

                width: 118px;
                height: 118px;
            }


            .logo-ring {

                inset: 4px;
            }


            .heart-shape {

                width: 59px;
                height: 59px;

                border-radius: 11px;
            }


            .heart-shape::before,
            .heart-shape::after {

                width: 59px;
                height: 59px;
            }


            .heart-shape::before {

                top: -29px;
            }


            .heart-shape::after {

                left: 29px;
            }


            .logo-ecg {

                width: 88px;

                height: 42px;

                top: 39px;

                left: 15px;
            }


            .brand-name {

                font-size: 43px;

                margin-top: 0;
            }


            .brand-en {

                font-size: 14px;

                letter-spacing: 7px;

                padding-left: 7px;

                margin-top: 7px;
            }


            .tagline {

                margin-top: 8px;

                gap: 7px;

                font-size: 9px;
            }


            .tagline::before,
            .tagline::after {

                width: 25px;
            }


            /* =====================================================
               KEEP BOTH CARDS SIDE BY SIDE
               ===================================================== */

            .login-grid {

                grid-template-columns:
                    minmax(0, 1fr)
                    minmax(0, 1fr);

                gap: 7px;

                width: 100%;
            }


            .login-card {

                height: 335px;

                padding:
                    10px 8px
                    11px;

                border-radius: 17px;
            }


            .avatar-area {

                top: 1px;

                height: 200px;
            }


            .avatar-glow {

                width: 165px;
                height: 165px;
            }


            .avatar-ring {

                width: 122px;
                height: 122px;

                padding: 5px;
            }


            .avatar {

                border-width: 3px;
            }


            .avatar-badge {

                width: 35px;
                height: 35px;

                bottom: -1px;
            }


            .avatar-badge i {

                font-size: 12px;
            }


            .card-title {

                font-size: 19px;

                margin-bottom: 3px;
            }


            .card-description {

                min-height: 45px;

                font-size: 8px;

                line-height: 1.7;

                margin-bottom: 9px;
            }


            .card-button {

                height: 39px;

                font-size: 8px;

                gap: 6px;
            }


            .card-button i {

                font-size: 8px;
            }


            /* FEATURES */

            .features {

                margin-top: 20px;
            }


            .feature {

                font-size: 7px;

                gap: 4px;
            }


            .feature i {

                font-size: 13px;
            }


            /* FOOTER */

            .footer {

                margin-top: 24px;
            }


            .footer-brand {

                font-size: 8px;

                letter-spacing: 4px;
            }


            .footer-text {

                font-size: 7px;
            }
        }


        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 360px) {

            .login-grid {

                gap: 5px;
            }


            .login-card {

                height: 315px;

                padding:
                    8px 6px
                    9px;
            }


            .avatar-area {

                height: 185px;
            }


            .avatar-ring {

                width: 108px;
                height: 108px;
            }


            .avatar-badge {

                width: 32px;
                height: 32px;
            }


            .card-title {

                font-size: 17px;
            }


            .card-description {

                font-size: 7px;
            }


            .card-button {

                height: 36px;

                font-size: 7px;
            }


            .brand-name {

                font-size: 39px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         MEDICAL BACKGROUND
         ========================================================= -->

    <div class="medical-background">

        <svg
            class="background-ecg"
            viewBox="0 0 1000 180"
            preserveAspectRatio="none"
        >

            <path
                d="
                    M0 95
                    H145
                    L175 95
                    L202 42
                    L230 145
                    L258 95
                    H390
                    L420 95
                    L445 58
                    L472 120
                    L500 95
                    H630
                    L655 95
                    L682 45
                    L710 140
                    L738 95
                    H1000
                "
            />

        </svg>

    </div>



    <!-- =========================================================
         PAGE
         ========================================================= -->

    <main class="page">


        <!-- =====================================================
             ADMIN
             ===================================================== -->

        <div class="admin-area">

            <a
                href="/admin.html"
                class="admin-button"
            >

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    الإدارة
                </span>

                <i class="fa-solid fa-arrow-left"></i>

            </a>

        </div>



        <!-- =====================================================
             BRAND
             ===================================================== -->

        <section class="brand">


            <div class="logo">

                <div class="logo-ring"></div>

                <div class="heart-shape"></div>


                <svg
                    class="logo-ecg"
                    viewBox="0 0 150 60"
                >

                    <path
                        d="
                            M2 31
                            H30
                            L43 31
                            L55 8
                            L68 51
                            L80 31
                            H103
                            L113 31
                            L123 20
                            L133 41
                            L142 31
                            H148
                        "
                    />

                </svg>

            </div>


            <div class="brand-name">
                طبيبك
            </div>


            <div class="brand-en">
                TABIBK
            </div>


            <div class="tagline">
                رعايتك الصحية .. أولويتنا
            </div>

        </section>



        <!-- =====================================================
             LOGIN CARDS
             ===================================================== -->

        <section class="login-grid">


            <!-- =================================================
                 PATIENT
                 ================================================= -->

            <a
                href="/patient.html"
                class="login-card"
            >

                <div class="avatar-area">

                    <div class="avatar-glow"></div>


                    <div class="avatar-ring">

                        <img
                            class="avatar"
                            src="/images/patient.png"
                            alt="المريض"
                            onerror="
                                this.style.display='none';
                                this.parentElement.style.background='linear-gradient(145deg,#8f54cf,#321040)';
                            "
                        >

                    </div>


                    <div class="avatar-badge">

                        <i class="fa-solid fa-user"></i>

                    </div>

                </div>


                <div class="card-content">

                    <div class="card-title">
                        المريض
                    </div>


                    <div class="card-description">

                        احجز موعدك مع الطبيب
                        <br>
                        وتابع حالة حجزك بسهولة.

                    </div>
