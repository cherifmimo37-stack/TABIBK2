<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>طبيبك | TABIBK</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   TABIBK PREMIUM LOGIN
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


:root{

    --purple-dark:#321447;

    --purple:#5a2478;

    --purple-main:#71378f;

    --purple-light:#9a5ab5;

    --gold:#c99c3e;

    --gold-light:#e8cf7d;

    --white:#ffffff;

    --text:#2e1439;

}


/* =========================================================
   BODY
   ========================================================= */

html,
body{

    width:100%;

    min-height:100%;

}


body{

    font-family:"Cairo",sans-serif;

    color:var(--text);

    overflow-x:hidden;

    background:

        radial-gradient(
            circle at 12% 12%,
            rgba(222,192,238,.20),
            transparent 25%
        ),

        radial-gradient(
            circle at 90% 18%,
            rgba(225,190,241,.16),
            transparent 28%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(34,9,48,.42),
            transparent 45%
        ),

        linear-gradient(
            135deg,
            #301244 0%,
            #4b1e65 32%,
            #693482 66%,
            #432052 100%
        );

}


/* =========================================================
   MEDICAL BACKGROUND
   ========================================================= */

.medical-background{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:0;

}


.medical-background::before{

    content:"";

    position:absolute;

    width:650px;

    height:650px;

    top:-300px;

    right:-220px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(239,218,249,.20),
            transparent 68%
        );

}


.medical-background::after{

    content:"";

    position:absolute;

    width:650px;

    height:650px;

    bottom:-350px;

    left:-260px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(188,126,218,.20),
            transparent 68%
        );

}


/* =========================================================
   MEDICAL GRID
   ========================================================= */

.medical-grid{

    position:absolute;

    inset:0;

    opacity:.13;

    background-image:

        linear-gradient(
            rgba(255,255,255,.16) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.16) 1px,
            transparent 1px
        );

    background-size:42px 42px;

    mask-image:

        linear-gradient(
            to bottom,
            transparent,
            black 15%,
            black 85%,
            transparent
        );

}


/* =========================================================
   MEDICAL CIRCLES
   ========================================================= */

.medical-circle{

    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.12);

}


.circle-one{

    width:270px;

    height:270px;

    right:-110px;

    top:35%;

}


.circle-two{

    width:190px;

    height:190px;

    left:-75px;

    top:28%;

}


/* =========================================================
   MEDICAL CROSSES
   ========================================================= */

.cross{

    position:absolute;

    color:#ffffff;

    opacity:.08;

    font-size:75px;

    font-weight:300;

}


.cross-a{

    top:22%;

    left:4%;

}


.cross-b{

    bottom:22%;

    right:5%;

}


/* =========================================================
   ECG
   ========================================================= */

.ecg{

    position:absolute;

    width:100%;

    height:190px;

    left:0;

    top:48%;

    opacity:.16;

}


.ecg path{

    fill:none;

    stroke:#f1ddfb;

    stroke-width:3;

    stroke-linecap:round;

    stroke-linejoin:round;

}


/* =========================================================
   PAGE
   ========================================================= */

.page{

    position:relative;

    z-index:5;

    width:100%;

    max-width:980px;

    margin:auto;

    padding:
        18px 18px
        35px;

}


/* =========================================================
   ADMIN
   ========================================================= */

.admin-wrapper{

    width:100%;

    display:flex;

    justify-content:flex-start;

    margin-top:18px;

    margin-bottom:4px;

}


.admin{

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        8px 13px;

    border-radius:30px;

    color:#ffffff;

    text-decoration:none;

    font-size:10px;

    font-weight:800;

    background:

        rgba(54,19,70,.55);

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:

        0 8px 24px
        rgba(20,5,28,.22);

    backdrop-filter:blur(14px);

    transition:.25s ease;

}


.admin:hover{

    transform:translateY(-2px);

    border-color:
        rgba(232,207,125,.60);

}


.admin-icon{

    width:23px;

    height:23px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    color:#432052;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            var(--gold)
        );

    font-size:11px;

}


/* =========================================================
   HEADER
   ========================================================= */

.header{

    text-align:center;

    margin-top:2px;

    margin-bottom:25px;

}


/* =========================================================
   PROFESSIONAL HEART LOGO
   ========================================================= */

.logo{

    position:relative;

    width:110px;

    height:110px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

}


.logo-ring{

    position:absolute;

    inset:4px;

    border-radius:50%;

    border:
        1px solid
        rgba(232,207,125,.75);

    box-shadow:

        0 0 35px
        rgba(232,207,125,.14);

}


.logo-ring-two{

    position:absolute;

    inset:12px;

    border-radius:50%;

    border:
        1px dashed
        rgba(255,255,255,.30);

}


/* heart */

.heart{

    position:relative;

    width:52px;

    height:46px;

    transform:rotate(-45deg);

    background:

        linear-gradient(
            145deg,
            #e0bd60,
            #a97820
        );

    border-radius:
        7px 7px
        8px 7px;

    box-shadow:

        0 12px 25px
        rgba(0,0,0,.18);

    z-index:2;

}


.heart::before,
.heart::after{

    content:"";

    position:absolute;

    width:52px;

    height:52px;

    border-radius:50%;

    background:

        linear-gradient(
            145deg,
            #e0bd60,
            #a97820
        );

}


.heart::before{

    top:-25px;

    left:0;

}


.heart::after{

    left:25px;

    top:0;

}


/* ECG inside heart */

.logo-ecg{

    position:absolute;

    width:82px;

    height:35px;

    z-index:10;

}


.logo-ecg path{

    fill:none;

    stroke:#ffffff;

    stroke-width:4;

    stroke-linecap:round;

    stroke-linejoin:round;

}


/* =========================================================
   BRAND
   ========================================================= */

.brand{

    margin-top:2px;

    font-size:
        clamp(42px,7vw,62px);

    line-height:1;

    font-weight:900;

    color:#ffffff;

    letter-spacing:-2px;

    text-shadow:

        0 5px 18px
        rgba(0,0,0,.20);

}


.tabibk{

    margin-top:8px;

    color:#e5c7f0;

    font-size:13px;

    font-weight:800;

    letter-spacing:7px;

    padding-left:7px;

}


.subtitle{

    margin-top:7px;

    color:#eadcf0;

    font-size:11px;

    font-weight:600;

}


/* =========================================================
   LOGIN AREA
   ========================================================= */

.login-area{

    max-width:800px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:18px;

}


/* =========================================================
   CARDS
   ========================================================= */

.card{

    position:relative;

    min-height:385px;

    overflow:hidden;

    border-radius:28px;

    padding:16px;

    display:flex;

    flex-direction:column;

    justify-content:flex-end;

    text-decoration:none;

    color:var(--text);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.99),
            rgba(247,241,250,.97)
        );

    border:
        1px solid
        rgba(255,255,255,.70);

    box-shadow:

        0 30px 70px
        rgba(18,4,26,.28),

        inset
        0 1px 0
        rgba(255,255,255,1);

    backdrop-filter:blur(16px);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.card:hover{

    transform:translateY(-6px);

    box-shadow:

        0 35px 80px
        rgba(18,4,26,.36);

}


.card::before{

    content:"";

    position:absolute;

    top:0;

    left:16%;

    right:16%;

    height:3px;

    border-radius:
        0 0 10px 10px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--gold-light),
            transparent
        );

}


/* =========================================================
   AVATAR AREA
   ========================================================= */

.avatar-area{

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:270px;

    display:flex;

    align-items:center;

    justify-content:center;

}


.avatar-glow{

    position:absolute;

    width:235px;

    height:235px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(117,58,147,.22) 0%,
            rgba(170,116,196,.12) 42%,
            transparent 70%
        );

}


/* =========================================================
   PERSON
   ========================================================= */

.person{

    position:relative;

    width:190px;

    height:235px;

    z-index:3;

    filter:

        drop-shadow(
            0 20px 18px
            rgba(48,20,61,.20)
        );

}


/* hair */

.person .hair{

    position:absolute;

    width:105px;

    height:67px;

    top:9px;

    left:50%;

    transform:translateX(-50%);

    background:

        linear-gradient(
            145deg,
            #422b46,
            #17101c 75%
        );

    border-radius:
        50px 50px
        30px 30px;

    z-index:4;

    box-shadow:

        inset
        5px 3px 8px
        rgba(255,255,255,.08);

}


/* face */

.person .face{

    position:absolute;

    width:94px;

    height:108px;

    top:27px;

    left:50%;

    transform:translateX(-50%);

    border-radius:
        45% 45%
        46% 46%;

    background:

        linear-gradient(
            135deg,
            #ffe1c9 0%,
            #f2b895 55%,
            #c8795b 100%
        );

    box-shadow:

        inset
        7px 5px 12px
        rgba(255,255,255,.38),

        inset
        -8px -10px 15px
        rgba(101,45,34,.13);

    z-index:3;

}


/* eyes */

.person .eye{

    position:absolute;

    top:57px;

    width:8px;

    height:6px;

    border-radius:50%;

    background:#362033;

    box-shadow:
        0 1px 1px
        rgba(255,255,255,.4);

    z-index:6;

}


.person .eye.one{

    left:25px;

}


.person .eye.two{

    right:25px;

}


/* nose */

.person .face::after{

    content:"";

    position:absolute;

    width:7px;

    height:13px;

    top:61px;

    left:50%;

    transform:translateX(-50%);

    border-right:
        2px solid
        rgba(121,67,50,.30);

    border-bottom:
        2px solid
        rgba(121,67,50,.18);

    z-index:6;

}


/* smile */

.person .smile{

    position:absolute;

    top:79px;

    left:50%;

    transform:translateX(-50%);

    width:27px;

    height:12px;

    border-bottom:
        2px solid
        #944c53;

    border-radius:50%;

    z-index:6;

}


/* body */

.person .body{

    position:absolute;

    width:155px;

    height:112px;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    border-radius:
        70px 70px
        22px 22px;

}


/* =========================================================
   PATIENT
   ========================================================= */

.patient .body{

    background:

        linear-gradient(
            145deg,
            #8d5aab,
            #4b2165
        );

    box-shadow:

        inset
        10px 8px 18px
        rgba(255,255,255,.13),

        inset
        -12px -12px 20px
        rgba(35,10,48,.25);

}


.patient .shirt{

    position:absolute;

    width:108px;

    height:90px;

    left:50%;

    bottom:0;

    transform:translateX(-50%);

    border-radius:
        45px 45px
        12px 12px;

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #e9deef
        );

    box-shadow:

        inset
        5px 3px 8px
        rgba(255,255,255,.8);

}


/* =========================================================
   DOCTOR
   ========================================================= */

.doctor .body{

    background:

        linear-gradient(
            145deg,
            #ffffff,
            #ded5e4
        );

    box-shadow:

        inset
        10px 7px 18px
        rgba(255,255,255,.95),

        inset
        -10px -12px 18px
        rgba(87,48,100,.12);

}


.doctor .shirt{

    position:absolute;

    width:112px;

    height:91px;

    left:50%;

    bottom:0;

    transform:translateX(-50%);

    border-radius:
        48px 48px
        12px 12px;

    background:#ffffff;

}


/* tie */

.tie{

    position:absolute;

    top:0;

    left:50%;

    transform:translateX(-50%);

    width:16px;

    height:61px;

    background:

        linear-gradient(
            90deg,
            #4c1d65,
            #a86bc4,
            #4c1d65
        );

    clip-path:

        polygon(
            28% 0,
            72% 0,
            100% 100%,
            50% 82%,
            0 100%
        );

}


/* stethoscope */

.stethoscope{

    position:absolute;

    right:7px;

    top:17px;

    width:52px;

    height:58px;

    border:
        4px solid
        var(--gold);

    border-top:0;

    border-radius:
        0 0 30px 30px;

    z-index:7;

    filter:

        drop-shadow(
            0 2px 2px
            rgba(86,52,20,.15)
        );

}


.stethoscope::after{

    content:"";

    position:absolute;

    width:14px;

    height:14px;

    border-radius:50%;

    background:

        linear-gradient(
            145deg,
            #e1bd61,
            #ae7c21
        );

    bottom:-8px;

    left:14px;

}


/* =========================================================
   CARD CONTENT
   ========================================================= */

.card-content{

    position:relative;

    z-index:10;

    text-align:center;

}


.card-title{

    color:#32143e;

    font-size:26px;

    font-weight:900;

}


.card-text{

    margin:
        3px 0
        12px;

    min-height:42px;

    color:#78677e;

    font-size:10px;

    line-height:1.8;

}


/* =========================================================
   BIG LOGIN BUTTON
   ========================================================= */

.button{

    width:100%;

    height:58px;

    border-radius:31px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    color:#ffffff;

    font-size:13px;

    font-weight:900;

    background:

        linear-gradient(
            100deg,
            #4e1e68 0%,
            #71378f 48%,
            #985ab6 100%
        );

    box-shadow:

        0 13px 30px
        rgba(78,30,105,.30),

        inset
        0 1px 0
        rgba(255,255,255,.20);

}


.button span{

    font-size:17px;

}


.card:hover .button{

    box-shadow:

        0 16px 35px
        rgba(78,30,105,.38);

}


/* =========================================================
   FEATURES
   ========================================================= */

.features{

    max-width:700px;

    margin:
        24px auto
        0;

    display:flex;

}


.feature{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    color:#f0e4f4;

    font-size:9px;

}


.feature + .feature{

    border-right:
        1px solid
        rgba(255,255,255,.20);

}


.feature b{

    color:var(--gold-light);

    font-size:14px;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer{

    text-align:center;

    margin-top:22px;

}


.footer strong{

    color:#ead3f2;

    font-size:9px;

    letter-spacing:5px;

}


.footer p{

    margin-top:3px;

    color:#d1bfd8;

    font-size:8px;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    .page{

        padding:
            14px 7px
            25px;

    }


    .admin-wrapper{

        margin-top:13px;

        margin-bottom:2px;

    }


    .admin{

        padding:
            7px 11px;

        font-size:8px;

    }


    .admin-icon{

        width:21px;

        height:21px;

    }


    .header{

        margin-bottom:16px;

    }


    .logo{

        width:91px;

        height:91px;

    }


    .heart,
    .heart::before,
    .heart::after{

        width:43px;

        height:43px;

    }


    .heart::before{

        top:-21px;

    }


    .heart::after{

        left:21px;

    }


    .logo-ecg{

        width:67px;

    }


    .brand{

        font-size:38px;

    }


    .tabibk{

        font-size:10px;

        letter-spacing:6px;

    }


    .subtitle{

        font-size:8px;

    }


    .login-area{

        gap:7px;

    }


    .card{

        min-height:335px;

        padding:
            8px 6px;

        border-radius:19px;

    }


    .avatar-area{

        height:215px;

    }


    .avatar-glow{

        width:180px;

        height:180px;

    }


    .person{

        transform:scale(.76);

    }


    .card-title{

        font-size:18px;

    }


    .card-text{

        font-size:7px;

        min-height:39px;

        margin-bottom:7px;

    }


    .button{

        height:48px;

        font-size:9px;

        border-radius:27px;

    }


    .button span{

        font-size:14px;

    }


    .features{

        margin-top:16px;

    }


    .feature{

        font-size:6.5px;

        gap:3px;

    }


    .feature b{

        font-size:10px;

    }


    .footer{

        margin-top:17px;

    }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media(max-width:360px){

    .page{

        padding-left:4px;

        padding-right:4px;

    }


    .login-area{

        gap:5px;

    }


    .card{

        min-height:320px;

    }


    .avatar-area{

        height:200px;

    }


    .person{

        transform:scale(.68);

    }


    .card-title{

        font-size:15px;

    }


    .card-text{

        font-size:6.5px;

    }


    .button{

        height:45px;

        font-size:8px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     MEDICAL BACKGROUND
     ========================================================= -->

<div class="medical-background">

    <div class="medical-grid"></div>

    <div class="medical-circle circle-one"></div>

    <div class="medical-circle circle-two"></div>

    <div class="cross cross-a">+</div>

    <div class="cross cross-b">+</div>


    <svg
        class="ecg"
        viewBox="0 0 1200 190"
        preserveAspectRatio="none"
    >

        <path
            d="
                M0 98
                H180
                L220 98
                L248 48
                L280 148
                L310 98
                H455
                L490 98
                L520 62
                L552 132
                L580 98
                H740
                L780 98
                L812 43
                L845 150
                L875 98
                H1020
                L1050 98
                L1080 70
                L1110 125
                L1140 98
                H1200
            "
        />

    </svg>

</div>



<!-- =========================================================
     PAGE
     ========================================================= -->

<main class="page">


    <!-- ADMIN -->

    <div class="admin-wrapper">

        <a
            href="/admin.html"
            class="admin"
        >

            <span class="admin-icon">
                ⚙
            </span>

            <span>
                الإدارة
            </span>

            <span>
                ←
            </span>

        </a>

    </div>



    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">


        <div class="logo">

            <div class="logo-ring"></div>

            <div class="logo-ring-two"></div>

            <div class="heart"></div>


            <svg
                class="logo-ecg"
                viewBox="0 0 150 60"
            >

                <path
                    d="
                        M3 31
                        H32
                        L45 31
                        L57 8
                        L69 52
                        L82 31
                        H105
                        L116 31
                        L126 20
                        L137 42
                        L147 31
                    "
                />

            </svg>

        </div>


        <div class="brand">
            طبيبك
        </div>


        <div class="tabibk">
            TABIBK
        </div>


        <div class="subtitle">
            رعايتك الصحية تبدأ من هنا
        </div>

    </header>



    <!-- =====================================================
         LOGIN CARDS
         ===================================================== -->

    <section class="login-area">


        <!-- =================================================
             PATIENT
             ================================================= -->

        <a
            href="/patient.html"
            class="card"
        >


            <div class="avatar-area">

                <div class="avatar-glow"></div>


                <div class="person patient">


                    <div class="hair"></div>


                    <div class="face">

                        <span class="eye one"></span>

                        <span class="eye two"></span>

                        <span class="smile"></span>

                    </div>


                    <div class="body">

                        <div class="shirt"></div>

                    </div>


                </div>

            </div>
