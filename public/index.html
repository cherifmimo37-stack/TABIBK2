<style>

/* =========================================================
   TABIBK PREMIUM MEDICAL GLASS
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{

    --purple-dark:#100820;
    --purple:#24103f;
    --purple-mid:#35195b;
    --purple-light:#512b7b;

    --gold:#d8ad5b;
    --gold-light:#f1d58e;

    --white:#ffffff;
    --muted:#c9bed5;

}

html,
body{

    width:100%;
    min-height:100%;

}

body{

    font-family:"Cairo",sans-serif;

    color:white;

    background:#100820;

    overflow-x:hidden;

}


/* =========================================================
   MAIN BACKGROUND
   ========================================================= */

.page{

    min-height:100vh;

    position:relative;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(119,66,181,.30),
            transparent 31%
        ),

        radial-gradient(
            circle at 90% 30%,
            rgba(82,42,133,.25),
            transparent 28%
        ),

        radial-gradient(
            circle at 50% 110%,
            rgba(211,166,78,.10),
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #0d0618 0%,
            #1d0d34 42%,
            #281348 70%,
            #10071e 100%
        );

}


/* medical decorative glow */

.page::before{

    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    top:-220px;
    right:-170px;

    background:

        radial-gradient(
            circle,
            rgba(168,116,226,.24),
            rgba(168,116,226,0)
        );

    filter:blur(10px);

}


.page::after{

    content:"";

    position:absolute;

    width:380px;
    height:380px;

    border-radius:50%;

    bottom:-230px;
    left:-180px;

    background:

        radial-gradient(
            circle,
            rgba(224,185,92,.13),
            rgba(224,185,92,0)
        );

}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{

    position:relative;

    z-index:10;

    width:100%;

    padding:

        15px
        17px
        0;

    display:flex;

    justify-content:flex-end;

}


/* ADMIN TOP BUTTON */

.admin-btn{

    height:40px;

    padding:

        0
        15px;

    border-radius:13px;

    border:

        1px solid
        rgba(239,204,126,.38);

    background:

        rgba(255,255,255,.065);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    color:#f2d58d;

    font-family:inherit;

    font-size:11px;

    font-weight:800;

    display:flex;

    align-items:center;

    gap:6px;

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.09),

        0 8px 25px
        rgba(0,0,0,.16);

}


/* =========================================================
   CENTER BRAND
   ========================================================= */

.brand-area{

    position:relative;

    z-index:5;

    text-align:center;

    padding:

        13px
        20px
        8px;

}


/* LOGO */

.logo{

    width:76px;

    height:76px;

    margin:

        0
        auto
        9px;

    border-radius:24px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        linear-gradient(
            145deg,
            #f0d48b,
            #b78331
        );

    border:

        1px solid
        rgba(255,255,255,.42);

    box-shadow:

        0 13px 35px
        rgba(0,0,0,.30),

        0 0 35px
        rgba(221,176,83,.12),

        inset 0 1px
        rgba(255,255,255,.70);

}


/* heart */

.logo svg{

    width:51px;

    height:51px;

}


/* BRAND */

.brand-title{

    font-size:29px;

    line-height:1;

    font-weight:900;

    letter-spacing:.2px;

}


.brand-title span{

    color:var(--gold-light);

}


.brand-sub{

    margin-top:5px;

    font-size:9px;

    font-weight:800;

    letter-spacing:3px;

    color:#a99ab8;

}


/* =========================================================
   HERO
   ========================================================= */

.hero{

    position:relative;

    z-index:4;

    text-align:center;

    padding:

        12px
        20px
        19px;

}


.hero-badge{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:

        6px
        12px;

    border-radius:30px;

    background:

        rgba(255,255,255,.045);

    border:

        1px solid
        rgba(255,255,255,.09);

    color:#d7cde1;

    font-size:9px;

    font-weight:700;

    backdrop-filter:blur(12px);

}


.status-dot{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#61d9a0;

    box-shadow:

        0 0 12px

}


.hero h1{

    margin-top:11px;

    font-size:22px;

    font-weight:900;

}


.hero p{

    margin:

        4px
        auto
        0;

    max-width:310px;

    color:#b9adca;

    font-size:10px;

    line-height:1.8;

}


/* =========================================================
   LOGIN AREA
   ========================================================= */

.login-area{

    position:relative;

    z-index:5;

    width:100%;

    max-width:540px;

    margin:auto;

    padding:

        0
        14px
        25px;

}


.cards{

    display:grid;

    grid-template-columns:

        1fr
        1fr;

    gap:11px;

}


/* =========================================================
   ROLE CARD
   ========================================================= */

.role-card{

    position:relative;

    min-height:250px;

    padding:

        11px
        10px
        12px;

    border-radius:25px;

    overflow:hidden;

    cursor:pointer;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.035)
        );

    border:

        1px solid
        rgba(224,181,91,.58);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:

        0 20px 45px
        rgba(0,0,0,.27),

        inset 0 1px
        rgba(255,255,255,.11),

        0 0 20px
        rgba(218,174,84,.045);

    transition:

        transform .18s ease,

        box-shadow .18s ease;

}


.role-card:active{

    transform:scale(.965);

    box-shadow:

        0 10px 25px
        rgba(0,0,0,.32),

        0 0 20px
        rgba(218,174,84,.10);

}


/* glow inside card */

.role-card::before{

    content:"";

    position:absolute;

    width:150px;

    height:150px;

    border-radius:50%;

    top:-85px;

    right:-70px;

    background:

        radial-gradient(
            circle,
            rgba(157,101,216,.25),
            transparent 68%
        );

}


.role-card::after{

    content:"";

    position:absolute;

    width:110px;

    height:110px;

    border-radius:50%;

    bottom:-65px;

    left:-55px;

    background:

        radial-gradient(
            circle,
            rgba(226,183,87,.12),
            transparent 70%
        );

}


/* =========================================================
   CARD HEADER
   ========================================================= */

.card-top{

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.role-label{

    color:#cfc2dc;

    font-size:8px;

    font-weight:700;

}


.online{

    width:7px;

    height:7px;

    border-radius:50%;

    background:#64dca4;

    box-shadow:

        0 0 10px

}


/* =========================================================
   AI IMAGE
   ========================================================= */

.avatar{

    position:relative;

    z-index:2;

    width:112px;

    height:112px;

    margin:

        10px

        6px;

    border-radius:50%;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 25%,
            #7952a1,
            #32184f 78%
        );

    border:

        2px solid
        rgba(239,204,126,.72);

    box-shadow:

        0 13px 30px
        rgba(0,0,0,.32),

        0 0 0 7px

}


/*
   الصور الموجودة في GitHub
   public/images/ai...
*/

.avatar img{

    height:100%;

    object-fit:cover;

    display:block;

}


/* =========================================================
   CARD TEXT
   ========================================================= */

.card-title{

    position:relative;

    z-index:2;

    text-align:center;

    font-size:17px;

    font-weight:900;

}


.card-sub{

    position:relative;

    z-index:2;

    text-align:center;

    margin-top:1px;

    color:#aaa0b9;

    font-size:8px;

}


/* =========================================================
   LARGE LOGIN BUTTON
   ========================================================= */

.login-btn{

    position:relative;

    z-index:3;

    width:100%;

    height:44px;

    margin-top:10px;

    border-radius:13px;

    border:

        1px solid
        rgba(255,255,255,.22);

    background:

        linear-gradient(
            135deg,
            #ead08a,
            #bc8a39
        );

    color:#251431;

    font-family:inherit;

    font-size:12px;

    font-weight:900;

    box-shadow:

        0 9px 20px
        rgba(205,159,67,.18),

        inset 0 1px
        rgba(255,255,255,.65);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

}


.login-btn:active{

    transform:scale(.97);

}


.login-arrow{

    font-size:17px;

    line-height:1;

}


/* =========================================================
   SECURITY
   ========================================================= */

.security{

    position:relative;

    z-index:3;

    display:flex;

    justify-content:center;

    gap:14px;

    margin-top:17px;

    color:#857995;

    font-size:7px;

}


.security span{

    display:flex;

    align-items:center;

    gap:4px;

}


/* =========================================================
   ADMIN MODAL
   ========================================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:flex-end;

    justify-content:center;

    background:

        rgba(5,2,12,.76);

    backdrop-filter:blur(10px);

}


.modal.show{

    display:flex;

}


.modal-box{

    width:100%;

    max-width:540px;

    padding:

        20px
        18px
        28px;

    border-radius:

        28px
        28px
        0
        0;

    background:

        linear-gradient(
            145deg,
            #2b1748,
            #160b28
        );

    border-top:

        1px solid
        rgba(235,196,108,.35);

    box-shadow:

        0 -20px 60px
        rgba(0,0,0,.45);

    animation:

        slideUp .25s ease;

}


@keyframes slideUp{

    from{

        transform:translateY(100%);

        opacity:.4;

    }

    to{

        transform:translateY(0);

        opacity:1;

    }

}


.modal-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:17px;

}


.modal-head h2{

    font-size:18px;

    font-weight:900;

}


.close{

    width:35px;

    height:35px;

    border:0;

    border-radius:11px;

    background:

        rgba(255,255,255,.07);

    color:white;

    font-size:19px;

}


.input{

    width:100%;

    height:50px;

    margin-bottom:10px;

    padding:

        0
        14px;

    border-radius:14px;

    border:

        1px solid
        rgba(255,255,255,.09);

    outline:none;

    background:

        rgba(0,0,0,.18);

    color:white;

    font-family:inherit;

    font-size:12px;

}


.input::placeholder{

    color:#81748e;

}


.submit{

    width:100%;

    height:50px;

    border:0;

    border-radius:14px;

    background:

        linear-gradient(
            135deg,
            #ead08a,
            #bd8b3b
        );

    color:#24132f;

    font-family:inherit;

    font-weight:900;

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:350px){

    .topbar{

        padding:

            11px
            12px
            0;

    }

    .admin-btn{

        height:36px;

        padding:

            0
            11px;

        font-size:10px;

    }

    .logo{

        width:66px;

        height:66px;

        border-radius:21px;

    }

    .logo svg{

        width:44px;

        height:44px;

    }

    .brand-title{

        font-size:26px;

    }

        padding-bottom:14px;

    }

        min-height:235px;

    }

    .card-title{

        font-size:15px;

    }

    .login-btn{

        height:42px;

        font-size:11px;

    }

}


</style>

</head>

</div>

<script>

/* =========================================================
   TABIBK NAVIGATION
   ========================================================= */


/*
   حافظت هنا على نفس فكرة الروابط.
   إذا كانت عندك وظائف الدخول الحالية داخل index.html،
   نربطها مكان هذه الدوال بدون المساس بالواجهة.
*/


function doctorLogin(){

    window.location.href =
        "/doctor-login.html";

}


function patientLogin(){

    window.location.href =
        "/patient-login.html";

}


/* =========================================================
   ADMIN
   ========================================================= */

function openAdmin(){

    document
        .getElementById("adminModal")
        .classList.add("show");

    setTimeout(function(){

        document
            .getElementById("adminUser")
            .focus();

    },100);

}


function closeAdmin(){

    document
        .getElementById("adminModal")
        .classList.remove("show");

}


function closeOutside(event){

    if(
        event.target.id ===
        "adminModal"
    ){

        closeAdmin();

    }

}


function adminLogin(){

    const user =
        document
        .getElementById("adminUser")
        .value
        .trim();


    const password =
        document
        .getElementById("adminPassword")
        .value
        .trim();


    if(
        !user ||
        !password
    ){

        alert(
            "يرجى إدخال اسم المستخدم وكلمة المرور."
        );

        return;

    }


    window.location.href =
        "/admin.html";

}


/* =========================================================
   ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeAdmin();

        }

    }
);

</script>
