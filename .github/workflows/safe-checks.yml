name: TABIBK Safe Checks

on:
  push:
    branches:
      - codex/audit-fixes-2026-10-14
    paths:
      - 'server.js'
      - 'public/admin.html'
      - 'public/doctor.html'
      - '.github/workflows/safe-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server.js'
      - 'public/admin.html'
      - 'public/doctor.html'
      - '.github/workflows/safe-checks.yml'

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax and whitespace checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check server JavaScript syntax
        run: node --check server.js

      - name: Check changed lines for whitespace errors
        run: git diff --check origin/main...HEAD

      - name: Check inline JavaScript in admin and doctor pages
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  script_type = (attrs.get("type") or "").lower().split(";")[0].strip()
                  if attrs.get("src") or script_type in ("application/json", "application/ld+json", "importmap"):
                      self.current = None
                      return
                  self.current = []
                  self.scripts.append(self.current)

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.current = None

          for html_file in ("public/admin.html", "public/doctor.html"):
              parser = ScriptExtractor()
              parser.feed(Path(html_file).read_text(encoding="utf-8"))
              scripts = ["".join(parts) for parts in parser.scripts]
              scripts = [script for script in scripts if script.strip()]
              for index, script in enumerate(scripts, start=1):
                  js_file = Path("/tmp") / f"{Path(html_file).stem}-inline-{index}.js"
                  js_file.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(js_file)], check=True)
              print(f"{html_file}: checked {len(scripts)} inline script(s)")
          PY

  auth-smoke:
    name: Authentication and doctor workflow smoke tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabibk_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tabibk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabibk_test -d tabibk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORT: 10000
      ADMIN_KEY: tabibk-ci-test-admin-key
      DATABASE_URL: postgres://tabibk_test:postgres@127.0.0.1:5432/tabibk_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Start server against isolated test database
        run: |
          node server.js > /tmp/tabibk-server.log 2>&1 &
          echo $! > /tmp/tabibk-server.pid

      - name: Test admin and doctor authentication flows
        run: node tests/auth-smoke.mjs

      - name: Show server log if a test fails
        if: failure()
        run: cat /tmp/tabibk-server.log
